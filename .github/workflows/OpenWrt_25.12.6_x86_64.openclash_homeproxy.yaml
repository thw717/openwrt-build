name: OpenWrt 25.12.6 x86_64 openclash_homeproxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v5
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk git libncurses-dev \
            libssl-dev python3 python3-pyelftools rsync unzip zlib1g-dev file wget curl ccache swig time
          sudo apt-get autoremove -y; sudo apt-get clean

      - name: Prepare feeds
        run: |
          cd $GITHUB_WORKSPACE
          cat >> feeds.conf.default <<'EOF'

          src-git ddnsto https://github.com/linkease/ddnsto-openwrt.git
          src-git openclash https://github.com/vernesong/OpenClash.git
          src-git homeproxy https://github.com/immortalwrt/homeproxy.git
          EOF
          cat feeds.conf.default

      - name: Clone third-party packages
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p package/custom
          git clone --depth 1 https://github.com/mufeng05/openwrt-sonic-fullcone.git package/custom/sonic-fullcone
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git package/custom/luci-app-cpu-status-mini
          ls package/custom/

      - name: Update & install feeds
        run: |
          cd $GITHUB_WORKSPACE
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p ddnsto -a || true
          ./scripts/feeds install -p openclash -a || true
          ./scripts/feeds install -p homeproxy -a || true

      - name: Generate .config
        run: |
          cd $GITHUB_WORKSPACE
          make defconfig
          cat >> .config <<'EOF'

          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_TARGET_ROOTFS_CPIOGZ=n
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_EFI_IMAGES=y

          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y

          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_sonic-fullcone=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y

          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-r8125=y
          CONFIG_PACKAGE_kmod-atlantic=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-mii=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_opkg=y
          EOF
          make defconfig

      - name: Inject files overlay
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p files/etc/config files/etc/uci-defaults

          cat > files/etc/config/network <<'NET'
          config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'
          config globals 'globals'
          config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth1'
              list ports 'eth2'
              list ports 'eth3'
              list ports 'eth4'
          config interface 'lan'
              option device 'br-lan'
              option proto 'static'
              option ipaddr '192.168.15.1'
              option netmask '255.255.255.0'
              option ip6assign '64'
          config interface 'wan'
              option device 'eth0'
              option proto 'dhcp'
          config interface 'wan6'
              option device 'eth0'
              option proto 'dhcpv6'
          NET

          cat > files/etc/config/luci <<'LUCI'
          config core 'main'
              option lang 'zh_Hans'
              option mediaurlbase '/luci-static/bootstrap'
              option resourcebase '/luci-static/resources'
          config internal 'languages'
              option zh_Hans '简体中文'
              option en 'English'
          config internal 'themes'
              option Bootstrap '/luci-static/bootstrap'
          LUCI

          cat > files/etc/config/ddnsto <<'DDNS'
          config ddnsto 'config'
              option enabled '0'
              option token ''
              option device_index '0'
          DDNS

          cat > files/etc/uci-defaults/99-fix-ddnsto <<'UD'
          #!/bin/sh
          uci -q batch <<'EOF' >/dev/null
          delete ddnsto.@ddnsto[0]
          set ddnsto.cfg='ddnsto'
          set ddnsto.cfg.enabled='0'
          set ddnsto.cfg.token=''
          commit ddnsto
          EOF
          exit 0
          UD
          chmod +x files/etc/uci-defaults/99-fix-ddnsto

          cat > files/etc/config/cpu_status_mini <<'CPU'
          config cpu_status_mini 'main'
              option enabled '1'
              option interval '1'
          CPU

          find files -type f | sort

      - name: Cache dl
        uses: actions/cache@v4
        with:
          path: dl
          key: owrt-dl-${{ hashFiles('.config') }}
          restore-keys: owrt-dl-

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          make download -j$(nproc) V=s
          make -j$(nproc) || make -j1 V=s

      - name: Collect
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out
          cp bin/targets/x86/64/*.img.gz bin/targets/x86/64/*.manifest bin/targets/x86/64/sha256sums out/ 2>/dev/null || true
          cp .config out/config.build
          ls -lh out/

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-x86_64-25.12.6 openclash_homeproxy
          path: out/
          retention-days: 9
          if-no-files-found: error