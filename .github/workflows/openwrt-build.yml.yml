# ============================================================
# OpenWrt 25.12-SNAPSHOT x86/64 固件编译工作流
# ============================================================
# 触发方式：仅手动触发 (Workflow Dispatch)
# 运行环境：ubuntu-24.04
# ============================================================

name: OpenWrt x86_64 Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'OpenWrt 源码分支/标签 (默认 openwrt-25.12)'
        required: false
        default: 'openwrt-25.12'
        type: string
      upload_artifact:
        description: '是否上传固件制品 (默认 true)'
        required: false
        default: 'true'
        type: string

env:
  TZ: Asia/Shanghai
  FEEDS_UPDATE: 'true'

jobs:
  build:
    name: OpenWrt Firmware Build
    runs-on: ubuntu-24.04

    steps:
    # ============================================================
    # Step 1: 检出 OpenWrt 官方源码
    # ============================================================
    - name: Checkout OpenWrt Source
      uses: actions/checkout@v5
      with:
        repository: openwrt/openwrt
        ref: ${{ github.event.inputs.ref || 'openwrt-25.12' }}
        submodules: recursive
        fetch-depth: 0

    # ============================================================
    # Step 2: 磁盘空间清理 (GitHub Runner 空间有限)
    # ============================================================
    - name: Disk Cleanup
      run: |
        echo "=== 磁盘空间使用前 ==="
        df -h /
        sudo docker rmi $(docker images -q) 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo find / -type f -name "*.deb" -delete 2>/dev/null || true
        sudo find / -type f -name "*.msi" -delete 2>/dev/null || true
        sudo find / -type f -name "*.exe" -delete 2>/dev/null || true
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        echo "=== 磁盘空间清理后 ==="
        df -h /

    # ============================================================
    # Step 3: 安装编译依赖
    # ============================================================
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential gawk gcc-multilib g++-multilib \
          libc6-dev libncurses5-dev libncursesw5-dev \
          libssl-dev python3 python3-pip python3-setuptools \
          tk zlib1g-dev libidn11-dev libidn11 git wget curl \
          unzip xz-utils python3-distutils python3-openssl \
          screen libfile-fcntllock-perl libgmp-dev \
          libmpc-dev libmpfr-dev texinfo libxml-parser-perl \
          libtool autoconf automake pkg-config

    # ============================================================
    # Step 4: 更新并安装官方 feeds
    # ============================================================
    - name: Update Official Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================================
    # Step 5: 添加第三方包仓库
    # ============================================================
    - name: Add External Package Repositories
      run: |
        echo "=== 添加第三方包 ==="

        # --- OpenClash (vernesong/OpenClash) ---
        echo "[OpenClash] 克隆仓库..."
        git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash 2>/dev/null || true
        if [ -d /tmp/OpenClash/luci-app-openclash ]; then
          rm -rf package/luci-app-openclash
          mv /tmp/OpenClash/luci-app-openclash package/luci-app-openclash
          echo "[OpenClash] 已移动到 package/luci-app-openclash"
        else
          echo "[OpenClash] 警告: 未找到 luci-app-openclash 目录，尝试其他方式..."
          if [ -d /tmp/OpenClash ]; then
            rm -rf package/OpenClash
            mv /tmp/OpenClash package/OpenClash
            echo "[OpenClash] 已移动到 package/OpenClash (备用)"
          fi
        fi

        # --- homeproxy (immortalwrt/homeproxy) ---
        echo "[homeproxy] 克隆仓库..."
        git clone --depth 1 https://github.com/immortalwrt/homeproxy.git /tmp/homeproxy 2>/dev/null || true
        if [ -d /tmp/homeproxy/luci-app-homeproxy ]; then
          rm -rf package/luci-app-homeproxy
          mv /tmp/homeproxy/luci-app-homeproxy package/luci-app-homeproxy
          echo "[homeproxy] 已移动到 package/luci-app-homeproxy"
        else
          echo "[homeproxy] 警告: 未找到 luci-app-homeproxy 目录，列出目录结构:"
          [ -d /tmp/homeproxy ] && ls -la /tmp/homeproxy/
          if [ -d /tmp/homeproxy ]; then
            rm -rf package/homeproxy
            mv /tmp/homeproxy package/homeproxy
            echo "[homeproxy] 已移动到 package/homeproxy (备用)"
          fi
        fi

        # --- sonic-fullcone (mufeng05/openwrt-sonic-fullcone) ---
        echo "[sonic-fullcone] 克隆仓库..."
        git clone --depth 1 https://github.com/mufeng05/openwrt-sonic-fullcone.git /tmp/sonic-fullcone 2>/dev/null || true
        if [ -d /tmp/sonic-fullcone ]; then
          echo "[sonic-fullcone] 目录结构:"
          ls -la /tmp/sonic-fullcone/
          find /tmp/sonic-fullcone -name "Makefile" -type f 2>/dev/null | head -5
          rm -rf package/sonic-fullcone
          mv /tmp/sonic-fullcone package/sonic-fullcone
          echo "[sonic-fullcone] 已移动到 package/sonic-fullcone"
        fi

        # --- luci-app-cpu-status-mini (gSpotx2f/luci-app-cpu-status-mini) ---
        echo "[luci-app-cpu-status-mini] 克隆仓库..."
        git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git /tmp/luci-app-cpu-status-mini 2>/dev/null || true
        if [ -d /tmp/luci-app-cpu-status-mini ]; then
          rm -rf package/luci-app-cpu-status-mini
          mv /tmp/luci-app-cpu-status-mini package/luci-app-cpu-status-mini
          echo "[luci-app-cpu-status-mini] 已移动到 package/luci-app-cpu-status-mini"
        fi

        echo "=== 第三方包添加完成 ==="
        echo "package/ 目录内容:"
        ls -la package/

    # ============================================================
    # Step 6: 重新更新 feeds (识别新增的第三方包)
    # ============================================================
    - name: Re-update Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ============================================================
    # Step 7: 配置编译选项
    # ============================================================
    - name: Configure Build
      run: |
        echo "=== 配置编译选项 ==="

        # 先运行 defconfig 生成默认配置
        make defconfig

        echo ""
        echo "=== 修改 LAN 地址为 192.168.15.1/24 ==="
        # 修改 config_generate 脚本中的默认 LAN IP
        if [ -f package/base-files/files/bin/config_generate ]; then
          sed -i 's/ipaddr=${ipaddr:-"192.168.1.1"}/ipaddr=${ipaddr:-"192.168.15.1"}/g' package/base-files/files/bin/config_generate
          sed -i 's/ipaddr=${ipaddr:-"192.168.1.1"}/ipaddr=${ipaddr:-"192.168.15.1"}/g' package/base-files/files/etc/config/network 2>/dev/null || true
          echo "[OK] config_generate 已修改"
        else
          echo "[WARN] config_generate 不存在，尝试其他路径..."
          find package -name "config_generate" -type f 2>/dev/null | while read f; do
            sed -i 's/ipaddr=${ipaddr:-"192.168.1.1"}/ipaddr=${ipaddr:-"192.168.15.1"}/g' "$f"
            echo "[OK] 已修改: $f"
          done
        fi

        # 同时修改 target 中的 network 配置文件
        find target/linux/x86 -name "network" -type f 2>/dev/null | while read f; do
          sed -i 's/ipaddr '\'''\''/ipaddr '\''192.168.15.1'\''/g' "$f" 2>/dev/null || true
          sed -i 's/ipaddr=192.168.1.1/ipaddr=192.168.15.1/g' "$f" 2>/dev/null || true
        done

        echo ""
        echo "=== 启用基础包 ==="
        # 使用 sed 启用包 (处理 OpenWrt 25.12 的 i18n 命名变化)
        # 25.12 可能将 zh-cn 改为 zh_Hans

        # 定义函数：尝试启用包（先试 zh_Hans，再试 zh-cn）
        enable_pkg() {
          local pkg="$1"
          # 尝试新命名 (zh_Hans)
          sed -i "s/# CONFIG_PACKAGE_${pkg}-zh_Hans is not set/CONFIG_PACKAGE_${pkg}-zh_Hans=y/" .config
          # 尝试旧命名 (zh-cn)
          sed -i "s/# CONFIG_PACKAGE_${pkg}-zh-cn is not set/CONFIG_PACKAGE_${pkg}-zh-cn=y/" .config
        }

        # 启用所有指定的官方包
        PACKAGES_BASE=(
          "luci-i18n-base"
          "luci-i18n-firewall"
          "luci-app-ttyd"
          "miniupnpd-nftables"
          "luci-app-upnp"
          "luci-i18n-upnp"
          "ddns-scripts"
          "luci-app-ddns"
          "ddns-scripts-cloudflare"
          "ddns-scripts-dnspod"
          "curl"
          "ca-certificates"
          "luci-i18n-ddns"
          "luci-app-uhttpd"
          "luci-i18n-uhttpd"
          "luci-app-statistics"
          "collectd-mod-thermal"
          "kmod-thermal"
          "kmod-hwmon-core"
          "luci-i18n-statistics"
          "luci-app-homeproxy"
          "luci-i18n-homeproxy"
        )

        for pkg in "${PACKAGES_BASE[@]}"; do
          enable_pkg "$pkg"
        done

        # 启用第三方包
        THIRD_PARTY_PACKAGES=(
          "luci-app-openclash"
          "luci-app-cpu-status-mini"
          "sonic-fullcone"
        )

        for pkg in "${THIRD_PARTY_PACKAGES[@]}"; do
          sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=y/" .config
        done

        # 确保基础 Luci 和相关包被启用
        BASIC_PACKAGES=(
          "luci"
          "luci-base"
          "luci-compat"
          "luci-nginx"
          "luci-proto-ipv6"
          "luci-proto-ppp"
          "rpcd"
          "rpcd-mod-rrdns"
          "firewall4"
          "nftables"
          "dnsmasq-full"
          "ip-full"
          "kmod-nft-core"
          "kmod-nft-fib"
          "kmod-nft-nat"
          "kmod-nft-redirect"
          "kmod-nft-tproxy"
          "kmod-tun"
          "kmod-inet-diag"
          "kmod-phy-ath79-usb"
          "kmod-usb-net"
          "kmod-usb-net-rndis"
          "kmod-usb-ohci"
          "kmod-usb-uhci"
          "kmod-usb2"
          "kmod-usb3"
          "kmod-e1000"
          "kmod-e1000e"
          "kmod-igb"
          "kmod-ixgbe"
          "kmod-r8169"
          "kmod-r8168"
          "kmod-virtio-net"
          "kmod-virtio-blk"
          "kmod-virtio-scsi"
          "kmod-virtio-pci"
          "kmod-virtio"
          "kmod-i40e"
          "kmod-igc"
          "kmod-ptp"
          "usbutils"
          "lsusb"
          "pciutils"
          "lspci"
          "ethtool"
          "iwinfo"
          "wpad-basic"
          "hostapd-common"
          "kmod-cfg80211"
          "mac80211"
        )

        for pkg in "${BASIC_PACKAGES[@]}"; do
          sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=y/" .config
        done

        # 确保 x86_64 目标被正确选择
        sed -i 's/# CONFIG_TARGET_x86 is not set/CONFIG_TARGET_x86=y/' .config
        sed -i 's/# CONFIG_TARGET_x86_64 is not set/CONFIG_TARGET_x86_64=y/' .config
        sed -i 's/# CONFIG_TARGET_SUBTARGET_64 is not set/CONFIG_TARGET_SUBTARGET_64=y/' .config

        # 启用 KVM 相关内核选项
        sed -i 's/# CONFIG_KVM is not set/CONFIG_KVM=y/' .config
        sed -i 's/# CONFIG_VIRTIO_PCI is not set/CONFIG_VIRTIO_PCI=y/' .config
        sed -i 's/# CONFIG_VIRTIO_NET is not set/CONFIG_VIRTIO_NET=y/' .config
        sed -i 's/# CONFIG_VIRTIO_BLK is not set/CONFIG_VIRTIO_BLK=y/' .config
        sed -i 's/# CONFIG_VIRTIO_SCSI is not set/CONFIG_VIRTIO_SCSI=y/' .config
        sed -i 's/# CONFIG_VIRTIO is not set/CONFIG_VIRTIO=y/' .config
        sed -i 's/# CONFIG_NETDEVICES_VIRTUAL is not set/CONFIG_NETDEVICES_VIRTUAL=y/' .config

        echo ""
        echo "=== 运行 defconfig 解析依赖 ==="
        make defconfig

        echo ""
        echo "=== 最终配置摘要 ==="
        grep -E "CONFIG_TARGET_|CONFIG_PACKAGE_(luci|ddns|miniupnp|ttyd|statistic|thermal|hwmon|uhttpd|homeproxy|openclash|cpu-status|sonic|curl|ca-cert)" .config | sort | head -80

    # ============================================================
    # Step 8: 编译固件
    # ============================================================
    - name: Build Firmware
      run: |
        echo "=== 开始编译 OpenWrt ==="
        echo "并行线程数: $(nproc)"
        echo "可用内存: $(free -h | awk '/^Mem:/{print $2}')"
        echo ""

        # 使用 make 编译，-j 使用所有 CPU 核心
        make -j$(nproc) V=s || make -j1 V=s

        echo ""
        echo "=== 编译完成 ==="
        echo "固件输出目录:"
        ls -la bin/targets/ 2>/dev/null || echo "targets 目录不存在"
        ls -la bin/targets/x86/ 2>/dev/null || echo "x86 目录不存在"
        ls -la bin/targets/x86/64/ 2>/dev/null || echo "64 目录不存在"

    # ============================================================
    # Step 9: 后处理 - 集成 DDNSTO
    # ============================================================
    - name: Post-Build - Integrate DDNSTO
      run: |
        echo "=== 集成 DDNSTO 到固件 ==="

        # 创建 DDNSTO 包目录
        mkdir -p /tmp/ddnsto-build/rootfs/usr/bin
        mkdir -p /tmp/ddnsto-build/rootfs/etc/ddnsto
        mkdir -p /tmp/ddnsto-build/rootfs/etc/init.d

        # 下载 DDNSTO x86_64 二进制文件
        echo "[DDNSTO] 下载二进制文件..."
        DDNSTO_URL="https://fw.koolcenter.com/binary/ddnsto/openwrt/x86_64/ddnsto"
        curl -sSL --connect-timeout 10 --retry 3 "$DDNSTO_URL" -o /tmp/ddnsto-build/rootfs/usr/bin/ddnsto 2>/dev/null || {
          echo "[DDNSTO] 主URL下载失败，尝试备用URL..."
          curl -sSL --connect-timeout 10 --retry 3 "https://fw.koolcenter.com/binary/ddnsto/openwrt/x86_64/ddnsto" -o /tmp/ddnsto-build/rootfs/usr/bin/ddnsto 2>/dev/null || {
            echo "[DDNSTO] 警告: 二进制文件下载失败，将使用安装脚本方式集成"
            rm -f /tmp/ddnsto-build/rootfs/usr/bin/ddnsto
          }
        }

        # 设置执行权限
        chmod +x /tmp/ddnsto-build/rootfs/usr/bin/ddnsto 2>/dev/null || true

        # 创建 DDNSTO 配置文件 (默认关闭状态)
        cat > /tmp/ddnsto-build/rootfs/etc/ddnsto/config.json << 'EOF'
{
  "token": "",
  "device_name": "OpenWrt",
  "server": "tunnel.ddnsto.com",
  "log_level": "info"
}
EOF

        # 创建 OpenWrt init 脚本
        cat > /tmp/ddnsto-build/rootfs/etc/init.d/ddnsto << 'EOF'
#!/bin/sh /etc/rc.common
# DDNSTO init script

START=99
STOP=10
USE_PROCD=1

start_service() {
    local token=$(uci get ddnsto.config.token 2>/dev/null)
    [ -z "$token" ] && return 1

    procd_open_instance
    procd_set_param command /usr/bin/ddnsto
    procd_append_param command -t "$token"
    procd_set_param respawn
    procd_set_param respawn_interval 10
    procd_set_param respawn_threshold 300
    procd_close_instance
}

stop_service() {
    killall ddnsto 2>/dev/null
    return 0
}

reload_service() {
    stop_service
    start_service
}
EOF

        chmod +x /tmp/ddnsto-build/rootfs/etc/init.d/ddnsto 2>/dev/null || true

        # 创建 UCI 配置文件
        cat > /tmp/ddnsto-build/rootfs/etc/config/ddnsto << 'EOF'
config 'ddnsto' 'config'
    option 'token' ''
    option 'device_name' 'OpenWrt'
    option 'server' 'tunnel.ddnsto.com'
    option 'log_level' 'info'
    option 'enabled' '0'
EOF

        # 将 DDNSTO 文件注入固件
        FIRMWARE_DIR="bin/targets/x86/64"
        if [ -d "$FIRMWARE_DIR" ]; then
          echo "[DDNSTO] 正在注入文件到固件..."
          if [ -d "$FIRMWARE_DIR/rootfs" ]; then
            cp -rf /tmp/ddnsto-build/rootfs/usr/bin/ddnsto "$FIRMWARE_DIR/rootfs/usr/bin/" 2>/dev/null || true
            mkdir -p "$FIRMWARE_DIR/rootfs/etc/ddnsto/" 2>/dev/null || true
            cp /tmp/ddnsto-build/rootfs/etc/ddnsto/config.json "$FIRMWARE_DIR/rootfs/etc/ddnsto/" 2>/dev/null || true
            cp /tmp/ddnsto-build/rootfs/etc/init.d/ddnsto "$FIRMWARE_DIR/rootfs/etc/init.d/" 2>/dev/null || true
            cp /tmp/ddnsto-build/rootfs/etc/config/ddnsto "$FIRMWARE_DIR/rootfs/etc/config/" 2>/dev/null || true
            echo "[DDNSTO] 文件注入完成"
          else
            echo "[DDNSTO] rootfs 目录不存在，创建 files 目录用于后续编译包含..."
            mkdir -p files/etc/ddnsto
            mkdir -p files/usr/bin
            mkdir -p files/etc/init.d
            mkdir -p files/etc/config

            if [ -f /tmp/ddnsto-build/rootfs/usr/bin/ddnsto ]; then
              cp /tmp/ddnsto-build/rootfs/usr/bin/ddnsto files/usr/bin/ddnsto
              chmod +x files/usr/bin/ddnsto
            fi
            cp /tmp/ddnsto-build/rootfs/etc/ddnsto/config.json files/etc/ddnsto/config.json
            cp /tmp/ddnsto-build/rootfs/etc/init.d/ddnsto files/etc/init.d/ddnsto
            chmod +x files/etc/init.d/ddnsto
            cp /tmp/ddnsto-build/rootfs/etc/config/ddnsto files/etc/config/ddnsto

            echo "[DDNSTO] 已将文件放入 files/ 目录"
          fi
        else
          echo "[DDNSTO] 警告: 固件目录 $FIRMWARE_DIR 不存在"
          echo "[DDNSTO] 可能编译尚未完成，请检查上一步输出"
        fi

        echo "=== DDNSTO 集成完成 ==="

    # ============================================================
    # Step 10: 整理输出文件
    # ============================================================
    - name: Prepare Artifacts
      run: |
        echo "=== 整理输出文件 ==="
        mkdir -p /tmp/openwrt-artifacts

        FIRMWARE_DIR="bin/targets/x86/64"
        if [ -d "$FIRMWARE_DIR" ]; then
          cp -r "$FIRMWARE_DIR" /tmp/openwrt-artifacts/
          echo "[OK] 固件已复制到 artifacts 目录"
          echo ""
          echo "=== 固件文件列表 ==="
          find /tmp/openwrt-artifacts/x86/64 -type f | head -30
        else
          echo "[WARN] 固件目录不存在，尝试上级目录..."
          if [ -d "bin/targets" ]; then
            cp -r bin/targets /tmp/openwrt-artifacts/
            echo "[OK] targets 目录已复制"
          else
            echo "[WARN] 未找到固件输出目录"
            ls -la bin/ 2>/dev/null || echo "bin/ 目录不存在"
          fi
        fi

        # 同时复制 packages 目录
        if [ -d "bin/packages" ]; then
          cp -r bin/packages /tmp/openwrt-artifacts/ 2>/dev/null || true
        fi

        echo "=== 整理完成 ==="

    # ============================================================
    # Step 11: 上传固件制品
    # ============================================================
    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openwrt-x86-64-custom
        path: /tmp/openwrt-artifacts/
        retention-days: 14
        if-no-files-found: warn

    # ============================================================
    # Step 12: 输出构建信息
    # ============================================================
    - name: Build Summary
      if: always()
      run: |
        echo "=== 构建完成 ==="
        echo "时间: $(date)"
        echo ""
        echo "=== 磁盘使用 ==="
        du -sh build_dir/ 2>/dev/null || echo "build_dir 不存在"
        du -sh dl/ 2>/dev/null || echo "dl 不存在"
        du -sh staging_dir/ 2>/dev/null || echo "staging_dir 不存在"
        echo ""
        echo "=== 固件目录 ==="
        ls -la bin/targets/x86/64/ 2>/dev/null || echo "目录不存在"
