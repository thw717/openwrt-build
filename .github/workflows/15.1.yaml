name: Build OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget curl bash libelf-dev

      - name: Clone OpenWrt 25.12
        run: |
          git clone --depth=1 --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

      - name: Modify default LAN IP to 192.168.15.1/24
        run: |
          cd openwrt
          sed -i 's/192.168.1.1/192.168.15.1/g' package/base-files/files/bin/config_generate

      - name: Add custom feeds and third-party packages
        run: |
          cd openwrt

          # 1. ddnsto feed
          echo "src-git ddnsto https://github.com/linkease/ddnsto-openwrt.git" >> feeds.conf.default

          # 2. cpu-status-mini feed
          echo "src-git cpu_status https://github.com/gSpotx2f/packages-openwrt.git" >> feeds.conf.default

          # 更新所有 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 3. 克隆 OpenClash（删除 feeds 中可能存在的同名包）
          rm -rf feeds/luci/applications/luci-app-openclash
          git clone --depth=1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash

          # 4. 克隆 HomeProxy
          git clone --depth=1 https://github.com/immortalwrt/homeproxy.git package/luci-app-homeproxy

      - name: Apply sonic-fullcone patch
        run: |
          cd openwrt
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Configure .config
        run: |
          cd openwrt

          # 生成基础 x86/64 配置
          make defconfig

          # 强制使用 apk 包管理器（25.12 默认）
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_SIGNED_PACKAGES=y" >> .config

          # 追加所有需要的软件包
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          EOF

          # 扩展配置
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-x86-64-25.12
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.tar.gz
            openwrt/bin/targets/x86/64/sha256sums
