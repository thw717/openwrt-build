name: Build OpenWrt‑25.12 x86_64 SONIC‑FullCone‑UI‑82579FIX
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl ca-certificates automake libtool

      - name: Clone OpenWrt 25.12 official source
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout openwrt-25.12

      - name: Apply sonic‑fullcone patch (kernel/firewall4/luci ui switch)
        run: |
          cd openwrt
          git clone https://github.com/mufeng05/openwrt-sonic-fullcone.git temp_sonic_fullcone
          bash temp_sonic_fullcone/add_sonic_fullcone.sh
          rm -rf temp_sonic_fullcone

      - name: Pull third‑party packages
        run: |
          cd openwrt
          git clone https://github.com/sirpdboy/luci-app-ddns-go.git package/luci-app-ddns-go
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate full .config
        run: |
          cd openwrt
          make defconfig
          cat > .config <<'EOF'
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_Generic=y
# Intel 82574L(igb) / 82579LM(e1000e)
CONFIG_PACKAGE_kmod-igb=y
CONFIG_PACKAGE_kmod-e1000e=y
#其它intel/realtek网卡备用
CONFIG_PACKAGE_kmod-i40e=y
CONFIG_PACKAGE_kmod-ice=y
CONFIG_PACKAGE_kmod-r8125=y
# Base LuCI 中文汉化
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
# ttyd网页终端
CONFIG_PACKAGE_luci-app-ttyd=y
# UPnP nftables
CONFIG_PACKAGE_miniupnpd-nftables=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
# ddns‑scripts cloudflare dnspod
CONFIG_PACKAGE_ddns-scripts=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_ddns-scripts-cloudflare=y
CONFIG_PACKAGE_ddns-scripts-dnspod=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
# curl ca证书
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_ca-certificates=y
# uhttpd
CONFIG_PACKAGE_luci-app-uhttpd=y
CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
#温度统计 collectd thermal
CONFIG_PACKAGE_luci-app-statistics=y
CONFIG_PACKAGE_collectd-mod-thermal=y
CONFIG_PACKAGE_kmod-thermal=y
CONFIG_PACKAGE_kmod-hwmon-core=y
# ddns‑go
CONFIG_PACKAGE_ddns-go=y
#关闭多余镜像节约编译体积
CONFIG_TARGET_x86_64_Generic_GRUB_EFI_IMG=n
EOF
          make oldconfig

      - name: Download sources
        run: cd openwrt && make download -j$(nproc)

      - name: Compile firmware
        run: cd openwrt && make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenWrt‑25.12‑x86‑64‑82579lm‑fixed
          path: openwrt/bin/targets/x86/64/*.img.gz
