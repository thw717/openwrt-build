name: Build OpenWrt 25.12 x86_64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'scripts/**'
      - '.github/workflows/build-openwrt.yml'

env:
  OPENWRT_TAG: v25.12.5
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils libelf-dev ecj fastjar

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 --branch ${{ env.OPENWRT_TAG }} \
            https://github.com/openwrt/openwrt.git
          cd openwrt
          echo "OPENWRT_ROOT=$(pwd)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd $OPENWRT_ROOT
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Custom Feeds
        run: |
          chmod +x scripts/customize-feeds.sh
          cp scripts/customize-feeds.sh $OPENWRT_ROOT/
          cd $OPENWRT_ROOT
          bash customize-feeds.sh

      - name: Apply .config
        run: |
          cp .config $OPENWRT_ROOT/.config
          cd $OPENWRT_ROOT
          make defconfig

      - name: Download Packages
        run: |
          cd $OPENWRT_ROOT
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          cd $OPENWRT_ROOT
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12-x86_64
          path: |
            ${{ env.OPENWRT_ROOT }}/bin/targets/x86/64/*.img.gz
            ${{ env.OPENWRT_ROOT }}/bin/targets/x86/64/*.manifest
          retention-days: 7
