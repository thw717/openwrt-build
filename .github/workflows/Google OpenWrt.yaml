name: Build OpenWrt 25.12.5 with Full Cone NAT

on:
  workflow_dispatch: # 仅手动触发工作流

env:
  REPO_URL: https://github.com
  REPO_BRANCH: v25.12.5
  CONFIG_FILE: .config
  DIY_SH: diy.sh

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        mkdir -p workdir
        sudo chown $USER:$GROUPS workdir

    - name: Clone Source Code
      working-directory: ./workdir
      run: |
        df -h
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      path: openwrt
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject mufeng05 OpenWrt Sonic Fullcone Patch
      path: openwrt
      run: |
        cd openwrt
        # 一键应用所有 Fullcone 补丁
        curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

    - name: Load Custom Configuration & Packages
      path: openwrt
      run: |
        cd openwrt
        
        # 设置 x86/64 目标平台架构
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
        
        # 写入你请求安装的组件列表
        PACKAGES=(
          luci-theme-bootstrap
          luci-i18n-base-zh-cn
          luci-i18n-firewall-zh-cn
          luci-app-ttyd
          miniupnpd-nftables
          luci-app-upnp
          luci-i18n-upnp-zh-cn
          ddns-scripts
          luci-app-ddns
          ddns-scripts-cloudflare
          ddns-scripts-dnspod
          curl
          ca-certificates
          luci-i18n-ddns-zh-cn
          luci-app-uhttpd
          luci-i18n-uhttpd-zh-cn
          luci-app-statistics
          collectd-mod-thermal
          kmod-thermal
          kmod-hwmon-core
        )
        
        for pkg in "${PACKAGES[@]}"; do
          echo "CONFIG_PACKAGE_$pkg=y" >> .config
        done
        
        # 补全依赖并生成最终 .config
        make defconfig

    - name: Download Package Source
      path: openwrt
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile OpenWrt Firmware
      path: openwrt
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 第一次编译建议单线程以防因依赖冲突报错，如果你对源码树信心充足，可改为 make -j$(nproc)
        make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize Compiled Files
      path: openwrt
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware Artifact
      uses: actions/checkout@v6
      with:
        name: OpenWrt_v25.12.5_Firmware
        path: ${{ env.FIRMWARE }}
