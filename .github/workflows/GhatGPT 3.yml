name: Build OpenWrt 25.12.5 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file curl wget ca-certificates

      - name: Clone OpenWrt 25.12.5
        run: |
          set -e
          git clone --depth=1 --branch "${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Update and install official feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply SONiC Fullcone
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
            -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh
          rm -f /tmp/add_sonic_fullcone.sh

      - name: Add gSpotx2f CPU usage and temperature packages
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          rm -rf package/luci-app-cpu-status-mini package/luci-app-temp-status

          git clone --depth=1 \
            https://github.com/gSpotx2f/luci-app-cpu-status-mini.git \
            package/luci-app-cpu-status-mini

          git clone --depth=1 \
            https://github.com/gSpotx2f/luci-app-temp-status.git \
            package/luci-app-temp-status

          test -f package/luci-app-cpu-status-mini/Makefile
          test -f package/luci-app-temp-status/Makefile
          test -f package/luci-app-temp-status/htdocs/luci-static/resources/view/status/include/27_temperature.js

      - name: Restrict temperature widget to x86_pkg_temp
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import json

          pkg = Path("package/luci-app-temp-status")
          js = pkg / "htdocs/luci-static/resources/view/status/include/27_temperature.js"
          acl = pkg / "root/usr/share/rpcd/acl.d/luci-app-temp-status.json"

          text = js.read_text(encoding="utf-8")

          if "'require fs';" not in text:
              text = text.replace(
                  "'require rpc';",
                  "'require rpc';\n'require fs';",
                  1
              )

          if "\tfilterX86PkgTemp(data) {" not in text:
              needle = "\tload() {\n"
              method = """
          filterX86PkgTemp(data) {
              if(!data || !data.temp)
                  return Promise.resolve(data);

              let paths = Object.keys(data.temp);

              return Promise.all(paths.map((path) => {
                  let typePath = null;

                  if(path.endsWith('/temp'))
                      typePath = path.slice(0, -5) + '/type';

                  if(!typePath)
                      return Promise.resolve(null);

                  return fs.read(typePath).then((type) => {
                      return (type && type.trim() == 'x86_pkg_temp') ? path : null;
                  }).catch(() => null);
              })).then((result) => {
                  let allowed = new Set(result.filter((path) => path !== null));
                  let temp = {};

                  for(let path of Object.keys(data.temp)) {
                      if(allowed.has(path))
                          temp[path] = data.temp[path];
                  }

                  let sensors = {};

                  if(data.sensors) {
                      for(let [group, items] of Object.entries(data.sensors)) {
                          let filteredItems = [];

                          for(let item of items) {
                              if(!item.sources)
                                  continue;

                              let sources = item.sources.filter((source) =>
                                  source.path && allowed.has(source.path)
                              );

                              if(sources.length > 0) {
                                  let copy = Object.assign({}, item);
                                  copy.sources = sources;
                                  filteredItems.push(copy);
                              }
                          }

                          if(filteredItems.length > 0)
                              sensors[group] = filteredItems;
                      }
                  }

                  return {
                      sensors: sensors,
                      temp: temp
                  };
              });
          },

          """
              if needle not in text:
                  raise SystemExit("Cannot find load() in 27_temperature.js")
              text = text.replace(needle, method + needle, 1)

          old = """	load() {
			this.restoreSettingsFromLocalStorage();
			if(this.sensorsData) {
				return (this.sensorsPath.length > 0) ?
					L.resolveDefault(this.callTempData(this.sensorsPath), null) :
						Promise.resolve(null);
			} else {
				return L.resolveDefault(this.callSensors(), null);
			};
		},"""

          new = """	load() {
			this.restoreSettingsFromLocalStorage();
			if(this.sensorsData) {
				return (this.sensorsPath.length > 0) ?
					L.resolveDefault(this.callTempData(this.sensorsPath), null)
						.then((data) => this.filterX86PkgTemp(data)) :
					Promise.resolve(null);
			} else {
				return L.resolveDefault(this.callSensors(), null)
					.then((data) => this.filterX86PkgTemp(data));
			};
		},"""

          if old not in text:
              raise SystemExit("Cannot find expected load() block in 27_temperature.js")

          text = text.replace(old, new, 1)
          js.write_text(text, encoding="utf-8")

          acl_data = json.loads(acl.read_text(encoding="utf-8"))
          section = acl_data["luci-app-temp-status"]
          read = section.setdefault("read", {})
          files = read.setdefault("file", {})
          files["/sys/class/thermal/thermal_zone*/type"] = ["read"]
          files["/sys/class/thermal/thermal_zone*/temp"] = ["read"]
          acl.write_text(
              json.dumps(acl_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          po = pkg / "po" / "zh_Hans"
          po.mkdir(parents=True, exist_ok=True)
          (po / "temp-status.po").write_text(
              """msgid ""
          msgstr ""
          "Language: zh_Hans\\n"
          "MIME-Version: 1.0\\n"
          "Content-Type: text/plain; charset=UTF-8\\n"
          "Content-Transfer-Encoding: 8bit\\n"

          msgid "Temperature"
          msgstr "温度"

          msgid "Sensor"
          msgstr "传感器"

          msgid "Switch view"
          msgstr "切换视图"

          msgid "Show hidden sensors"
          msgstr "显示隐藏的传感器"

          msgid "No temperature sensors available"
          msgstr "没有可用的温度传感器"

          msgid "Hide"
          msgstr "隐藏"
          """,
              encoding="utf-8"
          )
          PY

          echo "===== Verify temperature patch ====="
          grep -n -E "require fs|filterX86PkgTemp|x86_pkg_temp" \
            package/luci-app-temp-status/htdocs/luci-static/resources/view/status/include/27_temperature.js

      - name: Configure OpenWrt 25.12
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_LUCI_LANG_zh_Hans=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y

          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y

          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_luci-app-temp-status=y
          CONFIG_PACKAGE_luci-i18n-temp-status-zh-cn=y
          EOF

          make defconfig

      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-cpu-status-mini=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-temp-status=y$' .config
          test ! -d package/custom/luci-app-cpu-widget

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          make -j"$(nproc)"

      - name: Verify Chinese catalogs and CPU temperature restriction
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          ROOT="$(find staging_dir/target-* -maxdepth 1 -type d -name 'root-*' -print -quit)"
          test -n "${ROOT}"

          echo "===== zh-cn LuCI catalogs ====="
          find "${ROOT}/usr/lib/lua/luci/i18n" -maxdepth 1 \
            -type f -name '*.zh-cn.lmo' -printf '%f\n' | sort

          test -n "$(find "${ROOT}/usr/lib/lua/luci/i18n" -maxdepth 1 \
            -type f -name '*.zh-cn.lmo' -print -quit)"

          echo "===== Chinese language registration ====="
          grep -R "luci.languages.zh_cn" "${ROOT}/etc/uci-defaults" 2>/dev/null || true

          echo "===== x86_pkg_temp restriction in built LuCI ====="
          grep -R "x86_pkg_temp" \
            "${ROOT}/www/luci-static/resources" 2>/dev/null

          echo "===== gSpotx2f package files ====="
          find "${ROOT}" -type f \
            \( -name '*cpu-status-mini*' -o -name '*temp-status*' \) \
            -print | head -50

      - name: Verify firmware output
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          test -d bin/targets/x86/64
          find bin/targets/x86/64 -maxdepth 1 -type f -printf '%f\n' | sort

          test -n "$(find bin/targets/x86/64 -maxdepth 1 -type f \( \
            -name '*.img.gz' -o \
            -name '*.vmdk' -o \
            -name '*.vdi' -o \
            -name '*.qcow2' \
          \) -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.5-x86_64-SonicFullcone-CPUStatusMini-CPUTemp
          path: openwrt/bin/targets/x86/64/*
          if-no-files-found: error
