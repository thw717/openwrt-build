name: OpenWrt 25.12.5 x86-64 Fullcone NAT + CPU/Temp Status

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev \
            libreadline-dev libssl-dev libtool libyaml-dev lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools python3-setuptools qemu-utils re2c \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev file

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 -b v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate SONiC Fullcone
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "==> 应用 SONiC Fullcone 补丁 ..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash
          echo "==> 验证 LuCI 补丁是否生效 ..."
          grep -rl "fullcone" feeds/luci/applications/luci-app-firewall/htdocs/ || echo "WARN: LuCI 中未找到 fullcone 字样，请检查"

      - name: Integrate CPU Status (mini) & Temp Status plugins
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          echo "==> 克隆 luci-app-cpu-status-mini（单行显示，不分核心）..."
          git clone --depth=1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git \
            package/luci-app-cpu-status-mini

          echo "==> 克隆 luci-app-temp-status（温度显示）..."
          git clone --depth=1 https://github.com/gSpotx2f/luci-app-temp-status.git \
            package/luci-app-temp-status

          echo "==> 检查两个插件的 zh_Hans 中文翻译文件 ..."
          ls package/luci-app-cpu-status-mini/po/zh_Hans/ 2>/dev/null && echo "cpu-status-mini 中文包存在" || echo "cpu-status-mini 中文包缺失"
          ls package/luci-app-temp-status/po/zh_Hans/ 2>/dev/null && echo "temp-status 中文包存在" || echo "temp-status 中文包缺失"

      - name: Prepare .config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y

          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_luci-app-temp-status=y
          EOF

          sed -i 's/^          //' .config
          make defconfig

          echo "===== Sanity check ====="
          for k in luci-app-cpu-status-mini luci-app-temp-status; do
            if grep -q "CONFIG_PACKAGE_${k}=y" .config; then
              echo "OK   $k"
            else
              echo "MISS $k"
            fi
          done
          echo "========================"

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-25.12.5-fullcone-cpu-temp
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          if-no-files-found: error
          retention-days: 30
