name: OpenWrt 25.12 SNAPSHOT x86_64 Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'OpenWrt分支名称'
        required: false
        default: 'openwrt-25.12'
      debug:
        description: '是否上传完整构建目录'
        required: false
        default: 'false'
      ddnsto_version:
        description: 'DDNSTO版本号(留空自动获取)'
        required: false
        default: ''

jobs:
  build:
    name: OpenWrt Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-pip python3-requirements-file rsync unzip zlib1g-dev \
            file llvm make xsltproc libxml2-utils

      - name: Clone OpenWrt Source
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "Cloning OpenWrt branch: ${BRANCH}"
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          if git branch -r | grep -q "origin/${BRANCH}"; then
            git checkout "${BRANCH}"
          else
            echo "Branch ${BRANCH} not found, trying main..."
            git checkout main
          fi
          echo "OPENWRT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Update Feeds
        run: |
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install DDNSTO Package
        run: |
          cd "$OPENWRT_DIR"

          # 获取DDNSTO版本号
          DDNSTO_VERSION="${{ github.event.inputs.ddnsto_version }}"
          if [ -z "${DDNSTO_VERSION}" ]; then
            DDNSTO_VERSION=$(curl -fsSLk "http://fw.koolcenter.com/binary/ddnsto/openwrt/VERSION" 2>/dev/null | tr -d '[:space:]')
            echo "Auto-detected DDNSTO version: ${DDNSTO_VERSION}"
          fi

          if [ -z "${DDNSTO_VERSION}" ]; then
            DDNSTO_VERSION="4.2.6"
            echo "Using default DDNSTO version: ${DDNSTO_VERSION}"
          fi

          # 创建DDNSTO包目录
          mkdir -p package/ddnsto/files

          # 创建Makefile
          cat > package/ddnsto/Makefile << 'MAKEFILE_END'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=ddnsto
          PKG_VERSION:='__DDNSTO_VERSION__'
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/ddnsto
            SECTION:=net
            CATEGORY:=Network
            TITLE:=DDNSTO Intranet Penetration Client
            DEPENDS:=+curl +ca-certificates
            URL:=https://www.ddnsto.com/
          endef

          define Package/ddnsto/description
            DDNSTO is a fast and easy-to-use intranet penetration tool.
          endef

          define Package/ddnsto/conffiles
            /etc/config/ddnsto
          endef

          define Package/ddnsto/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_DIR) $(1)/etc/config
            $(INSTALL_DIR) $(1)/etc/init.d
            # Download binary - try multiple URLs with fallback
            $(STAGING_DIR)/host/bin/wget -q -O /tmp/ddnsto_x86_64.ipk "http://fw.koolcenter.com/binary/ddnsto/openwrt/standard/__DDNSTO_VERSION__/ddnsto_x86_64.ipk" 2>/dev/null || \
            $(STAGING_DIR)/host/bin/wget -q -O /tmp/ddnsto_x86_64.ipk "http://fw.koolcenter.com/binary/ddnsto/openwrt/standard/4.2.6/ddnsto_x86_64.ipk" 2>/dev/null || \
            $(STAGING_DIR)/host/bin/wget -q -O /tmp/ddnsto_x86_64.ipk "http://fw.koolcenter.com/binary/ddnsto/openwrt/standard/4.2.3/ddnsto_x86_64.ipk" 2>/dev/null || {
              echo "ERROR: Failed to download DDNSTO binary from any URL"
              exit 1
            }
            # Extract binary from ipk archive
            cd /tmp && ar x ddnsto_x86_64.ipk 2>/dev/null && tar xf data.tar.gz 2>/dev/null
            if [ -f /tmp/usr/bin/ddnsto ]; then
              cp /tmp/usr/bin/ddnsto $(1)/usr/bin/ddnsto
              chmod 755 $(1)/usr/bin/ddnsto
            else
              echo "ERROR: ddnsto binary not found in ipk archive"
              exit 1
            fi
            rm -f /tmp/ddnsto_x86_64.ipk /tmp/control.tar.gz /tmp/data.tar.gz 2>/dev/null
            # Install config (disabled by default)
            $(INSTALL_CONF) ./files/ddnsto.config $(1)/etc/config/ddnsto
            # Install init script
            $(INSTALL_BIN) ./files/ddnsto.init $(1)/etc/init.d/ddnsto
          endef

          $(eval $(call BuildPackage,ddnsto))
          MAKEFILE_END

          # 替换版本号占位符
          sed -i "s/__DDNSTO_VERSION__/${DDNSTO_VERSION}/g" package/ddnsto/Makefile

          # 创建UCI配置文件 (默认token为空, 服务禁用)
          cat > package/ddnsto/files/ddnsto.config << 'CONFIG_END'
          config ddnsto
              option token ''
              option enabled '0'
              option device_name 'OpenWrt'
              option log_level 'info'
          CONFIG_END

          # 创建init脚本 (默认不启动, 需要token才能启动)
          cat > package/ddnsto/files/ddnsto.init << 'INIT_END'
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1

          start_service() {
              local token
              token=$(uci get ddnsto.config.token 2>/dev/null)
              if [ -z "$token" ]; then
                  echo "DDNSTO: token not configured, skipping start"
                  return 1
              fi
              procd_open_instance
              procd_set_param command /usr/bin/ddnsto
              procd_append_param command -t "$token"
              procd_set_param respawn
              procd_set_param respawn_threshold 30
              procd_close_instance
          }

          stop_service() {
              killall ddnsto 2>/dev/null
              return 0
          }
          INIT_END

          chmod 755 package/ddnsto/files/ddnsto.init

          echo "DDNSTO package created successfully"
          echo "Version: ${DDNSTO_VERSION}"

      - name: Integrate sonic-fullcone
        run: |
          cd "$OPENWRT_DIR"

          # 克隆sonic-fullcone仓库
          git clone --depth 1 https://github.com/mufeng05/openwrt-sonic-fullcone.git /tmp/sonic-fullcone 2>/dev/null || true

          if [ -d "/tmp/sonic-fullcone" ]; then
              cd /tmp/sonic-fullcone

              # 检测内核版本
              KERNEL_VERSION=""
              if [ -f "$OPENWRT_DIR/target/linux/x86/Makefile" ]; then
                  KERNEL_VERSION=$(grep 'KERNEL_PATCHVER' "$OPENWRT_DIR/target/linux/x86/Makefile" | head -1 | cut -d'.' -f1-2 | sed 's/KERNEL_PATCHVER:=//')
              fi

              echo "Detected kernel version: ${KERNEL_VERSION}"

              # 复制内核补丁
              if [ -d "kernel" ]; then
                  for patch in kernel/984-*.patch kernel/985-*.patch kernel/986-*.patch; do
                      if [ -f "$patch" ]; then
                          KERNEL_DIR=$(echo "$patch" | cut -d'/' -f2 | cut -d'-' -f1)
                          if [ -n "$KERNEL_VERSION" ] && [ -d "$OPENWRT_DIR/target/linux/generic/hack-${KERNEL_VERSION}" ]; then
                              cp "$patch" "$OPENWRT_DIR/target/linux/generic/hack-${KERNEL_VERSION}/"
                              echo "Copied $patch to hack-${KERNEL_VERSION}/"
                          fi
                      fi
                  done
              fi

              # 复制用户态补丁
              if [ -d "patches" ]; then
                  # iptables补丁
                  if [ -d "patches/iptables" ]; then
                      for patch in patches/iptables/*sonic*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/package/network/utils/iptables/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/package/network/utils/iptables/patches/"
                              echo "Copied iptables patch: $patch"
                          fi
                      done
                  fi

                  # libnftnl补丁
                  if [ -d "patches/libnftnl" ]; then
                      for patch in patches/libnftnl/*sonic*.patch patches/libnftnl/*fullcone*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/package/libs/libnftnl/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/package/libs/libnftnl/patches/"
                              echo "Copied libnftnl patch: $patch"
                          fi
                      done
                  fi

                  # nftables补丁
                  if [ -d "patches/nftables" ]; then
                      for patch in patches/nftables/*sonic*.patch patches/nftables/*fullcone*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/package/network/utils/nftables/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/package/network/utils/nftables/patches/"
                              echo "Copied nftables patch: $patch"
                          fi
                      done
                  fi

                  # luci-app-firewall补丁
                  if [ -d "patches/luci-app-firewall" ]; then
                      for patch in patches/luci-app-firewall/*sonic*.patch patches/luci-app-firewall/*fullcone*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/feeds/luci/applications/luci-app-firewall/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/feeds/luci/applications/luci-app-firewall/patches/"
                              echo "Copied luci-app-firewall patch: $patch"
                          fi
                      done
                  fi
              fi

              # 复制firewall补丁
              if [ -d "firewall" ]; then
                  # firewall3补丁
                  if [ -d "firewall/firewall3" ]; then
                      for patch in firewall/firewall3/*sonic*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/package/network/config/firewall/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/package/network/config/firewall/patches/"
                              echo "Copied firewall3 patch: $patch"
                          fi
                      done
                  fi

                  # firewall4补丁
                  if [ -d "firewall/firewall4" ]; then
                      for patch in firewall/firewall4/*sonic*.patch; do
                          if [ -f "$patch" ] && [ -d "$OPENWRT_DIR/package/network/config/firewall4/patches" ]; then
                              cp "$patch" "$OPENWRT_DIR/package/network/config/firewall4/patches/"
                              echo "Copied firewall4 patch: $patch"
                          fi
                      done
                  fi
              fi

              # 为libnftnl添加PKG_FIXUP:=autoreconf
              if [ -f "$OPENWRT_DIR/package/libs/libnftnl/Makefile" ]; then
                  if ! grep -q "PKG_FIXUP.*autoreconf" "$OPENWRT_DIR/package/libs/libnftnl/Makefile"; then
                      sed -i '/^PKG_NAME:=libnftnl/a PKG_FIXUP:=autoreconf' "$OPENWRT_DIR/package/libs/libnftnl/Makefile"
                      echo "Added PKG_FIXUP:=autoreconf to libnftnl Makefile"
                  fi
              fi
          else
              echo "Warning: sonic-fullcone repo clone failed, skipping integration"
          fi

      - name: Integrate OpenClash
        run: |
          cd "$OPENWRT_DIR"
          mkdir -p package/openclash
          cd package/openclash
          git clone --depth 1 https://github.com/vernesong/OpenClash.git luci-app-openclash 2>/dev/null || true
          if [ -d "luci-app-openclash" ]; then
              echo "OpenClash cloned successfully"
          else
              echo "Warning: OpenClash clone failed"
          fi

      - name: Integrate homeproxy
        run: |
          cd "$OPENWRT_DIR"
          mkdir -p package/homeproxy
          cd package/homeproxy
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git 2>/dev/null || true
          if [ -d "homeproxy" ]; then
              echo "homeproxy cloned successfully"
          else
              echo "Warning: homeproxy clone failed"
          fi

      - name: Integrate luci-app-cpu-status-mini
        run: |
          cd "$OPENWRT_DIR"
          mkdir -p package/cpu-status-mini
          cd package/cpu-status-mini
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git 2>/dev/null || true
          if [ -d "luci-app-cpu-status-mini" ]; then
              echo "luci-app-cpu-status-mini cloned successfully"
          else
              echo "Warning: luci-app-cpu-status-mini clone failed"
          fi

      - name: Reinstall Feeds
        run: |
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        run: |
          cd "$OPENWRT_DIR"

          # 设置LAN地址为192.168.15.1/24
          sed -i 's/192.168.1.1/192.168.15.1/g' target/linux/x86/image/Makefile 2>/dev/null || true
          sed -i 's/192.168.1.1/192.168.15.1/g' target/linux/x86/base-files/etc/config/network 2>/dev/null || true

          # 确保x86_64目标启用
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_DEVICE_generic=y' >> .config

          # 保存配置
          make defconfig 2>/dev/null || true

          echo "Configuration updated"

      - name: Select Packages
        run: |
          cd "$OPENWRT_DIR"

          # 配置所有需要的包
          cat >> .config << 'PACKAGES_END'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_luci-lib-json=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-i40e=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-r8125=y
          CONFIG_PACKAGE_kmod-mlx5-core=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-bnx2=y
          CONFIG_PACKAGE_kmod-bnx2x=y
          CONFIG_PACKAGE_kmod-8139cp=y
          CONFIG_PACKAGE_kmod-8139too=y
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-via-velocity=y
          CONFIG_PACKAGE_kmod-kvm=y
          CONFIG_PACKAGE_kmod-kvm-intel=y
          CONFIG_PACKAGE_kmod-kvm-amd=y
          CONFIG_PACKAGE_kmod-virtio=y
          CONFIG_PACKAGE_kmod-virtio-balloon=y
          CONFIG_PACKAGE_kmod-virtio-console=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-scsi=y
          CONFIG_PACKAGE_kmod-virtio-mmio=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-vhost-core=y
          CONFIG_PACKAGE_kmod-vhost-net=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          PACKAGES_END

          # 重新生成配置
          make defconfig 2>/dev/null || true

          echo "Package selection complete"

      - name: Download Dependencies
        run: |
          cd "$OPENWRT_DIR"
          make download -j$(nproc) IGNORE_ERRORS=1 2>&1 | tail -20 || true

      - name: Build Firmware
        run: |
          cd "$OPENWRT_DIR"

          # 并行编译
          make -j$(nproc) BIN_DIR=$(pwd)/bin 2>&1 | tee build.log || {
              echo "Parallel build failed, retrying with single thread..."
              make -j1 V=s BIN_DIR=$(pwd)/bin 2>&1 | tee build.log
          }

          echo "Build completed"

      - name: Organize Artifacts
        run: |
          cd "$OPENWRT_DIR"

          # 创建输出目录
          mkdir -p artifacts

          # 复制固件文件
          if [ -d "bin/targets" ]; then
              cp -r bin/targets artifacts/
          fi

          # 复制ipk包
          if [ -d "bin/packages" ]; then
              cp -r bin/packages artifacts/packages
          fi

          # 复制构建日志
          if [ -f "build.log" ]; then
              cp build.log artifacts/build.log
          fi

          # 复制配置文件
          if [ -f ".config" ]; then
              cp .config artifacts/config
          fi

          echo "Artifacts organized"

      - name: Upload Firmware
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt-25.12-SNAPSHOT-x86_64
          path: '${{ env.OPENWRT_DIR }}/artifacts/'
          retention-days: 14

      - name: Upload Build Log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: OpenWrt-Build-Log
          path: '${{ env.OPENWRT_DIR }}/build.log'
          retention-days: 14

      - name: Upload Full Build Dir (Debug)
        uses: actions/upload-artifact@v6
        if: '${{ github.event.inputs.debug }}' == 'true'
        with:
          name: OpenWrt-Build-Dir-Debug
          path: '${{ env.OPENWRT_DIR }}/'
          retention-days: 7
