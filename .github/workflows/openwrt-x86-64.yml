name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-25.12

  # 第三方软件源
  KENZO_REPO: https://github.com/kenzok8/openwrt-packages.git
  OPENCLASH_REPO: https://github.com/vernesong/OpenClash.git
  HOMEPROXY_REPO: https://github.com/immortalwrt/homeproxy.git
  CPU_STATUS_REPO: https://github.com/gSpotx2f/luci-app-cpu-status-mini.git

jobs:
  build:
    name: Build OpenWrt 25.12 x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout OpenWrt source
        uses: actions/checkout@v5
        with:
          repository: openwrt/openwrt
          ref: openwrt-25.12
          fetch-depth: 1
          path: openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath \
            ccache \
            device-tree-compiler

      - name: Add third-party feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          cat >> feeds.conf.default <<'EOF'

          # DDNSTO
          src-git kenzo https://github.com/kenzok8/openwrt-packages.git

          # OpenClash
          src-git openclash https://github.com/vernesong/OpenClash.git

          # HomeProxy
          src-git homeproxy https://github.com/immortalwrt/homeproxy.git

          # CPU Status Mini
          src-git cpustatus https://github.com/gSpotx2f/luci-app-cpu-status-mini.git
          EOF

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update -a

          # 官方 feeds
          ./scripts/feeds install -a

          # DDNSTO：只安装需要的包，避免把 kenzok8 整个仓库全部引入
          ./scripts/feeds install -p kenzo ddnsto
          ./scripts/feeds install -p kenzo luci-app-ddnsto

          # OpenClash
          ./scripts/feeds install -p openclash luci-app-openclash

          # HomeProxy
          ./scripts/feeds install -p homeproxy luci-app-homeproxy

          # CPU Status Mini
          ./scripts/feeds install -p cpustatus luci-app-cpu-status-mini

      - name: Apply SONiC Full Cone NAT
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          # SONiC Fullcone 官方安装方式
          curl -fsSL \
            https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
            | bash

      - name: Add HomeProxy Chinese compatibility package
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          # OpenWrt 25.12 / 当前 HomeProxy 已将 zh_Hans 中文翻译
          # 直接打包进 luci-app-homeproxy。
          #
          # 为兼容用户习惯以及 24.10 时代的包名，
          # 创建一个不重复安装翻译文件的兼容元包：
          # luci-i18n-homeproxy-zh-cn
          #
          # HomeProxy 自己的 Makefile 已经依赖 sing-box、
          # firewall4、kmod-nft-tproxy、ucode-mod-digest。

          mkdir -p package/luci-i18n-homeproxy-zh-cn

          cat > package/luci-i18n-homeproxy-zh-cn/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=luci-i18n-homeproxy-zh-cn
          PKG_VERSION:=1
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/luci-i18n-homeproxy-zh-cn
            SECTION:=luci
            CATEGORY:=LuCI
            TITLE:=HomeProxy Chinese translation compatibility package
            DEPENDS:=+luci-app-homeproxy
            PKGARCH:=all
          endef

          define Package/luci-i18n-homeproxy-zh-cn/description
           Compatibility package for HomeProxy Simplified Chinese translation.
           Current HomeProxy embeds zh_Hans translation directly into
           luci-app-homeproxy.
          endef

          define Build/Compile
          endef

          define Package/luci-i18n-homeproxy-zh-cn/install
          endef

          $(eval $(call BuildPackage,luci-i18n-homeproxy-zh-cn))
          EOF

      - name: Add custom LAN configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-custom-lan <<'EOF'
          #!/bin/sh

          . /lib/functions.sh

          # LAN: 192.168.15.1/24
          uci -q set network.lan.ipaddr='192.168.15.1'
          uci -q set network.lan.netmask='255.255.255.0'

          # IPv6 保持 OpenWrt 默认行为，不在这里强制关闭

          uci -q commit network

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-custom-lan

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          cat > .config <<'EOF'

          #
          # Target
          #
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          #
          # Base LuCI
          #
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y

          #
          # Bootstrap theme
          #
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          #
          # Simplified Chinese
          #
          CONFIG_LUCI_LANG_zh_Hans=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          #
          # TTY / UPnP
          #
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          #
          # DDNS
          #
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          #
          # uHTTPd
          #
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          #
          # Statistics
          #
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          #
          # DDNSTO
          #
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y

          #
          # SONiC Fullcone
          #
          # Fullcone 本身由官方脚本对 OpenWrt 内核、
          # nftables、libnftnl、firewall4/LuCI 进行补丁。
          #

          #
          # CPU Status Mini
          #
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          #
          # OpenClash
          #
          CONFIG_PACKAGE_luci-app-openclash=y

          #
          # HomeProxy
          #
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y

          #
          # Common physical Ethernet drivers
          #
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-igbvf=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-ixgbevf=y
          CONFIG_PACKAGE_kmod-i40e=y
          CONFIG_PACKAGE_kmod-iavf=y
          CONFIG_PACKAGE_kmod-ice=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-bnx2=y
          CONFIG_PACKAGE_kmod-bnx2x=y
          CONFIG_PACKAGE_kmod-sky2=y
          CONFIG_PACKAGE_kmod-forcedeth=y

          #
          # Mellanox
          #
          CONFIG_PACKAGE_kmod-mlx4-core=y
          CONFIG_PACKAGE_kmod-mlx5-core=y

          #
          # Virtual machine / VirtIO
          #
          CONFIG_PACKAGE_kmod-virtio=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-balloon=y
          CONFIG_PACKAGE_kmod-virtio-rng=y
          CONFIG_PACKAGE_kmod-vsock=y
          CONFIG_PACKAGE_kmod-vsock-virtio=y

          #
          # VMware
          #
          CONFIG_PACKAGE_kmod-vmxnet3=y

          #
          # KVM host modules
          #
          CONFIG_PACKAGE_kvm-x86=y
          CONFIG_PACKAGE_kmod-kvm-x86=y
          CONFIG_PACKAGE_kmod-kvm-intel=y
          CONFIG_PACKAGE_kmod-kvm-amd=y

          EOF

          # 让 OpenWrt 自动补齐所有依赖，并适配当前 25.12 源码
          make defconfig

      - name: Verify selected packages
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          echo "===== Target ====="
          grep -E '^CONFIG_TARGET_x86|^CONFIG_TARGET_ARCH_PACKAGES' .config || true

          echo "===== LuCI language ====="
          grep -E '^CONFIG_LUCI_LANG_zh_Hans' .config || true

          echo "===== Requested packages ====="
          grep -E \
            'CONFIG_PACKAGE_(luci-i18n-base-zh-cn|luci-i18n-firewall-zh-cn|luci-app-ttyd|miniupnpd-nftables|luci-app-upnp|luci-i18n-upnp-zh-cn|ddns-scripts|luci-app-ddns|ddns-scripts-cloudflare|ddns-scripts-dnspod|curl|ca-certificates|luci-i18n-ddns-zh-cn|luci-app-uhttpd|luci-i18n-uhttpd-zh-cn|luci-app-statistics|collectd-mod-thermal|kmod-thermal|kmod-hwmon-core|luci-i18n-statistics-zh-cn|ddnsto|luci-app-ddnsto|luci-app-cpu-status-mini|luci-app-openclash|luci-app-homeproxy|luci-i18n-homeproxy-zh-cn)' \
            .config || true

          echo "===== Ethernet / VM drivers ====="
          grep -E \
            'CONFIG_PACKAGE_(kmod-e1000|kmod-e1000e|kmod-igb|kmod-igc|kmod-ixgbe|kmod-ixgbevf|kmod-i40e|kmod-iavf|kmod-r8169|kmod-tg3|kmod-bnx2|kmod-bnx2x|kmod-mlx4-core|kmod-mlx5-core|kmod-virtio|kmod-virtio-pci|kmod-virtio-net|kmod-vmxnet3|kmod-kvm-x86|kmod-kvm-intel|kmod-kvm-amd)' \
            .config || true

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          # 当前 OpenWrt 25.12 源码及所有已选软件包
          # 均从当前 feed / git revision 获取最新源码。
          make download -j"$(nproc)" V=s

      - name: Compile OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          make -j"$(nproc)" V=s

      - name: Generate build information
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          mkdir -p build-info

          {
            echo "OpenWrt branch: openwrt-25.12"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "OpenWrt commit:"
            git rev-parse HEAD
            echo
            echo "OpenWrt description:"
            git describe --always --dirty
            echo
            echo "Kernel:"
            grep '^CONFIG_LINUX_' .config | head -20 || true
            echo
            echo "Target:"
            grep '^CONFIG_TARGET_' .config | head -20 || true
            echo
            echo "Installed package configuration:"
            grep '^CONFIG_PACKAGE_' .config | grep '=y' | sort || true
          } > build-info/build-info.txt

      - name: List firmware files
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          echo "===== Firmware ====="
          find bin/targets/x86/64 -maxdepth 2 -type f \
            \( -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' -o -name '*.vdi' -o -name '*.qcow2' -o -name '*.manifest' \) \
            -print | sort

          echo "===== Packages ====="
          find bin/packages/x86_64 -type f \
            \( -name '*.apk' -o -name '*.ipk' \) \
            -print | sort | head -100

      - name: Prepare artifact directory
        working-directory: openwrt
        shell: bash
        run: |
          set -eux

          mkdir -p ../artifact

          cp -a bin/targets/x86/64/. ../artifact/

          if [ -d bin/packages ]; then
            mkdir -p ../artifact/packages
            cp -a bin/packages/x86_64/. ../artifact/packages/ || true
          fi

          cp -a build-info ../artifact/

      - name: Upload OpenWrt firmware
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-25.12-x86_64-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
