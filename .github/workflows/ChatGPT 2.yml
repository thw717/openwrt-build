name: Build OpenWrt 25.12.5 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file curl wget ca-certificates \
            xsltproc libxml-parser-perl

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ env.OPENWRT_VERSION }}-${{ runner.os }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_VERSION }}-

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch "${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply SONiC Fullcone
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
            -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh
          rm -f /tmp/add_sonic_fullcone.sh

      - name: Add CPU temperature and usage to LuCI Status Overview
        working-directory: openwrt
        shell: bash
        run: |
          set -e

          STATUS_INCLUDE="feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include"
          STATUS_ACL="feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json"

          mkdir -p "${STATUS_INCLUDE}"

          cat > "${STATUS_INCLUDE}/19_cpu.js" <<'EOF'
          'use strict';
          'require baseclass';
          'require fs';
          'require poll';

          var cpuLastTotal = null;
          var cpuLastIdle = null;
          var tempZone = null;

          function findTemperatureZone() {
              if (tempZone !== null)
                  return Promise.resolve(tempZone);

              var zones = [];
              for (var i = 0; i < 32; i++)
                  zones.push('/sys/class/thermal/thermal_zone' + i);

              return Promise.all(zones.map(function(zone) {
                  return fs.read(zone + '/type').then(function(type) {
                      return {
                          zone: zone,
                          type: type ? type.trim() : ''
                      };
                  }).catch(function() {
                      return null;
                  });
              })).then(function(result) {
                  result = result.filter(function(item) {
                      return item !== null;
                  });

                  var pkg = result.find(function(item) {
                      return item.type === 'x86_pkg_temp';
                  });

                  var fallback = result.find(function(item) {
                      return item.type && (
                          item.type.indexOf('cpu') >= 0 ||
                          item.type.indexOf('coretemp') >= 0 ||
                          item.type.indexOf('k10temp') >= 0 ||
                          item.type.indexOf('zenpower') >= 0
                      );
                  });

                  tempZone = pkg ? pkg.zone : (fallback ? fallback.zone : false);
                  return tempZone;
              });
          }

          function readTemperature() {
              return findTemperatureZone().then(function(zone) {
                  if (!zone)
                      return null;

                  return fs.read(zone + '/temp').then(function(value) {
                      var temp = parseInt(value, 10);
                      if (!Number.isFinite(temp))
                          return null;

                      if (temp > 1000)
                          temp /= 1000;

                      return temp;
                  }).catch(function() {
                      return null;
                  });
              });
          }

          function readCpuUsage() {
              return fs.read('/proc/stat').then(function(data) {
                  var line = (data || '').split('\n')[0].trim();
                  var fields = line.split(/\s+/);

                  if (fields[0] !== 'cpu' || fields.length < 5)
                      return null;

                  var user = parseInt(fields[1], 10) || 0;
                  var nice = parseInt(fields[2], 10) || 0;
                  var system = parseInt(fields[3], 10) || 0;
                  var idle = parseInt(fields[4], 10) || 0;
                  var iowait = parseInt(fields[5], 10) || 0;

                  var total = user + nice + system + idle + iowait;
                  var usage = null;

                  if (cpuLastTotal !== null && total > cpuLastTotal) {
                      var deltaTotal = total - cpuLastTotal;
                      var deltaIdle = (idle + iowait) - cpuLastIdle;
                      usage = 100 * (1 - deltaIdle / deltaTotal);
                      usage = Math.max(0, Math.min(100, usage));
                  }

                  cpuLastTotal = total;
                  cpuLastIdle = idle + iowait;

                  return usage;
              }).catch(function() {
                  return null;
              });
          }

          function formatTemperature(value) {
              return value !== null
                  ? '%.1f °C'.format(value)
                  : _('Unavailable');
          }

          function formatUsage(value) {
              return value !== null
                  ? '%.1f %%'.format(value)
                  : _('Collecting...');
          }

          return baseclass.extend({
              title: _('CPU'),

              load: function() {
                  return Promise.all([
                      readTemperature(),
                      readCpuUsage()
                  ]);
              },

              render: function(data) {
                  var temp = data[0];
                  var usage = data[1];

                  var table = E('table', { 'class': 'table' });

                  table.appendChild(E('tr', { 'class': 'tr' }, [
                      E('td', { 'class': 'td left', 'width': '33%' }, [
                          _('CPU Temperature')
                      ]),
                      E('td', {
                          'class': 'td left',
                          'id': 'cpu-temperature'
                      }, [
                          formatTemperature(temp)
                      ])
                  ]));

                  table.appendChild(E('tr', { 'class': 'tr' }, [
                      E('td', { 'class': 'td left', 'width': '33%' }, [
                          _('CPU Usage')
                      ]),
                      E('td', {
                          'class': 'td left',
                          'id': 'cpu-usage'
                      }, [
                          formatUsage(usage)
                      ])
                  ]));

                  poll.add(function() {
                      return Promise.all([
                          readTemperature(),
                          readCpuUsage()
                      ]).then(function(values) {
                          var tempNode = document.getElementById('cpu-temperature');
                          var usageNode = document.getElementById('cpu-usage');

                          if (tempNode)
                              tempNode.textContent = formatTemperature(values[0]);

                          if (usageNode)
                              usageNode.textContent = formatUsage(values[1]);
                      });
                  }, 5);

                  return table;
              }
          });
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          acl_path = Path("feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json")
          data = json.loads(acl_path.read_text())

          group = data.setdefault("luci-mod-status-index", {})
          read = group.setdefault("read", {})
          files = read.setdefault("file", {})

          files["/proc/stat"] = ["read"]
          files["/sys/class/thermal/thermal_zone*/type"] = ["read"]
          files["/sys/class/thermal/thermal_zone*/temp"] = ["read"]

          acl_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

          echo "===== Verify CPU include ====="
          test -s "${STATUS_INCLUDE}/19_cpu.js"

          echo "===== Verify ACL ====="
          grep -nE '/proc/stat|/sys/class/thermal' "${STATUS_ACL}"

      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y

          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          EOF

          make defconfig

      - name: Verify configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          test -f feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/19_cpu.js
          test -f feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json
          grep -q '"/proc/stat"' feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json
          grep -q '"/sys/class/thermal/thermal_zone\*/type"' feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          make -j"$(nproc)"

      - name: Verify firmware output
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          test -d bin/targets/x86/64
          find bin/targets/x86/64 -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find bin/targets/x86/64 -maxdepth 1 -type f \( \
            -name '*.img.gz' -o -name '*.vmdk' -o -name '*.vdi' -o -name '*.qcow2' \
          \) -print -quit)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.5-x86_64-SonicFullcone-CPUWidget
          path: openwrt/bin/targets/x86/64/*
          if-no-files-found: error
