name: Build OpenWrt x86-64 25.12-SNAPSHOT_15.1

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload firmware to artifact'
        required: false
        default: 'true'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync unzip zlib1g-dev \
            file wget curl subversion

      - name: Clone OpenWrt source
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      # ========== 注入第三方包 ==========
      - name: Add custom packages
        run: |
          cd openwrt

          # 1. sonic-fullcone（一键注入，自动识别 25.12 / 内核 6.12）
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

          # 2. luci-app-cpu-status-mini
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git package/luci-app-cpu-status-mini

          # 3. OpenClash（插件本体，内核稍后单独集成）
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash

          # 4. homeproxy（使用 immortalwrt 仓库）
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/luci-app-homeproxy

          # 5. DDNSTO 官方客户端二进制（x86_64 对应 amd64）
          mkdir -p package/luci-app-ddnsto/files
          curl -fsSL --retry 3 \
            "https://fw.koolcenter.com/binary/ddnsto/openwrt/x86_64/ddnsto" \
            -o package/luci-app-ddnsto/files/ddnsto
          chmod 0755 package/luci-app-ddnsto/files/ddnsto

      # ========== DDNSTO：编写 Makefile / init / uci-defaults ==========
      - name: Prepare DDNSTO package
        run: |
          cd openwrt/package/luci-app-ddnsto

          # Makefile：打包二进制、init 脚本、默认配置
          cat > Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=luci-app-ddnsto
          PKG_VERSION:=1.0
          PKG_RELEASE:=1
          PKG_LICENSE:=GPL-2.0

          include $(INCLUDE_DIR)/package.mk

          define Package/luci-app-ddnsto
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=3. Applications
            TITLE:=DDNSTO client for OpenWrt
            DEPENDS:=+curl +ca-certificates
          endef

          define Package/luci-app-ddnsto/install
          	$(INSTALL_DIR) $(1)/usr/bin $(1)/etc/init.d $(1)/etc/config $(1)/etc/uci-defaults
          	$(INSTALL_BIN) ./files/ddnsto $(1)/usr/bin/ddnsto
          	$(INSTALL_BIN) ./files/ddnsto.init $(1)/etc/init.d/ddnsto
          	$(INSTALL_CONF) ./files/ddnsto.config $(1)/etc/config/ddnsto
          	$(INSTALL_BIN) ./files/99-ddnsto-defaults $(1)/etc/uci-defaults/99-ddnsto-defaults
          endef

          $(eval $(call BuildPackage,luci-app-ddnsto))
          EOF

          # init 脚本：仅当 enabled=1 且 token 非空时才启动 procd 实例
          cat > files/ddnsto.init <<'EOF'
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1

          start_service() {
            config_load ddnsto
            local enabled token
            config_get_bool enabled 'config' 'enabled' 0
            config_get token 'config' 'token'

            [ "$enabled" -eq 1 ] || return 0
            [ -n "$token" ] || return 0

            procd_open_instance
            procd_set_param command /usr/bin/ddnsto -t "$token"
            procd_set_param respawn
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
          }

          stop_service() {
            procd_kill ddnsto
          }

          service_triggers() {
            procd_add_reload_trigger "ddnsto"
          }
          EOF
          chmod +x files/ddnsto.init

          # 默认配置：enabled=0，token 为空
          cat > files/ddnsto.config <<'EOF'
          config ddnsto 'config'
            option enabled '0'
            option token ''
          EOF

          # uci-defaults：首次启动时兜底强制关闭并清空 token
          cat > files/99-ddnsto-defaults <<'EOF'
          #!/bin/sh
          uci -q get ddnsto.config.enabled >/dev/null 2>&1 || {
            uci set ddnsto.config.enabled='0'
            uci set ddnsto.config.token=''
            uci commit ddnsto
          }
          exit 0
          EOF
          chmod +x files/99-ddnsto-defaults

      # ========== cpu-status-mini：采样间隔改为 1 秒 ==========
      - name: Customize cpu-status-mini interval
        run: |
          cd openwrt/package/luci-app-cpu-status-mini
          mkdir -p root/etc/uci-defaults
          cat > root/etc/uci-defaults/99-cpu-status-interval <<'EOF'
          #!/bin/sh
          uci set luci.main.interval_cpu='1' 2>/dev/null || true
          uci commit luci
          exit 0
          EOF
          chmod +x root/etc/uci-defaults/99-cpu-status-interval

      - name: Install feeds (after custom packages)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ========== 生成 .config ==========
      - name: Generate .config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          # Target
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          # LAN
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_PREINIT_NETWORK="192.168.15.1/24"

          # LuCI / Language
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # Physical NIC drivers (含 82579LM / 82574L)
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-r8125=y
          CONFIG_PACKAGE_kmod-atlantic=y

          # Virtualization (KVM 等)
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-blk=y
          CONFIG_PACKAGE_kmod-virtio-balloon=y
          CONFIG_PACKAGE_kmod-vhost-net=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-kvm=y
          CONFIG_PACKAGE_kmod-kvm-amd=y
          CONFIG_PACKAGE_kmod-kvm-intel=y
          CONFIG_PACKAGE_qemu-ga=y

          # 用户指定包
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          # DDNSTO（自定义包）
          CONFIG_PACKAGE_luci-app-ddnsto=y

          # cpu-status-mini
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          # OpenClash 依赖
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_luci-compat=y

          # homeproxy（sing-box 引擎）
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ucode-mod-digest=y

          # 常用工具
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          EOF

      # ========== OpenClash 内核：多源容错集成 ==========
      - name: Download and Integrate Clash Meta Core
        run: |
          cd openwrt
          CORE_DIR="files/etc/openclash/core"
          mkdir -p "$CORE_DIR"
          CORE_PATH="$CORE_DIR/clash_meta"
          TMP_TAR="/tmp/clash-linux-amd64.tar.gz"

          # 按优先级排列的下载源（官方 raw / Release 直链 / jsDelivr 镜像）
          URLS=(
            "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64.tar.gz"
            "https://github.com/vernesong/OpenClash/releases/download/Clash/clash-linux-amd64.tar.gz"
            "https://cdn.jsdelivr.net/gh/vernesong/OpenClash@core/master/meta/clash-linux-amd64.tar.gz"
          )

          DOWNLOAD_SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "🔽 尝试下载: $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 "$url" -o "$TMP_TAR"; then
              if file "$TMP_TAR" | grep -qi "gzip compressed"; then
                echo "✅ 文件格式有效"
                DOWNLOAD_SUCCESS=1
                break
              else
                echo "⚠️ 不是有效的 gzip，尝试下一个..."
              fi
            else
              echo "⚠️ 下载失败，尝试下一个..."
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" -ne 1 ]; then
            echo "❌ 所有下载源均失败"
            exit 1
          fi

          tar -xzf "$TMP_TAR" -C /tmp/
          EXTRACTED_BIN=$(find /tmp -maxdepth 1 -type f -name "clash*" ! -name "*.tar.gz" | head -1)
          if [ -z "$EXTRACTED_BIN" ]; then
            echo "❌ 解压后未找到内核二进制文件"
            exit 1
          fi

          mv "$EXTRACTED_BIN" "$CORE_PATH"
          chmod 0755 "$CORE_PATH"
          echo "✅ 内核已就绪: $CORE_PATH"
          ls -lh "$CORE_PATH"
          file "$CORE_PATH"

      - name: Configure LuCI default language
        run: |
          cd openwrt
          mkdir -p files/etc/config
          cat > files/etc/config/luci <<'EOF'
          config core 'main'
            option lang 'zh_cn'
            option mediaurlbase '/luci-static/bootstrap'
            option resourcebase '/luci-static/resources'
          EOF

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifact
        if: inputs.upload_artifact == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-x86-64-25.12-snapshot_15.1
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.vmdk
            openwrt/bin/targets/x86/64/*.qcow2
            openwrt/bin/targets/x86/64/sha256sums
          retention-days: 7
