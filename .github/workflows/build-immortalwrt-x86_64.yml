name: Build OpenWrt x86_64 Firmware (v25.12.5)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'OpenWrt 源码标签'
        required: true
        default: 'v25.12.5'
        type: string

env:
  REPO_URL: https://github.com/openwrt/openwrt

jobs:
  build-firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libssl-dev libtool python3 python3-setuptools python3-pyelftools \
          rsync subversion swig time unzip wget xsltproc zlib1g-dev

      - name: Clone OpenWrt official source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.source_tag }} $REPO_URL openwrt
          cd openwrt
          echo "BUILD_TAG=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Clone third-party packages (带失败重试)
        run: |
          cd openwrt/package
          
          # 通用克隆重试函数
          git_clone_retry() {
            local repo_url=$1
            local target_dir=$2
            local retries=3
            local count=0
            while [ $count -lt $retries ]; do
              if git clone --depth 1 --filter=blob:none "$repo_url" "$target_dir"; then
                echo "✅ $target_dir 克隆成功"
                return 0
              fi
              count=$((count+1))
              echo "⚠️ $target_dir 克隆失败，第 $count 次重试..."
              rm -rf "$target_dir"
              sleep 5
            done
            echo "❌ $target_dir 克隆失败，已重试 $retries 次"
            return 1
          }
          
          git_clone_retry https://github.com/linkease/ddnsto-openwrt-package.git ddnsto
          git_clone_retry https://github.com/sirpdboy/luci-app-ddns-go.git luci-app-ddns-go

      - name: 集成 TurboACC (含 FullCone NAT  LuCI 界面)
        run: |
          cd openwrt
          # 自动集成脚本：失败重试2次
          for i in 1 2; do
            curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh && break
            echo "⚠️ 第 $i 次集成失败，5秒后重试..."
            sleep 5
          done

      - name: Update & install feeds
        run: |
          cd openwrt
          unset ARCH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS HOSTCC HOSTCXX
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate custom .config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          # ======================== 目标平台配置 ========================
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ======================== 固件镜像格式 ========================
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_GRUB_TIMEOUT="1"

          # ======================== 内核开启 FullCone NAT 支持 ========================
          CONFIG_KERNEL_NF_NAT_FULLCONE=y

          # ======================== 基础依赖组件 ========================
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          # ======================== 核心中文语言包 ========================
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          # ======================== TTYD 网页终端 ========================
          CONFIG_PACKAGE_luci-app-ttyd=y

          # ======================== UPnP (nftables 版) ========================
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          # ======================== DDNS 脚本版 ========================
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          # ======================== uHTTPd 管理界面 ========================
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          # ======================== DDNS-Go ========================
          CONFIG_PACKAGE_ddns-go=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn=y

          # ======================== DDNSTO ========================
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y

          # ======================== FullCone NAT 网络加速插件 ========================
          CONFIG_PACKAGE_nft-fullcone=y
          CONFIG_PACKAGE_luci-app-turboacc=y

          # ======================== Intel 千兆网卡驱动 ========================
          CONFIG_PACKAGE_kmod-e1000e=y

          # ======================== 系统统计与温度监控 ========================
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          EOF

      - name: Auto-complete build config
        run: |
          cd openwrt
          unset ARCH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS HOSTCC HOSTCXX
          make defconfig V=s

      - name: Download source packages
        run: |
          cd openwrt
          unset ARCH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS HOSTCC HOSTCXX
          make download -j8

      - name: Compile firmware
        run: |
          cd openwrt
          unset ARCH CFLAGS CPPFLAGS CXXFLAGS LDFLAGS HOSTCC HOSTCXX
          make -j$(nproc) || make -j1 V=s

      - name: Organize output files
        run: |
          cd openwrt
          mkdir -p output/firmware output/config
          cp -r bin/targets/x86/64/* output/firmware/
          cp .config output/config/build.config
          echo "Build completed: ${{ env.BUILD_TAG }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt-x86_64-${{ env.BUILD_TAG }}
          path: openwrt/output/
          retention-days: 30
