name: Build OpenWrt x86_64

on:
  workflow_dispatch:

env:
  OPENWRT_REPO: openwrt/openwrt
  OPENWRT_VERSION: v25.12.5
  SONIC_SCRIPT_URL: https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh
  SRC_DIR: openwrt-src
  BIN_DIR: bin/targets/x86/64

concurrency:
  group: build-openwrt-x86-64
  cancel-in-progress: true

jobs:
  build:
    name: x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-distutils rsync unzip wget zlib1g-dev xsltproc time patch bash

      - name: Checkout OpenWrt
        uses: actions/checkout@v6
        with:
          repository: ${{ env.OPENWRT_REPO }}
          ref: ${{ env.OPENWRT_VERSION }}
          fetch-depth: 1
          path: ${{ env.SRC_DIR }}

      - name: Update feeds
        working-directory: ${{ env.SRC_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply sonic fullcone patch
        working-directory: ${{ env.SRC_DIR }}
        run: |
          curl -sSL ${{ env.SONIC_SCRIPT_URL }} | bash

      - name: Set default language Chinese
        working-directory: ${{ env.SRC_DIR }}
        run: |
          mkdir -p files/etc/uci-defaults
          printf '#!/bin/sh\nuci set luci.main.lang='"'"'zh_cn'"'"'\nuci commit luci\n' > files/etc/uci-defaults/99-set-lang
          chmod 755 files/etc/uci-defaults/99-set-lang

      - name: Write config
        working-directory: ${{ env.SRC_DIR }}
        run: |
          rm -f .config
          echo 'CONFIG_TARGET_x86=y' >> .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_DEVICE_generic=y' >> .config
          echo 'CONFIG_DEVEL=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-upnp=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_ddns-scripts=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ddns=y' >> .config
          echo 'CONFIG_PACKAGE_ddns-scripts-cloudflare=y' >> .config
          echo 'CONFIG_PACKAGE_ddns-scripts-dnspod=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-uhttpd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-statistics=y' >> .config
          echo 'CONFIG_PACKAGE_collectd-mod-thermal=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-thermal=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-hwmon-core=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ca-certificates=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-sonic-fullcone=y' >> .config

      - name: Defconfig and download
        working-directory: ${{ env.SRC_DIR }}
        run: |
          make defconfig
          grep -q CONFIG_PACKAGE_luci-i18n-base-zh-cn=y .config || exit 1
          make download -j8

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ${{ env.SRC_DIR }}/dl
          key: owrt-25-12-5
          restore-keys: owrt-

      - name: Build
        working-directory: ${{ env.SRC_DIR }}
        run: make -j8 || make -j1 V=s

      - name: Verify i18n
        if: always()
        working-directory: ${{ env.SRC_DIR }}
        run: |
          ls ${{ env.BIN_DIR }}/packages/*zh-cn* 2>/dev/null || exit 1
          grep -i luci-i18n ${{ env.BIN_DIR }}/*.manifest || true

      - name: Upload
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: OpenWrt-x86-64-25.12.5
          path: |
            ${{ env.SRC_DIR }}/${{ env.BIN_DIR }}/*.img.gz
            ${{ env.SRC_DIR }}/${{ env.BIN_DIR }}/*.manifest
            ${{ env.SRC_DIR }}/${{ env.BIN_DIR }}/profiles.json
            ${{ env.SRC_DIR }}/${{ env.BIN_DIR }}/packages/
          retention-days: 7
