# ============================================================================
# OpenWrt 25.12.5 官方正式版 GitHub Actions 云编译工作流
# 集成 mufeng05/openwrt-sonic-fullcone (内核级 Full Cone NAT 方案)
# 版本：v25.12.5 官方稳定版
#
# 【重要】25.12.5 已将包管理器从 opkg 切换为 apk (Alpine Package Keeper)
# 软件包格式从 .ipk 变为 .apk
#
# 此方案通过打补丁方式修改内核和防火墙，配置集成在原生防火墙界面。
#
# 【触发方式】仅手动触发（Actions 页面 → Run workflow）
# ============================================================================

name: Build OpenWrt 25.12.5 with Sonic-Fullcone

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '启用 SSH 调试连接'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      clean:
        description: '是否执行 make clean'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.5
  SONIC_FULLCONE_REPO: https://github.com/mufeng05/openwrt-sonic-fullcone
  SONIC_FULLCONE_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync swig unzip wget file libelf-dev python3-dev qemu-utils \
          libtinfo5 aria2 \
          autoconf automake libtool \
          2>&1 | tail -5
        sudo apt-get autoremove -y --purge
        sudo apt-get clean

    - name: Clone OpenWrt source code
      run: |
        echo "==== 克隆 OpenWrt 源码 ===="
        echo "仓库: ${{ env.REPO_URL }}"
        echo "分支/标签: ${{ env.REPO_BRANCH }}"
        git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
        cd openwrt
        echo "源码版本: $(git log -1 --format='%h %s')"

    - name: Integrate Sonic Full Cone NAT
      working-directory: openwrt
      run: |
        echo "==== 集成 Sonic Full Cone NAT 补丁 ===="

        # 1. 更新并安装所有 feeds（应用 LuCI 补丁的前提）
        echo "---- 更新和安装 feeds ----"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 2. 下载并执行一键集成脚本
        echo "---- 下载集成脚本 ----"
        SCRIPT_URL="${{ env.SONIC_FULLCONE_REPO }}/raw/${{ env.SONIC_FULLCONE_BRANCH }}/add_sonic_fullcone.sh"
        echo "下载地址: $SCRIPT_URL"

        HTTP_CODE=$(curl -sL -o /tmp/add_sonic_fullcone.sh -w "%{http_code}" "$SCRIPT_URL")
        echo "HTTP 状态码: $HTTP_CODE"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "[ERROR] 脚本下载失败 (HTTP $HTTP_CODE)，尝试 main 分支..."
          SONIC_FULLCONE_BRANCH="main"
          SCRIPT_URL="${{ env.SONIC_FULLCONE_REPO }}/raw/main/add_sonic_fullcone.sh"
          echo "重试下载地址: $SCRIPT_URL"
          HTTP_CODE=$(curl -sL -o /tmp/add_sonic_fullcone.sh -w "%{http_code}" "$SCRIPT_URL")
          echo "HTTP 状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "[ERROR] main 分支也失败，放弃"
            exit 1
          fi
        fi

        if head -1 /tmp/add_sonic_fullcone.sh | grep -q "<!DOCTYPE\|<html"; then
          echo "[ERROR] 下载到的内容是 HTML 页面，不是脚本"
          cat /tmp/add_sonic_fullcone.sh | head -20
          exit 1
        fi

        echo "---- 脚本内容预览（前 30 行） ----"
        head -30 /tmp/add_sonic_fullcone.sh

        echo "---- 执行集成脚本 ----"
        bash /tmp/add_sonic_fullcone.sh 2>&1 | tee /tmp/sonic-install.log

        echo "==== 集成脚本完整日志 ===="
        cat /tmp/sonic-install.log

        # 3. 验证补丁是否应用成功
        echo "---- 验证补丁文件 ----"
        PATCH_FOUND=0
        for f in $(find target/linux/generic/hack-* -name "*sonic*fullcone*" -o -name "*fullcone*" 2>/dev/null); do
          echo "[OK] 内核补丁: $f"
          PATCH_FOUND=1
        done
        for f in $(find package/ -path "*/patches/*fullcone*" -o -path "*/patches/*sonic*" 2>/dev/null); do
          echo "[OK] 包补丁: $f"
          PATCH_FOUND=1
        done

        if [ "$PATCH_FOUND" -eq 0 ]; then
          echo "[WARN] 未通过文件名找到补丁，检查脚本是否使用了其他方式集成"
          echo "---- 检查 git 状态 ----"
          git status --short | head -30 || true
        fi

        # 4. 验证 libnftnl 的 Makefile 是否被修改
        echo "---- 验证 libnftnl Makefile 修改 ----"
        if grep -q "PKG_FIXUP:=autoreconf" package/libs/libnftnl/Makefile 2>/dev/null; then
          echo "[OK] libnftnl Makefile 已修改"
        else
          echo "[WARN] libnftnl Makefile 未被修改，可能该版本不需要此修改"
        fi

    - name: Integrate LuCI CPU & Temp status plugins
      working-directory: openwrt
      run: |
        echo "==== 集成第三方 LuCI 插件 (gSpotx2f) ===="
        mkdir -p package/gspotx2f

        clone_plugin() {
          local name="$1"
          local url="https://github.com/gSpotx2f/${name}.git"
          echo "---- 克隆 ${name} ----"
          if git clone --depth 1 "${url}" "package/gspotx2f/${name}"; then
            echo "[OK] ${name} 克隆成功"
            ls -la "package/gspotx2f/${name}/"
          else
            echo "[WARN] ${name} 克隆失败，尝试 master 分支..."
            git clone --depth 1 -b master "${url}" "package/gspotx2f/${name}" || true
          fi
        }

        clone_plugin "luci-app-cpu-status-mini"
        clone_plugin "luci-app-temp-status"

        echo "---- 校验 Makefile 是否存在 ----"
        [ -f package/gspotx2f/luci-app-cpu-status-mini/Makefile ] && echo "[OK] cpu-status-mini Makefile 存在" || echo "[ERR] cpu-status-mini 缺少 Makefile"
        [ -f package/gspotx2f/luci-app-temp-status/Makefile ] && echo "[OK] temp-status Makefile 存在" || echo "[ERR] temp-status 缺少 Makefile"

        echo "---- 刷新包索引并确认包名被识别 ----"
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        grep -r "PKG_NAME.*cpu.status\|PKG_NAME.*temp.status" package/gspotx2f/*/Makefile || true

    - name: Generate .config
      working-directory: openwrt
      run: |
        cat > .config << 'EOF'
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_DEVEL=y
        CONFIG_CCACHE=y
        CONFIG_BUILD_NLS=y
        CONFIG_LUCI_LANG_zh_Hans=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=256
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_ttyd=y
        CONFIG_PACKAGE_miniupnpd-nftables=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_ddns-scripts=y
        CONFIG_PACKAGE_luci-app-ddns=y
        CONFIG_PACKAGE_ddns-scripts-cloudflare=y
        CONFIG_PACKAGE_ddns-scripts-dnspod=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_luci-app-uhttpd=y
        CONFIG_PACKAGE_luci-app-statistics=y
        CONFIG_PACKAGE_collectd-mod-thermal=y
        CONFIG_PACKAGE_kmod-thermal=y
        CONFIG_PACKAGE_kmod-hwmon-core=y
        # Fullcone 相关（Sonic 补丁自带，显式声明便于排查）
        CONFIG_PACKAGE_kmod-nft-fullcone=y
        # 第三方插件：CPU 占用 + 温度显示（LuCI 状态首页）
        CONFIG_PACKAGE_luci-app-cpu-status-mini=y
        CONFIG_PACKAGE_luci-app-temp-status=y
        # temp-status 运行时依赖（必须）
        CONFIG_PACKAGE_ucode=y
        CONFIG_PACKAGE_ucode-mod-fs=y
        # 温度传感器侧支持（x86_64：coretemp/acpi；无传感器节点时温度栏会空白，属正常）
        CONFIG_PACKAGE_lm-sensors=y
        CONFIG_PACKAGE_kmod-hwmon-vid=y
        CONFIG_PACKAGE_kmod-hwmon-coretemp=y
        CONFIG_PACKAGE_kmod-i2c-core=y
        CONFIG_PACKAGE_kmod-i2c-i801=y
        CONFIG_PACKAGE_kmod-i2c-smbus=y
        CONFIG_PACKAGE_kmod-acpi-cpufreq=y
        # Flow offloading（与 fullcone 建议二选一，先编译进来按需开关）
        CONFIG_PACKAGE_kmod-nft-offload=y
        CONFIG_PACKAGE_kmod-nf-flow=y
        EOF

        sed -i 's/^ *//' .config

        echo "==== 执行 make defconfig ===="
        make defconfig

        echo "==== 验证关键配置项 ===="
        grep -E "CONFIG_(LUCI_LANG_zh_Hans|PACKAGE_luci-i18n-base-zh-cn|PACKAGE_luci-app-firewall|PACKAGE_miniupnpd-nftables|PACKAGE_luci-app-cpu-status-mini|PACKAGE_luci-app-temp-status|PACKAGE_ucode)" .config | sort

    - name: Apply custom files overlay
      working-directory: openwrt
      run: |
        mkdir -p files/etc/uci-defaults

        cat > files/etc/uci-defaults/99-custom-defaults << 'UCIEOF'
        #!/bin/sh

        # 时区与语言
        uci set system.@system[0].timezone='CST-8'
        uci set system.@system[0].zonename='Asia/Shanghai'
        uci commit system
        uci set luci.main.lang='zh_Hans'
        uci commit luci

        # 1) Fullcone NAT 全局总开关（LuCI：网络→防火墙→常规设置 的复选框）
        uci set firewall.@defaults[0].fullcone='1'

        # 2) 所有 zone 逐个打开 fullcone（LuCI：网络→防火墙→区域 每行的复选框）
        for z in $(uci show firewall | grep -E '\.name=' | sed -n "s/firewall.\([^=]*\)\.name='\([^']*\)'/\1 \2/p"); do
          sec=$(echo "$z" | awk '{print $1}')
          nam=$(echo "$z" | awk '{print $2}')
          [ -z "$sec" ] && continue
          uci set firewall.${sec}.fullcone='1'
          uci set firewall.${sec}.fullcone_proto='both'
          echo "[fullcone] zone ${nam} (${sec}) -> enabled"
        done

        # 兜底：若遍历未匹配到，显式写入 wan / wan6
        uci -q get firewall.wan.name >/dev/null 2>&1 && {
          uci set firewall.wan.fullcone='1'
          uci set firewall.wan.fullcone_proto='both'
        }
        uci -q get firewall.wan6.name >/dev/null 2>&1 && {
          uci set firewall.wan6.fullcone='1'
          uci set firewall.wan6.fullcone_proto='both'
        }

        uci commit firewall
        UCIEOF
        chmod +x files/etc/uci-defaults/99-custom-defaults

        echo "==== files 覆盖已应用 ===="
        find files/ -type f

    - name: SSH debug connection
      if: github.event.inputs.ssh == 'true'
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true

    - name: Download all package sources
      working-directory: openwrt
      run: |
        make defconfig
        make download -j$(nproc) 2>&1 || {
          echo "[提示] 部分文件下载失败，正在重试..."
          make download -j1 V=s 2>&1 | tail -50
        }
        find dl -maxdepth 2 -type f | wc -l

    - name: Clean build directory
      if: github.event.inputs.clean == 'true'
      working-directory: openwrt
      run: make clean

    - name: Compile OpenWrt firmware
      working-directory: openwrt
      run: |
        THREADS=$(nproc)
        echo "==== 开始编译 ===="
        echo "CPU 核心数: $THREADS"
        echo "OpenWrt 分支: ${{ env.REPO_BRANCH }}"
        echo "目标架构: x86/64"
        echo "Full Cone 方案: Sonic (内核级补丁)"
        echo "开始时间: $(date '+%Y-%m-%d %H:%M:%S')"

        make -j$THREADS V=s 2>&1 | tail -30 || {
          echo "[错误] 编译失败，尝试单线程重编译..."
          make -j1 V=s 2>&1 | tee /tmp/build-error.log | tail -100
          echo "==== 编译错误日志（最后 200 行） ===="
          tail -200 /tmp/build-error.log
          exit 1
        }

        echo "==== 编译完成 ===="
        echo "结束时间: $(date '+%Y-%m-%d %H:%M:%S')"

    - name: Organize build artifacts
      run: |
        echo "==== 编译产物列表 ===="
        find openwrt/bin/targets/ -type f \( -name "*.bin" -o -name "*.img*" -o -name "*.manifest" \) | sort
        echo ""
        echo "==== 固件版本信息 ===="
        cat openwrt/bin/targets/x86/64/version.buildinfo 2>/dev/null || true
        cat openwrt/bin/targets/x86/64/profiles.json 2>/dev/null | head -20 || true
        echo ""
        echo "==== 固件 SHA256 校验值 ===="
        cd openwrt/bin/targets/
        find . -name "sha256sums" -exec cat {} \;

    - name: Verify plugins packed into rootfs
      run: |
        echo "==== 反查 manifest：确认两个插件已进固件 ===="
        MANIFEST=$(find openwrt/bin/targets/ -name "*.manifest" | head -1)
        if [ -z "$MANIFEST" ]; then
          echo "[WARN] 未找到 manifest 文件，跳过校验"
          exit 0
        fi
        echo "使用清单: $MANIFEST"
        grep -E "luci-app-cpu-status-mini|luci-app-temp-status|ucode-mod-fs" "$MANIFEST" && echo "[OK] 插件已在固件中" || echo "[ERR] 插件未进入固件，请检查 .config 与 feeds"

    - name: Upload firmware
      uses: actions/upload-artifact@v6
      with:
        name: OpenWrt-25.12.5-x86_64-sonic-fullcone-cpu-temp-${{ github.run_number }}
        path: openwrt/bin/targets/**
        retention-days: 7

    - name: Upload build config
      uses: actions/upload-artifact@v6
      with:
        name: Build-Config-25.12.5-${{ github.run_number }}
        path: |
          openwrt/.config
          openwrt/config.buildinfo
          openwrt/feeds.conf.default
        retention-days: 7
