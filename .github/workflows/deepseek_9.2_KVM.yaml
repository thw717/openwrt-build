name: Build OpenWrt 25.12.6 x86_64 (Full NIC Drivers + DDNSTO + Sonic + Proxy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v5
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and Install Official Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fetch Third-Party Packages (OpenClash + HomeProxy + sing-box)
        working-directory: ./openwrt
        run: |
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/luci-app-homeproxy
          git clone --depth 1 https://github.com/immortalwrt/packages.git /tmp/imm-packages
          cp -r /tmp/imm-packages/net/sing-box package/sing-box
          rm -rf /tmp/imm-packages

      - name: Apply SONiC FullCone Patch
        working-directory: ./openwrt
        run: |
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Fix DDNSTO Default Disabled & Inject UCI Defaults
        working-directory: ./openwrt
        run: |
          DDNSTO_CONFIG=$(find package -type f -name "ddnsto.config" | head -n 1)
          if [ -n "$DDNSTO_CONFIG" ]; then
            sed -i "s/option enabled '1'/option enabled '0'/g" "$DDNSTO_CONFIG"
            sed -i 's/option enabled "1"/option enabled "0"/g' "$DDNSTO_CONFIG"
          fi

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-settings <<'EOF'
          #!/bin/sh
          # LAN IP 192.168.9.2
          uci set network.lan.ipaddr='192.168.9.2'
          uci commit network

          # 关闭 LAN DHCP
          uci set dhcp.lan.ignore='1'
          uci commit dhcp

          # 禁用 IPv6（接口 / DHCPv6 / RA / ULA）
          uci set network.lan.ipv6='0'
          uci set network.wan6.disabled='1'
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ra='disabled'
          uci set network.globals.ula_prefix=''
          uci commit network
          uci commit dhcp

          # 简体中文
          uci set luci.main.lang='zh_cn'
          uci commit luci

          # CPU Status Mini 采样间隔 1 秒
          if uci get cpu-status.@cpu-status[0] >/dev/null 2>&1; then
            uci set cpu-status.@cpu-status[0].interval='1'
            uci commit cpu-status
          fi

          # DDNSTO 首次启动保持关闭
          if uci get ddnsto.@ddnsto[0] >/dev/null 2>&1; then
            uci set ddnsto.@ddnsto[0].enabled='0'
            uci commit ddnsto
          fi
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-settings

      - name: Configure Build (.config)
        working-directory: ./openwrt
        run: |
          make defconfig

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          # 基础中文与主题
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # 用户指定工具
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          # 统计与温度
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          # DDNSTO
          CONFIG_PACKAGE_luci-app-ddnsto=y

          # CPU Status Mini
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          # OpenClash + HomeProxy
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_luci-compat=y

          # ============================================================
          # 虚拟网卡驱动（重点：修复爱快/KVM VirtIO 无法识别问题）
          # ============================================================
          CONFIG_PACKAGE_kmod-virtio=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-blk=y
          CONFIG_PACKAGE_kmod-virtio-scsi=y
          # VMware
          CONFIG_PACKAGE_kmod-vmxnet3=y
          # Hyper-V（可选，如在 Hyper-V 中使用可启用）
          CONFIG_PACKAGE_kmod-hyperv-net-vsc=y
          CONFIG_PACKAGE_kmod-hyperv-util=y
          CONFIG_PACKAGE_kmod-hyperv-storage=y

          # ============================================================
          # 物理有线网卡驱动（按芯片系列分组）
          # ============================================================
          # --- Intel 千兆 ---
          CONFIG_PACKAGE_kmod-e1000e=y    # I217/I218/I219 板载千兆
          CONFIG_PACKAGE_kmod-igb=y       # I350/I210/I211/82576 多口/工控千兆
          CONFIG_PACKAGE_kmod-e1000=y     # 82540/82545 经典及虚拟机兼容

          # --- Intel 2.5G ---
          CONFIG_PACKAGE_kmod-igc=y       # I225-V / I226-V（主流 2.5G 小主机标配）[citation:6†L12-L13]

          # --- Intel 万兆 ---
          CONFIG_PACKAGE_kmod-ixgbe=y     # X520/X540/X550/82599 万兆
          CONFIG_PACKAGE_kmod-i40e=y      # X710/XL710 系列万兆/40G[citation:15†L7-L8]

          # --- Realtek 千兆 ---
          CONFIG_PACKAGE_kmod-r8169=y     # RTL8111/8168 通用内核驱动
          CONFIG_PACKAGE_kmod-r8168=y     # Realtek 官方优化驱动（部分 RTL8111/8168 芯片 r8169 有 TX 队列停滞问题，可切换此驱动）[citation:14†L26-L29]

          # --- Realtek 2.5G / 5G ---
          CONFIG_PACKAGE_kmod-r8125=y     # RTL8125 / 8125B / 8125BG 2.5G[citation:6†L13-L14]
          CONFIG_PACKAGE_kmod-r8126=y     # RTL8126 5G[citation:6†L14-L15]
          CONFIG_PACKAGE_kmod-r8127=y     # RTL8127 5G[citation:6†L14-L15]

          # --- Broadcom ---
          CONFIG_PACKAGE_kmod-tg3=y       # Broadcom Tigon3 千兆
          CONFIG_PACKAGE_kmod-bnx2=y      # Broadcom NetXtreme II

          # --- 其他常见万兆/小众 ---
          CONFIG_PACKAGE_kmod-atlantic=y  # Aquantia AQC107/AQC113 电口万兆
          CONFIG_PACKAGE_kmod-mlx4-core=y # Mellanox ConnectX-3
          CONFIG_PACKAGE_kmod-mlx5-core=y # Mellanox ConnectX-4/5
          CONFIG_PACKAGE_kmod-amd-xgbe=y  # AMD 板载万兆
          EOF

          make defconfig

      - name: Compile Firmware
        working-directory: ./openwrt
        run: |
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-25.12.6-x86_64-full-nic
          path: openwrt/bin/targets/x86/64/
          retention-days: 7