name: Build OpenWrt 25.12.5 with Sonic Fullcone

# 仅允许手动触发工作流
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com
  REPO_BRANCH: v25.12.5
  CONFIG_FILE: .config
  DIY_SH: diy.sh

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xz-utils zlib1g-dev libz3-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        df -h
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install Feeds
      working-directory: /workdir/openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply Sonic Fullcone Patches
      working-directory: /workdir/openwrt
      run: |
        echo "Applying openwrt-sonic-fullcone patches..."
        curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

    - name: Generate Custom Configuration (.config)
      working-directory: /workdir/openwrt
      run: |
        # 设置 x86/64 目标平台架构
        echo "CONFIG_TARGET_x86=y" > $CONFIG_FILE
        echo "CONFIG_TARGET_x86_64=y" >> $CONFIG_FILE
        echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> $CONFIG_FILE

        # 基础包与主题
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y" >> $CONFIG_FILE
        
        # TTYD 终端
        echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> $CONFIG_FILE
        
        # UPnP (自动处理并确保编译进现有 nft_masq 模块)
        echo "CONFIG_PACKAGE_miniupnpd-nftables=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-app-upnp=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y" >> $CONFIG_FILE
        
        # DDNS 组件 (Cloudflare & DNSPod 驱动)
        echo "CONFIG_PACKAGE_ddns-scripts=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-app-ddns=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_ddns-scripts-cloudflare=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_ddns-scripts-dnspod=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_curl=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_ca-certificates=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y" >> $CONFIG_FILE
        
        # uHTTPd Web 服务器页面
        echo "CONFIG_PACKAGE_luci-app-uhttpd=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y" >> $CONFIG_FILE
        
        # 统计图表与温度检测组件
        echo "CONFIG_PACKAGE_luci-app-statistics=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_collectd-mod-thermal=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_kmod-thermal=y" >> $CONFIG_FILE
        echo "CONFIG_PACKAGE_kmod-hwmon-core=y" >> $CONFIG_FILE

        # 扩充配置文件并检查依赖性
        make defconfig

    - name: Download Dependency Packages
      working-directory: /workdir/openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      working-directory: /workdir/openwrt
      run: |
        echo "Using $(nproc) threads to compile..."
        make -j$(nproc) || make -j1 V=s

    - name: Check Space Usage
      run: df -h

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_Firmware_x86_64
        path: /workdir/openwrt/bin/targets/x86/64/
