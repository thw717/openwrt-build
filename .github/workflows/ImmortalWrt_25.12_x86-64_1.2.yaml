name: ImmortalWrt_25.12_x86-64_1.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget libelf-dev qemu-utils ccache

      - name: Clone ImmortalWrt source
        run: git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Add DDNSTO official feeds
        run: |
          cd openwrt
          echo 'src-git nas https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
          echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add OpenClash package
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/openclash
          cp -r /tmp/openclash/luci-app-openclash package/

      - name: Inject uci-defaults
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-defaults << 'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.1.2'
          uci set network.lan.netmask='255.255.255.0'
          uci set dhcp.lan.ignore='1'

          # Disable IPv6 on LAN and WAN interfaces and remove any explicit WAN6 interface.
          uci set network.lan.ipv6='0'
          uci set network.lan.delegate='0'
          uci set network.wan.ipv6='0'
          uci -q delete network.wan6
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.ndp='disabled'

          uci commit network
          uci commit dhcp

          # DHCPv6/RA daemon is not needed when IPv6 is disabled.
          /etc/init.d/odhcpd disable 2>/dev/null || true
          /etc/init.d/odhcpd stop 2>/dev/null || true

          uci set ddnsto.@ddnsto[0].enabled='0' 2>/dev/null
          uci commit ddnsto 2>/dev/null
          /etc/init.d/ddnsto disable 2>/dev/null
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-defaults

      - name: Configure .config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          # Disable the IPv6 protocol stack at kernel boot for x86 GRUB images.
          CONFIG_GRUB_BOOTOPTS="ipv6.disable=1"
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          EOF
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_25.12_x86-64_1.2
          path: openwrt/bin/targets/x86/64/
          retention-days: 30