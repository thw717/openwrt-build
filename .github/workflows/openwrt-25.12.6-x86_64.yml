name: Build OpenWrt 25.12.6 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-25.12.6-x86_64-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  OPENWRT_TAG: v25.12.6
  BUILD_TARGET: x86
  BUILD_SUBTARGET: 64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl jq \
            asciidoc binutils bzip2 ccache ecj fastjar java-propose-classpath \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libreadline-dev libsqlite3-dev \
            libtool lzma-dev mkisofs msmtp nano p7zip p7zip-full patch \
            perl python3 python3-dev python3-pip python3-ply python3-docutils \
            qemu-utils re2c subversion time uglifyjs upx-ucl xmlto xxd \
            zstd

      - name: Clone official OpenWrt 25.12.6 source
        run: |
          git clone --depth 1 --branch "${OPENWRT_TAG}" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OpenWrt source commit: $(git rev-parse --short HEAD)"
          grep -q 'DISTRIB_RELEASE' include/version.mk

      - name: Update and install official feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate DDNSTO package and CPU status mini
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          # DDNSTO: use Linkease's OpenWrt package layout, not the interactive
          # curl installer. The upstream package defaults enabled=0.
          git clone --depth 1 https://github.com/linkease/ddnsto-openwrt-package.git /tmp/ddnsto-package
          test -f /tmp/ddnsto-package/ddnsto/Makefile
          test -f /tmp/ddnsto-package/luci-app-ddnsto/Makefile
          mkdir -p package/linkease
          cp -a /tmp/ddnsto-package/ddnsto package/linkease/
          cp -a /tmp/ddnsto-package/luci-app-ddnsto package/linkease/

          # Defensive guard: keep DDNSTO disabled and token empty in the image.
          # Do not enable the init service at build time; LuCI/UCI controls it.
          if ! grep -Eq "option enabled ['\"]0['\"]" package/linkease/ddnsto/files/ddnsto.config; then
            sed -i "s/option enabled .*/option enabled '0'/" package/linkease/ddnsto/files/ddnsto.config
          fi
          grep -q "option enabled '0'" package/linkease/ddnsto/files/ddnsto.config
          if grep -Eq '^[[:space:]]*option token .+' package/linkease/ddnsto/files/ddnsto.config; then
            sed -i "/^[[:space:]]*option token /d" package/linkease/ddnsto/files/ddnsto.config
          fi

          # CPU status mini: source package for OpenWrt 25.12/APK.
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git /tmp/cpu-status-mini
          test -f /tmp/cpu-status-mini/Makefile
          mkdir -p package/custom
          cp -a /tmp/cpu-status-mini package/custom/luci-app-cpu-status-mini

          # Force the mini widget's LuCI polling interval to one second where
          # the upstream source uses poll.add(callback, N). Fail clearly if the
          # upstream implementation changes so this requirement is not silently lost.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("package/custom/luci-app-cpu-status-mini")
          changed = []
          for path in root.rglob("*.js"):
              original = path.read_text(encoding="utf-8")
              # Match poll.add(callback, interval); with callback spanning lines.
              updated, count = re.subn(
                  r"(poll\.add\([\s\S]*?),\s*\d+(\s*\);)",
                  lambda m: m.group(1) + ", 1" + m.group(2),
                  original,
                  count=1,
              )
              if count:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit("Could not find poll.add(callback, interval) in CPU status mini JS; inspect upstream source before building.")
          print("Set CPU status mini polling interval to 1 second in:", ", ".join(changed))

          # Add a small Simplified Chinese translation catalogue if the source
          # does not ship one. LuCI may still display untranslated source
          # strings where msgids differ; the build log preserves the source.
          mkdir -p package/custom/luci-app-cpu-status-mini/po/zh-cn
          if [ ! -f package/custom/luci-app-cpu-status-mini/po/zh-cn/cpu-status-mini.po ]; then
            cat > package/custom/luci-app-cpu-status-mini/po/zh-cn/cpu-status-mini.po <<'PO'
          msgid ""
          msgstr ""
          "Content-Type: text/plain; charset=UTF-8\n"
          "Content-Transfer-Encoding: 8bit\n"
          "Language: zh_CN\n"
          "Plural-Forms: nplurals=1; plural=0;\n"

          msgid "CPU usage"
          msgstr "CPU 使用率"

          msgid "CPU"
          msgstr "处理器"

          msgid "Load average"
          msgstr "系统负载"

          msgid "Temperature"
          msgstr "温度"
          PO
          fi

          # Print files for audit and fail early if expected upstream layout changes.
          find package/linkease/ddnsto package/linkease/luci-app-ddnsto -maxdepth 2 -type f | sort
          find package/custom/luci-app-cpu-status-mini -maxdepth 4 -type f | sort | head -80

      - name: Apply SONiC Fullcone patches
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          # The upstream script patches kernel NAT, iptables/nftables,
          # firewall4 and LuCI firewall integration. Fail the build if it fails.
          curl -fsSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh

          # Verify that expected patches landed in the source tree.
          find target/linux package feeds -type f \
            \( -iname '*sonic-fullcone*' -o -iname '*fullcone*' \) -print | tee /tmp/fullcone-patches.txt
          test -s /tmp/fullcone-patches.txt
          grep -n 'PKG_FIXUP.*autoreconf' package/libs/libnftnl/Makefile || true

      - name: Configure firmware and package selection
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'CONFIG'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_TARGET_KERNEL_PARTSIZE=128

          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_LUCI_LANG_en=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-sky2=y
          CONFIG_PACKAGE_kmod-8139too=y
          CONFIG_PACKAGE_kmod-8139cp=y
          CONFIG_PACKAGE_kmod-forcedeth=y
          CONFIG_PACKAGE_kmod-pcnet32=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_kmod-thermal=y

          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-opkg=n
          CONFIG_PACKAGE_luci-app-openclash=n
          CONFIG_PACKAGE_luci-app-homeproxy=n
          CONFIG_PACKAGE_luci-app-ssr-plus=n
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-passwall2=n
          CONFIG_PACKAGE_luci-app-argon-config=n
          CONFIG_PACKAGE_luci-theme-argon=n
          CONFIG
          make defconfig

          # Do not allow make defconfig to silently drop requested packages.
          for p in \
            luci-app-ttyd miniupnpd-nftables luci-app-upnp \
            ddns-scripts luci-app-ddns ddns-scripts-cloudflare ddns-scripts-dnspod \
            curl ca-certificates luci-app-uhttpd luci-app-statistics \
            collectd-mod-thermal kmod-thermal kmod-hwmon-core \
            ddnsto luci-app-ddnsto luci-app-cpu-status-mini; do
            if ! grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
              echo "::error::Requested package ${p} was not selected by OpenWrt 25.12.6 feeds/source."
              exit 1
            fi
          done

      - name: Set LAN address, default language and safe DDNSTO defaults
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-defaults <<'EOF'
          #!/bin/sh
          # LAN address
          uci -q batch <<'UCI'
          set network.lan.ipaddr='192.168.15.1'
          set network.lan.netmask='255.255.255.0'
          set luci.main.lang='zh_cn'
          set luci.main.mediaurlbase='/luci-static/bootstrap'
          commit network
          commit luci
          UCI

          # DDNSTO must start disabled until the user enters a token and enables it.
          if uci -q get ddnsto.config >/dev/null 2>&1; then
            uci set ddnsto.config.enabled='0'
            uci -q delete ddnsto.config.token || true
            uci commit ddnsto
          fi
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-custom-defaults

          # Ensure there is no build-time enabling of DDNSTO.
          if grep -R -nE 'ddnsto.*enable|/etc/init.d/ddnsto enable' files package/linkease/ddnsto package/linkease/luci-app-ddnsto; then
            echo "::warning::Review DDNSTO enable references above; no service should be enabled by this workflow."
          fi

      - name: Download sources and verify configuration
        working-directory: openwrt
        run: |
          make download -j"$(nproc)" V=s
          ./scripts/diffconfig.sh > diffconfig.txt
          echo "Selected package summary:"
          grep -E 'CONFIG_PACKAGE_(ddnsto|luci-app-ddnsto|luci-app-cpu-status-mini|luci-app-statistics|luci-app-upnp|luci-app-ddns|luci-app-ttyd)' .config || true
          echo "Kernel version:"
          grep '^LINUX_VERSION-' include/kernel-*.mk 2>/dev/null || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and build diagnostics
        if: always()
        working-directory: openwrt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          find bin/targets -type f \( \
            -name '*combined*.img*' -o \
            -name '*generic-ext4-combined*.img*' -o \
            -name '*generic-squashfs-combined*.img*' -o \
            -name '*rootfs*.tar.gz' -o \
            -name '*manifest' -o \
            -name 'sha256sums' \
            \) -exec cp -v {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          cp -f .config diffconfig.txt "$GITHUB_WORKSPACE/output/" 2>/dev/null || true
          git rev-parse HEAD > "$GITHUB_WORKSPACE/output/openwrt-commit.txt" 2>/dev/null || true
          {
            echo "DDNSTO source: https://github.com/linkease/ddnsto-openwrt-package"
            echo "Fullcone source: https://github.com/mufeng05/openwrt-sonic-fullcone"
            echo "CPU mini source: https://github.com/gSpotx2f/luci-app-cpu-status-mini"
            echo "Firmware build status is determined by the Build firmware step."
          } > "$GITHUB_WORKSPACE/output/BUILD-INFO.txt"

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-25.12.6-x86_64
          path: output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-25.12.6-build-diagnostics
          path: |
            openwrt/.config
            openwrt/diffconfig.txt
            openwrt/logs/
            output/
          if-no-files-found: ignore
          retention-days: 7
