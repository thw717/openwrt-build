name: Build ImmortalWrt 25.12 x86_64 OpenClash SSRPlus

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 --branch ${OPENWRT_BRANCH} https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt

      - name: Add feeds
        run: |
          cd openwrt
          git clone --depth=1 https://github.com/vernesong/OpenClash.git package/OpenClash
          git clone --depth=1 https://github.com/fw876/helloworld.git package/helloworld

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt

          cat > .config <<'EOF'
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y

CONFIG_PACKAGE_luci-app-ssr-plus=y

CONFIG_PACKAGE_luci-app-homeproxy=y

CONFIG_PACKAGE_ddnsto=y
CONFIG_PACKAGE_luci-app-ddnsto=y

CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_ddns-scripts-cloudflare=y
CONFIG_PACKAGE_ddns-scripts-dnspod=y

CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
CONFIG_PACKAGE_miniupnpd-nftables=y

CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_ca-certificates=y

CONFIG_PACKAGE_luci-app-uhttpd=y
CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

CONFIG_PACKAGE_kmod-e1000e=y
CONFIG_PACKAGE_kmod-e1000=y
CONFIG_PACKAGE_kmod-igb=y
CONFIG_PACKAGE_kmod-ixgbe=y
EOF

          make defconfig

      - name: Add first boot defaults
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-custom-defaults <<'EOF'
#!/bin/sh

uci set network.lan.ipaddr='192.168.1.2'
uci set network.lan.netmask='255.255.255.0'
uci commit network

for s in openclash homeproxy shadowsocksr ddnsto; do
    if [ -x /etc/init.d/$s ]; then
        /etc/init.d/$s disable || true
        /etc/init.d/$s stop || true
    fi
done

exit 0
EOF

          chmod +x files/etc/uci-defaults/99-custom-defaults

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v5
        with:
          name: immortalwrt-x86-64
          path: openwrt/bin/targets/x86/64/*
