name: OpenWrt 25.12.6 x86_64_15.1_port-speed_FIX4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_BRANCH: v25.12.6
  SONIC_FULLCONE_SCRIPT: https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh

jobs:
  build:
    name: Build OpenWrt 25.12.6 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout OpenWrt 25.12.6
        uses: actions/checkout@v7
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          fetch-depth: 1
          path: openwrt

      - name: Install Ubuntu 24.04 build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            python3-yaml \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            xsltproc \
            libelf-dev \
            ecj \
            fastjar \
            device-tree-compiler
          python3 --version
          git --version
          gcc --version

      - name: Configure and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global fetch.parallel 1

          feeds=(packages luci routing telephony video)
          for feed in "${feeds[@]}"; do
            echo "===== Updating feed: ${feed} ====="
            success=0
            for attempt in 1 2 3 4 5; do
              echo "Feed ${feed}: attempt ${attempt}/5"
              if ./scripts/feeds update "${feed}"; then
                success=1
                break
              fi
              echo "Feed ${feed} update failed; cleaning incomplete checkout before retry..."
              rm -rf "feeds/${feed}"
              sleep $((attempt * 10))
            done
            if [ "${success}" -ne 1 ]; then
              echo "ERROR: failed to update feed '${feed}' after 5 attempts"
              exit 1
            fi
          done

          ./scripts/feeds install -a

      - name: Apply SONiC Fullcone patches
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-all-errors "${SONIC_FULLCONE_SCRIPT}" -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh
          rm -f /tmp/add_sonic_fullcone.sh

      - name: Add ImmortalWrt-style CPU status to LuCI Overview
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          STATUS_JS="feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js"
          STATUS_ACL="feeds/luci/modules/luci-mod-status/root/usr/share/rpcd/acl.d/luci-mod-status-index.json"

          test -f "${STATUS_JS}"
          test -f "${STATUS_ACL}"

          cat > "${STATUS_JS}" <<'EOF'
          'use strict';

          'require baseclass';
          'require fs';
          'require poll';
          'require rpc';
          'require uci';

          var callLuciVersion = rpc.declare({
              object: 'luci',
              method: 'getVersion'
          });

          var callSystemBoard = rpc.declare({
              object: 'system',
              method: 'board'
          });

          var callSystemInfo = rpc.declare({
              object: 'system',
              method: 'info'
          });

          function parseCPUStat(text) {
              if (typeof text != 'string')
                  return null;

              var line = text.split('\n').find(function(line) {
                  return line.indexOf('cpu ') == 0;
              });

              if (!line)
                  return null;

              var values = line.trim().split(/\s+/).slice(1).map(Number);

              if (values.length < 4 || values.some(isNaN))
                  return null;

              var idle = values[3] + (values[4] || 0);
              var total = values.reduce(function(sum, value) {
                  return sum + value;
              }, 0);

              return { idle: idle, total: total };
          }

          function getCPUUsage() {
              return L.resolveDefault(fs.read('/proc/stat'), '').then(function(first) {
                  return new Promise(function(resolve) {
                      setTimeout(resolve, 250);
                  }).then(function() {
                      return L.resolveDefault(fs.read('/proc/stat'), '');
                  }).then(function(second) {
                      var a = parseCPUStat(first);
                      var b = parseCPUStat(second);

                      if (!a || !b)
                          return null;

                      var total = b.total - a.total;
                      var idle = b.idle - a.idle;

                      if (total <= 0)
                          return null;

                      return Math.max(0, Math.min(100,
                          Math.round((1 - idle / total) * 100)));
                  });
              });
          }

          function getCPUPackageTemp() {
              return L.resolveDefault(fs.list('/sys/class/thermal'), []).then(function(entries) {
                  var zones = entries.filter(function(entry) {
                      return entry && /^thermal_zone[0-9]+$/.test(entry.name);
                  });

                  return Promise.all(zones.map(function(zone) {
                      var base = '/sys/class/thermal/' + zone.name;

                      return L.resolveDefault(fs.read(base + '/type'), '').then(function(type) {
                          if (type.trim() != 'x86_pkg_temp')
                              return null;

                          return L.resolveDefault(fs.read(base + '/temp'), '').then(function(temp) {
                              var value = parseInt(String(temp).trim(), 10);

                              if (!isFinite(value))
                                  return null;

                              return (value / 1000).toFixed(1).replace(/\.0$/, '') + '°C';
                          });
                      });
                  })).then(function(values) {
                      return values.find(function(value) {
                          return value !== null;
                      }) || null;
                  });
              });
          }

          function getMetrics() {
              return Promise.all([
                  L.resolveDefault(getCPUUsage(), null),
                  L.resolveDefault(getCPUPackageTemp(), null)
              ]).then(function(values) {
                  return {
                      cpu: values[0],
                      temp: values[1]
                  };
              });
          }

          return baseclass.extend({
              title: _('System'),

              load: function() {
                  return Promise.all([
                      L.resolveDefault(callSystemBoard(), {}),
                      L.resolveDefault(callSystemInfo(), {}),
                      L.resolveDefault(callLuciVersion(), {
                          revision: _('unknown version'),
                          branch: 'LuCI'
                      }),
                      uci.load('system'),
                      L.resolveDefault(getMetrics(), { cpu: null, temp: null })
                  ]);
              },

              render: function(data) {
                  var boardinfo = data[0],
                      systeminfo = data[1],
                      luciversion = data[2],
                      metrics = data[4];

                  luciversion = luciversion.branch + ' ' + luciversion.revision;

                  var datestr = null;
                  var unixtime = Math.floor(Date.now() / 1000);

                  if (unixtime) {
                      var date = new Date(unixtime * 1000),
                          zn = uci.get('system', '@system[0]', 'zonename')?.replaceAll(' ', '_') || 'UTC',
                          ts = uci.get('system', '@system[0]', 'clock_timestyle') || 0,
                          hc = uci.get('system', '@system[0]', 'clock_hourcycle') || 0;

                      datestr = new Intl.DateTimeFormat(undefined, {
                          dateStyle: 'medium',
                          timeStyle: (ts == 0) ? 'long' : 'full',
                          hourCycle: (hc == 0) ? undefined : hc,
                          timeZone: zn
                      }).format(date);
                  }

                  var fields = [
                      _('Hostname'), boardinfo.hostname,
                      _('Model'), boardinfo.model,
                      _('Architecture'), boardinfo.system,
                      _('Target Platform'), (L.isObject(boardinfo.release) ? boardinfo.release.target : ''),
                      _('Firmware Version'), (L.isObject(boardinfo.release) ? boardinfo.release.description + ' / ' : '') + (luciversion || ''),
                      _('Kernel Version'), boardinfo.kernel,
                      _('Local Time'), datestr,
                      _('Uptime'), systeminfo.uptime ? '%t'.format(systeminfo.uptime) : null,
                      _('Load Average'), Array.isArray(systeminfo.load) ? '%.2f, %.2f, %.2f'.format(
                          systeminfo.load[0] / 65535.0,
                          systeminfo.load[1] / 65535.0,
                          systeminfo.load[2] / 65535.0
                      ) : null,
                      'CPU 使用率', metrics.cpu != null ? metrics.cpu + '%' : '?',
                      'CPU 温度', metrics.temp != null ? metrics.temp : '?'
                  ];

                  var table = E('table', { 'class': 'table' });
                  var cpuCell, tempCell;

                  for (var i = 0; i < fields.length; i += 2) {
                      var value = (fields[i + 1] != null) ? fields[i + 1] : '?';

                      var cell = E('td', {
                          'class': 'td left'
                      }, [ value ]);

                      var row = E('tr', { 'class': 'tr' }, [
                          E('td', {
                              'class': 'td left',
                              'width': '33%'
                          }, [ fields[i] ]),
                          cell
                      ]);

                      table.appendChild(row);

                      if (fields[i] == 'CPU 使用率')
                          cpuCell = cell;
                      else if (fields[i] == 'CPU 温度')
                          tempCell = cell;
                  }

                  poll.add(function() {
                      return getMetrics().then(function(next) {
                          if (next.cpu != null && cpuCell)
                              cpuCell.textContent = next.cpu + '%';

                          if (next.temp != null && tempCell)
                              tempCell.textContent = next.temp;
                      });
                  }, 3);

                  return table;
              }
          });
          EOF

          python3 - "${STATUS_ACL}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))

          group = data.setdefault("luci-mod-status-index", {})
          read = group.setdefault("read", {})
          files = read.setdefault("file", {})

          files["/proc/stat"] = ["read"]
          files["/sys/class/thermal"] = ["list"]
          files["/sys/class/thermal/thermal_zone*"] = ["list"]
          files["/sys/class/thermal/thermal_zone*/type"] = ["read"]
          files["/sys/class/thermal/thermal_zone*/temp"] = ["read"]

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          node --check "${STATUS_JS}"
          python3 -m json.tool "${STATUS_ACL}" >/dev/null

          grep -n -E "getCPUUsage|getCPUPackageTemp|x86_pkg_temp|CPU 使用率|CPU 温度" "${STATUS_JS}"
          grep -n -E "/proc/stat|thermal_zone.*/type|thermal_zone.*/temp" "${STATUS_ACL}"

      - name: Add LuCI Ethernet port speed settings
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          PORT_SPEED_VIEW="feeds/luci/modules/luci-mod-network/htdocs/luci-static/resources/view/network/port_speed.js"
          PORT_SPEED_MENU="feeds/luci/modules/luci-mod-network/root/usr/share/luci/menu.d/luci-app-port-speed.json"
          PORT_SPEED_ACL="feeds/luci/modules/luci-mod-network/root/usr/share/rpcd/acl.d/luci-app-port-speed.json"
          PORT_SPEED_SCRIPT="package/base-files/files/usr/libexec/luci-app-port-speed"
          PORT_SPEED_APPLY="package/base-files/files/usr/libexec/luci-app-port-speed-apply"
          PORT_SPEED_INIT="package/base-files/files/etc/init.d/port_speed"

          mkdir -p "$(dirname "${PORT_SPEED_VIEW}")" \
                   "$(dirname "${PORT_SPEED_MENU}")" \
                   "$(dirname "${PORT_SPEED_ACL}")" \
                   "$(dirname "${PORT_SPEED_SCRIPT}")" \
                   "$(dirname "${PORT_SPEED_INIT}")"

          cat > "${PORT_SPEED_SCRIPT}" <<'EOF'
          #!/bin/sh
          # Report real device-backed Ethernet interfaces and their ethtool capabilities.
          set -eu

          get_cfg() { uci -q get "port_speed.$1.$2" 2>/dev/null || true; }
          json_escape() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }

          is_physical_ethernet() {
              iface="$1"
              [ -d "/sys/class/net/$iface" ] || return 1
              [ "$iface" != lo ] || return 1
              [ "$(cat "/sys/class/net/$iface/type" 2>/dev/null || true)" = 1 ] || return 1
              # Require a device-backed netdev; this excludes bridges, VLANs, PPP, loopback,
              # Docker/veth/tun/macvlan and similar software-only interfaces.
              [ -e "/sys/class/net/$iface/device" ] || return 1
              [ -r "/sys/class/net/$iface/operstate" ] || return 1
              driver_path=$(readlink -f "/sys/class/net/$iface/device/driver" 2>/dev/null || true)
              [ -n "$driver_path" ] || return 1
              driver=${driver_path##*/}
              case "$driver" in
                  ''|bridge|bonding|dummy|ifb|macvlan|macvtap|veth|tun|tap|wireguard|virtio_net|vmxnet3|hv_netvsc|xen_netfront) return 1 ;;
              esac
              return 0
          }

          printf '{"interfaces":['
          first=1
          for path in /sys/class/net/*; do
              [ -e "$path" ] || continue
              iface=$(basename "$path")
              is_physical_ethernet "$iface" || continue
              ethtool_out=$(ethtool "$iface" 2>/dev/null || true)
              printf '%s\n' "$ethtool_out" | grep -q 'Supported link modes:' || continue
              modes=$(printf '%s\n' "$ethtool_out" | awk '/^[[:space:]]*Supported link modes:/ { in_modes=1; sub(/^[^:]*:[[:space:]]*/, ""); if (length($0)) print; next } in_modes && /^[[:space:]]+[0-9]+base/ { print; next } in_modes { in_modes=0 }' | grep -oE '(^|[[:space:]])(10|100|1000|2500|5000|10000)base[A-Za-z0-9]+/(Half|Full)' | sed 's/^[[:space:]]*//' | sort -u || true)
              [ -n "$modes" ] || continue

              speeds=''
              half_speeds=''
              full_speeds=''
              for mode in $modes; do
                  case "$mode" in
                      10base*/Half|10base*/Full) n=10 ;;
                      100base*/Half|100base*/Full) n=100 ;;
                      1000base*/Half|1000base*/Full) n=1000 ;;
                      2500base*/Half|2500base*/Full) n=2500 ;;
                      5000base*/Half|5000base*/Full) n=5000 ;;
                      10000base*/Half|10000base*/Full) n=10000 ;;
                      *) continue ;;
                  esac
                  case ",$speeds," in *",$n,"*) ;; *) speeds="${speeds:+$speeds,}$n" ;; esac
                  case "$mode" in */Half) case ",$half_speeds," in *",$n,"*) ;; *) half_speeds="${half_speeds:+$half_speeds,}$n" ;; esac ;; esac
                  case "$mode" in */Full) case ",$full_speeds," in *",$n,"*) ;; *) full_speeds="${full_speeds:+$full_speeds,}$n" ;; esac ;; esac
              done
              [ -n "$speeds" ] || continue

              speed=$(printf '%s\n' "$ethtool_out" | sed -n 's/^[[:space:]]*Speed:[[:space:]]*//p' | head -n1)
              duplex=$(printf '%s\n' "$ethtool_out" | sed -n 's/^[[:space:]]*Duplex:[[:space:]]*//p' | head -n1)
              autoneg=$(printf '%s\n' "$ethtool_out" | sed -n 's/^[[:space:]]*Auto-negotiation:[[:space:]]*//p' | head -n1)
              link=$(printf '%s\n' "$ethtool_out" | sed -n 's/^[[:space:]]*Link detected:[[:space:]]*//p' | head -n1)
              driver=$(basename "$(readlink -f "/sys/class/net/$iface/device/driver" 2>/dev/null || true)")
              [ -n "$speed" ] || speed="Unknown"
              [ -n "$duplex" ] || duplex="Unknown"
              [ -n "$autoneg" ] || autoneg="Unknown"
              [ -n "$link" ] || link="Unknown"

              cfg_speed=$(get_cfg "$iface" speed); cfg_duplex=$(get_cfg "$iface" duplex)
              cfg_autoneg=$(get_cfg "$iface" autoneg); cfg_enabled=$(get_cfg "$iface" enabled)
              [ -n "$cfg_speed" ] || cfg_speed=auto
              [ -n "$cfg_duplex" ] || cfg_duplex=full
              [ -n "$cfg_autoneg" ] || cfg_autoneg=on
              [ -n "$cfg_enabled" ] || cfg_enabled=0

              [ "$first" -eq 1 ] || printf ','
              first=0
              printf '{"name":"%s","driver":"%s","speed":"%s","duplex":"%s","autoneg":"%s","link":"%s","speeds":"%s","half_speeds":"%s","full_speeds":"%s","cfg_speed":"%s","cfg_duplex":"%s","cfg_autoneg":"%s","enabled":"%s"}' \
                  "$(json_escape "$iface")" "$(json_escape "$driver")" "$(json_escape "$speed")" \
                  "$(json_escape "$duplex")" "$(json_escape "$autoneg")" "$(json_escape "$link")" \
                  "$(json_escape "$speeds")" "$(json_escape "$half_speeds")" "$(json_escape "$full_speeds")" \
                  "$(json_escape "$cfg_speed")" "$(json_escape "$cfg_duplex")" "$(json_escape "$cfg_autoneg")" "$(json_escape "$cfg_enabled")"
          done
          printf ']}\n'
          EOF
          chmod 0755 "${PORT_SPEED_SCRIPT}"

          cat > "${PORT_SPEED_APPLY}" <<'EOF'
          #!/bin/sh
          # Apply and persist link settings only for supported device-backed Ethernet interfaces.
          set -eu

          is_physical_ethernet() {
              iface="$1"
              case "$iface" in ''|*[!A-Za-z0-9_.:-]*) return 1 ;; esac
              [ -d "/sys/class/net/$iface" ] || return 1
              [ "$iface" != lo ] || return 1
              [ -e "/sys/class/net/$iface/device" ] || return 1
              driver_path=$(readlink -f "/sys/class/net/$iface/device/driver" 2>/dev/null || true)
              [ -n "$driver_path" ] || return 1
              driver=${driver_path##*/}
              case "$driver" in
                  ''|bridge|bonding|dummy|ifb|macvlan|macvtap|veth|tun|tap|wireguard|virtio_net|vmxnet3|hv_netvsc|xen_netfront) return 1 ;;
              esac
              return 0
          }
          get_cfg() { uci -q get "port_speed.$1.$2" 2>/dev/null || true; }
          get_modes() {
              ethtool "$1" 2>/dev/null | awk '/^[[:space:]]*Supported link modes:/ { in_modes=1; sub(/^[^:]*:[[:space:]]*/, ""); if (length($0)) print; next } in_modes && /^[[:space:]]+[0-9]+base/ { print; next } in_modes { in_modes=0 }' | grep -oE '(^|[[:space:]])(10|100|1000|2500|5000|10000)base[A-Za-z0-9]+/(Half|Full)' | sed 's/^[[:space:]]*//' | sort -u
          }
          valid_speed() { case "$1" in auto|10|100|1000|2500|5000|10000) return 0;; esac; return 1; }
          valid_duplex() { case "$1" in full|half) return 0;; esac; return 1; }
          valid_autoneg() { case "$1" in on|off) return 0;; esac; return 1; }

          apply_one() {
              iface="$1"; speed="$2"; duplex="$3"; autoneg="$4"; mode="$5"
              is_physical_ethernet "$iface" || { echo "拒绝操作：$iface 不是受支持的物理以太网接口" >&2; return 2; }
              valid_speed "$speed" || { echo "不支持的速率值：$speed" >&2; return 2; }
              valid_duplex "$duplex" || { echo "双工模式必须为 full 或 half" >&2; return 2; }
              valid_autoneg "$autoneg" || { echo "自动协商值必须为 on 或 off" >&2; return 2; }
              modes=$(get_modes "$iface")
              [ -n "$modes" ] || { echo "$iface 无法读取驱动支持的链路模式" >&2; return 2; }

              if [ "$speed" != auto ]; then
                  if [ "$duplex" = half ]; then
                      printf '%s\n' "$modes" | grep -Eq "(^|[[:space:]])${speed}base[^[:space:]]*/Half$" || { echo "$iface 不支持 ${speed} Mbps 半双工" >&2; return 2; }
                  else
                      printf '%s\n' "$modes" | grep -Eq "(^|[[:space:]])${speed}base[^[:space:]]*/Full$" || { echo "$iface 不支持 ${speed} Mbps 全双工" >&2; return 2; }
                  fi
              fi

              if [ "$autoneg" = on ]; then
                  if [ "$speed" = auto ]; then
                      ethtool -s "$iface" autoneg on || { echo "$iface 启用自动协商失败" >&2; return 1; }
                  else
                      ethtool -s "$iface" speed "$speed" duplex "$duplex" autoneg on || { echo "$iface 无法将自动协商限制到 ${speed} Mbps/$duplex" >&2; return 1; }
                  fi
              else
                  [ "$speed" != auto ] || { echo "关闭自动协商时必须选择固定速率" >&2; return 2; }
                  ethtool -s "$iface" speed "$speed" duplex "$duplex" autoneg off || { echo "$iface 固定速率设置失败；驱动或 PHY 可能不支持此模式" >&2; return 1; }
              fi

              # Query again after applying. This verifies the driver still answers and reports state.
              verify=$(ethtool "$iface" 2>/dev/null) || { echo "$iface 设置后无法读取状态" >&2; return 1; }
              actual_speed=$(printf '%s\n' "$verify" | sed -n 's/^[[:space:]]*Speed:[[:space:]]*//p' | head -n1)
              actual_duplex=$(printf '%s\n' "$verify" | sed -n 's/^[[:space:]]*Duplex:[[:space:]]*//p' | head -n1)
              actual_autoneg=$(printf '%s\n' "$verify" | sed -n 's/^[[:space:]]*Auto-negotiation:[[:space:]]*//p' | head -n1)
              [ -n "$actual_speed" ] || actual_speed=Unknown
              [ -n "$actual_duplex" ] || actual_duplex=Unknown
              [ -n "$actual_autoneg" ] || actual_autoneg=Unknown

              # With forced mode, reject a driver that reports a conflicting applied state.
              if [ "$autoneg" = off ]; then
                  actual_speed_num=$(printf '%s' "$actual_speed" | sed 's/[^0-9]//g')
                  if [ -n "$actual_speed_num" ] && [ "$actual_speed_num" != "$speed" ]; then
                      echo "$iface 固定速率校验失败：请求 ${speed} Mbps，驱动报告 ${actual_speed}" >&2
                      return 1
                  fi
                  if [ "$actual_duplex" != Unknown ] && [ "$(printf '%s' "$actual_duplex" | tr '[:upper:]' '[:lower:]')" != "$duplex" ]; then
                      echo "$iface 双工模式校验失败：请求 $duplex，驱动报告 $actual_duplex" >&2
                      return 1
                  fi
                  if [ "$actual_autoneg" != Unknown ] && [ "$(printf '%s' "$actual_autoneg" | tr '[:upper:]' '[:lower:]')" != off ]; then
                      echo "$iface 自动协商校验失败：请求关闭，驱动报告 $actual_autoneg" >&2
                      return 1
                  fi
              fi

              case "$mode" in
                  persist)
                      uci -q set "port_speed.${iface}=interface"
                      uci set "port_speed.${iface}.enabled=1"
                      uci set "port_speed.${iface}.speed=$speed"
                      uci set "port_speed.${iface}.duplex=$duplex"
                      uci set "port_speed.${iface}.autoneg=$autoneg"
                      uci commit port_speed
                      ;;
                  nopersist)
                      uci -q delete "port_speed.${iface}" 2>/dev/null || true
                      uci commit port_speed
                      ;;
                  boot) : ;; # Reapply saved settings without modifying/deleting UCI configuration.
                  *) echo "Invalid operation mode: $mode" >&2; return 2 ;;
              esac
              printf '%s: 设置命令成功；当前报告状态 Speed=%s, Duplex=%s, Auto-negotiation=%s\n' "$iface" "$actual_speed" "$actual_duplex" "$actual_autoneg"
          }

          case "${1:-}" in
              apply)
                  [ "$#" -eq 6 ] || { echo 'Usage: apply <iface> <speed> <duplex> <autoneg> <persist|nopersist>' >&2; exit 2; }
                  apply_one "$2" "$3" "$4" "$5" "$6"
                  ;;
              boot)
                  if [ -f /etc/config/port_speed ]; then
                      uci -q show port_speed 2>/dev/null | sed -n 's/^port_speed\.\([^.=]*\)=interface$/\1/p' | while read -r iface; do
                          [ "$(get_cfg "$iface" enabled)" = 1 ] || continue
                          speed=$(get_cfg "$iface" speed); duplex=$(get_cfg "$iface" duplex); autoneg=$(get_cfg "$iface" autoneg)
                          [ -n "$speed" ] || speed=auto; [ -n "$duplex" ] || duplex=full; [ -n "$autoneg" ] || autoneg=on
                          apply_one "$iface" "$speed" "$duplex" "$autoneg" boot || true
                      done
                  fi
                  ;;
              *) echo 'Usage: apply|boot' >&2; exit 2 ;;
          esac
          EOF
          chmod 0755 "${PORT_SPEED_APPLY}"

          cat > "${PORT_SPEED_INIT}" <<'EOF'
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=0
          start() {
              /usr/libexec/luci-app-port-speed-apply boot >/dev/null 2>&1 || true
          }
          EOF
          chmod 0755 "${PORT_SPEED_INIT}"

          cat > "${PORT_SPEED_VIEW}" <<'EOF'
          'use strict';
          'require view';
          'require fs';
          'require ui';

          function execStatus(args) { return fs.exec('/usr/libexec/luci-app-port-speed', args); }
          function execApply(args) { return fs.exec('/usr/libexec/luci-app-port-speed-apply', args); }
          function select(value, choices) {
              var s = E('select', { 'class': 'cbi-input-select', 'style': 'min-width: 150px;' });
              choices.forEach(function(item) {
                  var o = E('option', { value: item[0] }, [ item[1] ]);
                  if (item[0] === value) o.selected = true;
                  s.appendChild(o);
              });
              return s;
          }
          function choicesFor(iface) {
              var out = [[ 'auto', _('自动协商/全部支持速率') ]];
              (iface.speeds || '').split(',').filter(Boolean).forEach(function(speed) {
                  out.push([ speed, speed + ' Mbps' + (speed === '1000' ? ' (1 Gbps)' : speed === '2500' ? ' (2.5 Gbps)' : speed === '5000' ? ' (5 Gbps)' : speed === '10000' ? ' (10 Gbps)' : '') ]);
              });
              return out;
          }

          return view.extend({
              _rows: [],
              load: function() {
                  return execStatus([]).then(function(res) {
                      if (res.code) throw new Error(res.stderr || _('读取物理网卡状态失败'));
                      return JSON.parse(res.stdout);
                  });
              },
              _saveRows: function() {
                  var rows = this._rows || [];
                  return Promise.all(rows.map(function(row) {
                      var persist = row.saveBox.checked ? 'persist' : 'nopersist';
                      return execApply([ 'apply', row.iface.name, row.speedSel.value, row.duplexSel.value,
                          row.autoBox.checked ? 'on' : 'off', persist ]).then(function(res) {
                          if (res.code) throw new Error(row.iface.name + ': ' + (res.stderr || _('设置失败')));
                      });
                  }));
              },
              handleSave: function() {
                  return this._saveRows().then(function() {
                      ui.addNotification(null, E('p', {}, [ _('所有网口设置均已应用；已勾选“开机恢复”的配置已持久化。') ]), 'info');
                  }).catch(function(err) {
                      ui.addNotification(null, E('p', {}, [ String(err) ]), 'error');
                      throw err;
                  });
              },
              handleSaveApply: function() { return this.handleSave(); },
              handleReset: function() { location.reload(); },
              render: function(data) {
                  var self = this;
                  this._rows = [];
                  var rows = (data.interfaces || []).map(function(iface) {
                      var speedSel = select(iface.cfg_speed || 'auto', choicesFor(iface));
                      var duplexChoices = [];
                      if ((iface.full_speeds || '').length) duplexChoices.push([ 'full', _('全双工') ]);
                      if ((iface.half_speeds || '').length) duplexChoices.push([ 'half', _('半双工') ]);
                      if (!duplexChoices.length) duplexChoices.push([ 'full', _('全双工') ]);
                      var cfgDuplex = iface.cfg_duplex || 'full';
                      if (!duplexChoices.some(function(x) { return x[0] === cfgDuplex; })) cfgDuplex = duplexChoices[0][0];
                      var duplexSel = select(cfgDuplex, duplexChoices);
                      var autoBox = E('input', { type: 'checkbox' }); autoBox.checked = (iface.cfg_autoneg || 'on') === 'on';
                      var saveBox = E('input', { type: 'checkbox' }); saveBox.checked = iface.enabled === '1';
                      var statusText = iface.link === 'yes' ? _('已连接') : (iface.link === 'no' ? _('未连接') : _('未知'));
                      var apply = E('button', { 'class': 'cbi-button cbi-button-action' }, [ _('应用并验证') ]);
                      var row = { iface: iface, speedSel: speedSel, duplexSel: duplexSel, autoBox: autoBox, saveBox: saveBox };
                      self._rows.push(row);
                      function applyRow() {
                          apply.disabled = true;
                          var persist = saveBox.checked ? 'persist' : 'nopersist';
                          execApply([ 'apply', iface.name, speedSel.value, duplexSel.value, autoBox.checked ? 'on' : 'off', persist ])
                              .then(function(res) {
                                  if (res.code) ui.addNotification(null, E('p', {}, [ res.stderr || _('设置失败') ]), 'error');
                                  else ui.addNotification(null, E('p', {}, [ res.stdout || (iface.name + ': ' + _('已应用')) ]), 'info');
                              })
                              .catch(function(err) { ui.addNotification(null, E('p', {}, [ String(err) ]), 'error'); })
                              .finally(function() { apply.disabled = false; });
                      }
                      apply.addEventListener('click', applyRow);
                      return E('tr', { 'class': 'tr' }, [
                          E('td', { 'class': 'td' }, [ E('strong', {}, [ iface.name ]), E('div', { 'class': 'cbi-value-description' }, [ iface.driver || _('未知驱动') ]), E('div', { 'class': 'cbi-value-description' }, [ statusText + ' · ' + iface.speed + ' / ' + iface.duplex ]) ]),
                          E('td', { 'class': 'td' }, [ speedSel ]),
                          E('td', { 'class': 'td' }, [ duplexSel ]),
                          E('td', { 'class': 'td' }, [ autoBox, ' ', _('自动协商') ]),
                          E('td', { 'class': 'td' }, [ saveBox, ' ', _('开机恢复') ]),
                          E('td', { 'class': 'td' }, [ apply ])
                      ]);
                  });
                  if (!rows.length) {
                      rows.push(E('tr', {}, [ E('td', { colspan: 6 }, [ _('未发现可读取支持链路模式的物理以太网接口。虚拟网卡、网桥、VLAN 和不报告链路能力的驱动不会显示。') ]) ]));
                  }
                  return E('div', {}, [
                      E('h2', {}, [ _('网口速率设置') ]),
                      E('p', { 'class': 'cbi-section-descr' }, [ _('仅显示有设备节点且驱动报告支持链路模式的以太网接口。速率选项来自网卡驱动能力；“应用并验证”会执行 ethtool 并重新读取状态。') ]),
                      E('div', { 'class': 'cbi-map' }, [
                          E('div', { 'class': 'cbi-section' }, [ E('table', { 'class': 'table' }, [
                              E('tr', { 'class': 'tr cbi-section-table-titles' }, [ E('th', { 'class': 'th' }, [ _('物理网口/驱动/状态') ]), E('th', { 'class': 'th' }, [ _('速率') ]), E('th', { 'class': 'th' }, [ _('双工模式') ]), E('th', { 'class': 'th' }, [ _('协商') ]), E('th', { 'class': 'th' }, [ _('开机恢复') ]), E('th', { 'class': 'th' }, [ _('操作') ]) ])
                          ].concat(rows)) ]),
                          E('div', { 'class': 'cbi-section' }, [ E('div', { 'class': 'alert-message warning' }, [ _('注意：强制固定速率可能导致链路断开；请确保网卡、对端设备和交换机端口支持所选模式。自动协商开启时，选择具体速率会尝试限制协商速率；最终协商结果还取决于对端设备。') ]) ])
                      ])
                  ]);
              }
          });
          EOF

          cat > "${PORT_SPEED_MENU}" <<'EOF'
          {
              "admin/network/port_speed": {
                  "title": "网口速率",
                  "order": 95,
                  "action": { "type": "view", "path": "network/port_speed" }
              }
          }
          EOF

          cat > "${PORT_SPEED_ACL}" <<'EOF'
          {
              "luci-app-port-speed": {
                  "description": "Grant access to Ethernet port speed settings",
                  "read": { "file": { "/usr/libexec/luci-app-port-speed": [ "exec" ] } },
                  "write": { "file": { "/usr/libexec/luci-app-port-speed-apply": [ "exec" ] } }
              }
          }
          EOF

          node --check "${PORT_SPEED_VIEW}"
          python3 -m json.tool "${PORT_SPEED_MENU}" >/dev/null
          python3 -m json.tool "${PORT_SPEED_ACL}" >/dev/null
          test -x "${PORT_SPEED_SCRIPT}"
          test -x "${PORT_SPEED_APPLY}"
          test -x "${PORT_SPEED_INIT}"

      - name: Configure first-boot defaults
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-defaults <<'EOF'
          #!/bin/sh

          # LAN: 192.168.15.1/24
          # DHCP server enabled on LAN by default.
          uci -q set network.lan.ipaddr='192.168.15.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q set dhcp.lan.ignore='0'

          # Default LuCI language and Bootstrap theme
          uci -q set luci.main.lang='zh_cn'
          uci -q set luci.main.mediaurlbase='/luci-static/bootstrap'
          uci -q set luci.themes.Bootstrap='/luci-static/bootstrap'

          # Enable persistent Ethernet port-speed restoration at boot.
          [ -x /etc/init.d/port_speed ] && /etc/init.d/port_speed enable

          uci -q commit network
          uci -q commit dhcp
          uci -q commit luci
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-custom-defaults

      - name: Generate OpenWrt configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_LUCI_LANG_zh_Hans=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y


          # Common physical Ethernet drivers
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-ixgbevf=y
          CONFIG_PACKAGE_kmod-i40e=y
          CONFIG_PACKAGE_kmod-iavf=y
          CONFIG_PACKAGE_kmod-ice=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-bnx2=y
          CONFIG_PACKAGE_kmod-bnx2x=y
          CONFIG_PACKAGE_kmod-sky2=y
          CONFIG_PACKAGE_kmod-mlx4-core=y
          CONFIG_PACKAGE_kmod-mlx5-core=y
          CONFIG_PACKAGE_kmod-amazon-ena=y
          CONFIG_PACKAGE_kmod-amd-xgbe=y
          CONFIG_PACKAGE_kmod-forcedeth=y
          CONFIG_PACKAGE_kmod-atlantic=y

          # KVM/QEMU/PVE guest drivers (VirtIO)
          CONFIG_PACKAGE_kmod-virtio=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-virtio-balloon=y
          CONFIG_PACKAGE_kmod-virtio-rng=y

          # VMware and Hyper-V guest drivers
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-hv-vmbus=y
          CONFIG_PACKAGE_kmod-hv-netvsc=y
          CONFIG_PACKAGE_kmod-hv-utils=y

          CONFIG_PACKAGE_intel-microcode=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_ethtool=y
          EOF

          make defconfig
          echo '===== Root filesystem partition size ====='
          grep '^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=1024$' .config

      - name: Verify selected packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          echo '===== Target and partition size ====='
          grep -E '^CONFIG_TARGET_x86|^CONFIG_TARGET_ROOTFS_PARTSIZE=' .config || true
          grep -q '^CONFIG_TARGET_ROOTFS_PARTSIZE=1024$' .config

          echo '===== LuCI language and theme ====='
          grep -E '^CONFIG_(LUCI_LANG_zh_Hans|PACKAGE_luci-theme-bootstrap|PACKAGE_luci-i18n-)' .config || true

          echo '===== Applications ====='
          grep -E '^CONFIG_PACKAGE_(luci-app-ttyd|miniupnpd-nftables|luci-app-upnp|ddns-scripts|luci-app-ddns|ddns-scripts-cloudflare|ddns-scripts-dnspod|curl|ca-certificates|luci-app-uhttpd|luci-app-statistics|collectd-mod-thermal|kmod-thermal|kmod-hwmon-core)' .config || true

          echo '===== VirtIO / VM ====='
          grep -E '^CONFIG_PACKAGE_(kmod-virtio|kmod-vmxnet3|kmod-hv-)' .config || true

          echo '===== Ethernet drivers ====='
          grep -E '^CONFIG_PACKAGE_kmod-(e1000|e1000e|igb|igc|ixgbe|ixgbevf|i40e|iavf|ice|r8169|tg3|bnx2|bnx2x|sky2|mlx4-core|mlx5-core|amazon-ena|amd-xgbe|forcedeth|atlantic)' .config || true

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          make download -j"$(nproc)" V=s

      - name: Compile OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          make -j"$(nproc)" V=s

      - name: Generate build information
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-info
          {
            echo "OpenWrt branch: ${OPENWRT_BRANCH}"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "OpenWrt commit: $(git rev-parse HEAD)"
            echo 'CPU status: native LuCI Overview integration (ImmortalWrt-style), refreshed every 3 seconds'
            echo 'Root filesystem partition size: 1024 MiB'
            echo 'LAN: 192.168.15.1/24'
            echo 'LAN DHCP server: enabled'
            echo 'LuCI theme: Bootstrap'
            echo 'LuCI language: zh_cn'
          } > build-info/build-info.txt

      - name: List firmware outputs
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          find bin/targets/x86/64 -maxdepth 2 -type f -print | sort
          du -h bin/targets/x86/64/* 2>/dev/null || true

      - name: Prepare artifact
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ../artifact
          mkdir -p ../artifact/build-info
          cp -a bin/targets/x86/64/. ../artifact/
          cp build-info/build-info.txt ../artifact/build-info/
          find ../artifact -maxdepth 3 -type f -print | sort

      - name: Upload OpenWrt firmware
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt 25.12.6 x86_64_15.1_port-speed_FIX4
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
