name: Doubao_OpenWrt-25.12-x86-64_15.1

# 仅手动触发
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget python3-ply swig

      - name: Clone OpenWrt openwrt-25.12 & update feeds
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Third-party packages
        run: |
          cd openwrt
          # cpu-status-mini（纯前端，无中文包、无可配采样间隔，见文末备注1）
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini package/luci-app-cpu-status-mini
          # homeproxy（sing-box 编译内置）
          git clone --depth 1 https://github.com/immortalwrt/homeproxy package/luci-app-homeproxy
          # OpenClash sparse checkout 铺平（核心 mihomo 运行时 Web 界面下载，ipk 不含，见备注2）
          mkdir -p package/luci-app-openclash
          cd package/luci-app-openclash
          git init -q
          git remote add -f origin https://github.com/vernesong/OpenClash.git
          git config core.sparsecheckout true
          echo "luci-app-openclash/*" >> .git/info/sparse-checkout
          git pull --depth 1 -q origin master
          mv luci-app-openclash/* . && rmdir luci-app-openclash
          cd ../../..
          # sonic-fullcone 官方脚本（内核/nft/libnftnl/防火墙补丁，无独立 ipk）
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Extract official DDNSTO ipk (latest) into files/
        run: |
          BASE="http://fw.koolcenter.com/binary/ddnsto/openwrt"
          VER=$(curl -fsSLk "$BASE/VERSION" | tr -d '[:space:]')
          echo "DDNSTO version: $VER"
          mkdir -p openwrt/files /tmp/dd
          curl -fsSLk "$BASE/standard/$VER/ddnsto_x86_64.ipk" -o /tmp/dd/d.ipk
          curl -fsSLk "$BASE/luci-app-ddnsto.ipk" -o /tmp/dd/u.ipk
          curl -fsSLk "$BASE/luci-i18n-ddnsto-zh-cn.ipk" -o /tmp/dd/i.ipk
          # ipk 为 gzip 双层 tar：gunzip 取 data.tar.gz 再解
          for f in /tmp/dd/*.ipk; do
            d="/tmp/dd/$(basename "$f" .ipk)"
            mkdir -p "$d"
            gunzip -c "$f" | tar -x -C "$d"
            tar xzf "$d/data.tar.gz" -C openwrt/files/
          done

      - name: Inline presets (Chinese/bootstrap/LAN/DDNSTO defaults)
        run: |
          mkdir -p openwrt/files/etc/config openwrt/files/etc/uci-defaults
          # 默认简体中文 + bootstrap 主题
          cat > openwrt/files/etc/config/luci <<'EOF'
          config main 'core'
          	option lang 'zh_cn'
          	option mediaurlbase '/luci-static/bootstrap'
          EOF
          # DDNSTO 出厂关闭、token 留空（修复缺 conffile 导致开关默认开/token 不落盘）
          cat > openwrt/files/etc/config/ddnsto <<'EOF'
          config ddnsto
          	option enabled '0'
          	# option token ''
          	option index '0'
          	option logger '0'
          	option feat_enabled '0'
          	option feat_port '3033'
          EOF
          # 首次开机：LAN 改为 192.168.15.1/24（仅改地址，不动 bridge/wan）
          cat > openwrt/files/etc/uci-defaults/10-lan-ip <<'EOF'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.15.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q commit network
          exit 0
          EOF
          # DDNSTO 首次开机：注册 ucitrack + 仅 enable 自启链接（enabled 仍为 0，不主动运行）
          cat > openwrt/files/etc/uci-defaults/90-ddnsto <<'EOF'
          #!/bin/sh
          uci -q delete ucitrack.@ddnsto[-1]
          uci -q add ucitrack ddnsto
          uci -q set ucitrack.@ddnsto[-1].init=ddnsto
          uci -q commit ucitrack
          /etc/init.d/ddnsto enable
          exit 0
          EOF
          chmod +x openwrt/files/etc/uci-defaults/*

      - name: Seed .config
        run: |
          cat > openwrt/.config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_GENERIC=y

          # 默认中文 + bootstrap
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-lua-runtime=y

          # 指定基础包
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          # 第三方插件
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_luci-app-openclash=y

          # DDNSTO 运行依赖（二进制由上一步解包进 files/）
          CONFIG_PACKAGE_block-mount=y

          # OpenClash / homeproxy nftables 依赖
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_ca-bundle=y

          # 主流物理网卡驱动
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-ixgbevf=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-atlantic=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-bnx2=y
          CONFIG_PACKAGE_kmod-bnx2x=y
          CONFIG_PACKAGE_kmod-be2net=y

          # KVM guest：virtio 系已内核内置，仅补 9p/vsock
          CONFIG_PACKAGE_kmod-9pnet=y
          CONFIG_PACKAGE_kmod-9pvirtio=y
          CONFIG_PACKAGE_kmod-vsock-virtio=y
          EOF
          sed -i 's/^[[:space:]]*//' openwrt/.config

      - name: Defconfig & download
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Build firmware
        run: cd openwrt && make -j"$(nproc)" V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Doubao_openwrt-25.12-x86-64_15.1
          retention-days: 14
          path: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/*rootfs.tar.gz

# 备注：
# 1. luci-app-cpu-status-mini 为纯前端片段，无后端采集、无 UCI、无中文包，无法设置 1 秒采样间隔（刷新跟随 LuCI 状态页）；
#    如需 1 秒采样+中文，请改用完整版 gSpotx2f/luci-app-cpu-status。
# 2. OpenClash 核心 mihomo 二进制不编译进 ipk，刷机后进 Web 界面手动下载。
# 3. 选 luci-app-openclash 会自动以 dnsmasq-full 替换 dnsmasq，属正常。
# 4. 全部第三方包每次构建拉最新 commit，未锁版本号。
#（注：内容由AI生成）
