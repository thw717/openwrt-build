name: OpenWrt x86_64 Build

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        path: workflow

    - name: Setup Swap Space
      run: |
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "Swap setup complete"

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libncursesw5-dev python3 python3-pip python3-setuptools rsync unzip zlib1g-dev libssl-dev libc6-dev bc libelf-dev libgmp3-dev libmpc-dev libisl-dev time ccache wget curl
        echo "Dependencies installed"

    - name: Checkout OpenWrt
      run: |
        git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        if git fetch origin openwrt-25.12 2>/dev/null && git checkout openwrt-25.12; then
          echo "Using openwrt-25.12 branch"
        else
          git checkout master
          echo "Using master branch (openwrt-25.12 not found)"
        fi
        echo "Checked out: $(git log --oneline -1)"

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: Add External Feeds
      run: |
        cd openwrt
        git clone --depth 1 https://github.com/vernesong/OpenClash.git tmp/OpenClash
        mv tmp/OpenClash/luci-app-openclash package/luci-app-openclash
        rm -rf tmp/OpenClash
        git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/homeproxy
        git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git package/luci-app-cpu-status-mini
        echo "External feeds added"
        ls -la package/

    - name: Integrate sonic-fullcone
      run: |
        cd openwrt
        git clone --depth 1 https://github.com/mufeng05/openwrt-sonic-fullcone.git tmp/sonic-fullcone
        cd tmp/sonic-fullcone
        bash add_sonic_fullcone.sh
        cd ..
        rm -rf tmp/sonic-fullcone
        echo "sonic-fullcone patches applied"

    - name: Create DDNSTO Package (with default-disabled fix)
      run: |
        cd openwrt
        mkdir -p package/ddnsto/files
        echo "Downloading DDNSTO binary..."
        curl -sSL --retry 3 --connect-timeout 30 -o package/ddnsto/files/ddnsto https://fw.koolcenter.com/binary/ddnsto/openwrt/x86_64/ddnsto
        chmod +x package/ddnsto/files/ddnsto
        ls -lh package/ddnsto/files/ddnsto

        cat > package/ddnsto/Makefile << 'MAKEEOF'
        include $(TOPDIR)/rules.mk
        
        PKG_NAME:=ddnsto
        PKG_VERSION:=3.0.0
        PKG_RELEASE:=1
        
        include $(INCLUDE_DIR)/package.mk
        
        define Package/ddnsto
          SECTION:=net
          CATEGORY:=Network
          TITLE:=DDNSTO - Intranet Penetration
          DEPENDS:=+libc
          URL:=https://www.ddnsto.com/
        endef
        
        define Package/ddnsto/description
         DDNSTO is a fast and easy-to-use intranet penetration tool.
        endef
        
        define Package/ddnsto/conffiles
        /etc/config/ddnsto
        endef
        
        define Package/ddnsto/install
        	$(INSTALL_DIR) $(1)/usr/bin
        	$(INSTALL_BIN) ./files/ddnsto $(1)/usr/bin/
        	$(INSTALL_DIR) $(1)/etc/config
        	$(INSTALL_CONF) ./files/ddnsto.config $(1)/etc/config/ddnsto
        	$(INSTALL_DIR) $(1)/etc/init.d
        	$(INSTALL_BIN) ./files/ddnsto.init $(1)/etc/init.d/ddnsto
        	$(INSTALL_DIR) $(1)/etc/ddnsto
        endef
        
        $(eval $(call BuildPackage,ddnsto))
        MAKEEOF

        cat > package/ddnsto/files/ddnsto.config << 'CONFIGEOF'
        config config 'config'
        	option enabled '0'
        	option token ''
        	option device_name 'OpenWrt'
        	option server 'tunnel.ddnsto.com'
        	option log_level 'info'
        CONFIGEOF

        cat > package/ddnsto/files/ddnsto.init << 'INITEOF'
        #!/bin/sh /etc/rc.common
        # DDNSTO init script - defaults to disabled, requires token to start
        # KEY FIX: Service starts ONLY when enabled=1 AND token is set
        
        START=99
        STOP=10
        USE_PROCD=1
        
        start_service() {
            local enabled
            enabled=$(uci get ddnsto.config.enabled 2>/dev/null)
            if [ "$enabled" != "1" ]; then
                echo "DDNSTO: service disabled, skipping start"
                return 1
            fi
        
            local token
            token=$(uci get ddnsto.config.token 2>/dev/null)
            if [ -z "$token" ]; then
                echo "DDNSTO: no token configured, skipping start"
                return 1
            fi
        
            local device_name server log_level
            device_name=$(uci get ddnsto.config.device_name 2>/dev/null || echo "OpenWrt")
            server=$(uci get ddnsto.config.server 2>/dev/null || echo "tunnel.ddnsto.com")
            log_level=$(uci get ddnsto.config.log_level 2>/dev/null || echo "info")
        
            mkdir -p /etc/ddnsto
            cat > /etc/ddnsto/config.json << JSONEOF
        {
          "token": "${token}",
          "device_name": "${device_name}",
          "server": "${server}",
          "log_level": "${log_level}"
        }
        JSONEOF
        
            procd_open_instance
            procd_set_param command /usr/bin/ddnsto
            procd_append_param command -t "$token"
            procd_set_param respawn
            procd_set_param respawn_interval 10
            procd_set_param respawn_limit 10
            procd_set_param stderr 1
            procd_set_param stdout 1
            procd_close_instance
        
            echo "DDNSTO: started"
        }
        
        stop_service() {
            procd_kill ddnsto 2>/dev/null
            killall ddnsto 2>/dev/null
            echo "DDNSTO: stopped"
        }
        
        restart() {
            stop
            start
        }
        
        boot() {
            :
        }
        
        service_triggers() {
            procd_add_reload_trigger ddnsto
        }
        INITEOF

        chmod +x package/ddnsto/files/ddnsto.init
        echo "DDNSTO package created"

    - name: Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Configure Build
      run: |
        cd openwrt
        make defconfig

        # === Target Configuration ===
        sed -i "s/# CONFIG_TARGET_x86 is not set/CONFIG_TARGET_x86=y/" .config
        sed -i "s/# CONFIG_TARGET_x86_64 is not set/CONFIG_TARGET_x86_64=y/" .config
        sed -i "s/# CONFIG_TARGET_x86_64_GENERIC is not set/CONFIG_TARGET_x86_64_GENERIC=y/" .config
        sed -i "s/CONFIG_TARGET_x86_32=y/# CONFIG_TARGET_x86_32 is not set/" .config 2>/dev/null || true

        # === LAN IP Configuration ===
        mkdir -p target/linux/x86/64/files/etc/config
        cat > target/linux/x86/64/files/etc/config/network << 'NETEOF'
        config interface 'lan'
            option type 'bridge'
            option ifname 'eth0'
            option proto 'static'
            option ipaddr '192.168.15.1'
            option netmask '255.255.255.0'
        NETEOF

        # === LuCI Configuration ===
        sed -i "s/# CONFIG_PACKAGE_luci is not set/CONFIG_PACKAGE_luci=y/" .config
        sed -i "s/# CONFIG_PACKAGE_luci-base is not set/CONFIG_PACKAGE_luci-base=y/" .config
        sed -i "s/# CONFIG_PACKAGE_luci-compat is not set/CONFIG_PACKAGE_luci-compat=y/" .config
        sed -i "s/CONFIG_LUCI_THEME=\"[^\"]*\"/CONFIG_LUCI_THEME=\"bootstrap\"/" .config
        sed -i "s/# CONFIG_LUCI_THEME_bootstrap is not set/CONFIG_LUCI_THEME_bootstrap=y/" .config

        # === Chinese Language (25.12 compatibility: zh-cn vs zh_Hans) ===
        sed -i "s/# CONFIG_PACKAGE_luci-i18n-base-zh-cn is not set/CONFIG_PACKAGE_luci-i18n-base-zh-cn=y/" .config 2>/dev/null || true
        sed -i "s/# CONFIG_PACKAGE_luci-i18n-base-zh_Hans is not set/CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y/" .config 2>/dev/null || true
        sed -i "s/# CONFIG_PACKAGE_luci-language-zh-cn is not set/CONFIG_PACKAGE_luci-language-zh-cn=y/" .config 2>/dev/null || true
        sed -i "s/# CONFIG_PACKAGE_luci-language-zh_Hans is not set/CONFIG_PACKAGE_luci-language-zh_Hans=y/" .config 2>/dev/null || true

        # === Enable Core Applications ===
        CORE_PKGS="luci-app-ttyd miniupnpd-nftables luci-app-upnp ddns-scripts luci-app-ddns ddns-scripts-cloudflare ddns-scripts-dnspod curl ca-certificates luci-app-uhttpd luci-app-statistics collectd-mod-thermal kmod-thermal kmod-hwmon-core luci-app-cpu-status-mini luci-app-openclash luci-app-homeproxy ddnsto"
        for pkg in $CORE_PKGS; do
            sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=y/" .config 2>/dev/null || true
        done

        # === Enable LuCI i18n (Chinese Simplified) ===
        I18N_BASES="luci-i18n-base luci-i18n-firewall luci-i18n-upnp luci-i18n-ddns luci-i18n-uhttpd luci-i18n-statistics luci-i18n-homeproxy"
        for base in $I18N_BASES; do
            sed -i "s/# CONFIG_PACKAGE_${base}-zh-cn is not set/CONFIG_PACKAGE_${base}-zh-cn=y/" .config 2>/dev/null || true
            sed -i "s/# CONFIG_PACKAGE_${base}-zh_Hans is not set/CONFIG_PACKAGE_${base}-zh_Hans=y/" .config 2>/dev/null || true
        done

        # === Enable NIC Drivers ===
        NIC_DRIVERS="kmod-e1000 kmod-e1000e kmod-igb kmod-ixgbe kmod-r8169 kmod-r8125 kmod-8139cp kmod-8139too kmod-realtek kmod-via-velocity kmod-bnx2 kmod-bnx2x kmod-tg3"
        for driver in $NIC_DRIVERS; do
            sed -i "s/# CONFIG_PACKAGE_${driver} is not set/CONFIG_PACKAGE_${driver}=y/" .config 2>/dev/null || true
        done

        # === Enable KVM/Virtualization Drivers ===
        KVM_DRIVERS="kmod-kvm kmod-kvm-amd kmod-kvm-intel kmod-virtio kmod-virtio-pci kmod-virtio-net kmod-virtio-blk kmod-virtio-scsi kmod-9p"
        for driver in $KVM_DRIVERS; do
            sed -i "s/# CONFIG_PACKAGE_${driver} is not set/CONFIG_PACKAGE_${driver}=y/" .config 2>/dev/null || true
        done

        # === Enable firewall4/nftables ===
        sed -i "s/# CONFIG_PACKAGE_firewall4 is not set/CONFIG_PACKAGE_firewall4=y/" .config 2>/dev/null || true
        sed -i "s/# CONFIG_PACKAGE_kmod-nft-tproxy is not set/CONFIG_PACKAGE_kmod-nft-tproxy=y/" .config 2>/dev/null || true

        # === Enable OpenClash dependencies ===
        OPENCLASH_DEPS="kmod-tun kmod-inet-diag ruby ruby-yaml ipset ip-full dnsmasq-full ca-bundle unzip bash kmod-bridge kmod-nft-offload hostapd-common"
        for dep in $OPENCLASH_DEPS; do
            sed -i "s/# CONFIG_PACKAGE_${dep} is not set/CONFIG_PACKAGE_${dep}=y/" .config 2>/dev/null || true
        done

        # === Run defconfig to resolve dependencies ===
        echo "=== Running make defconfig ==="
        make defconfig

        # === Verify key settings ===
        echo "=== Configuration Verification ==="
        grep -q "CONFIG_TARGET_x86_64=y" .config && echo "[OK] Target: x86_64" || echo "[MISSING] Target: x86_64"
        grep -q "CONFIG_PACKAGE_luci=y" .config && echo "[OK] LuCI: enabled" || echo "[MISSING] LuCI: disabled"
        grep -q "CONFIG_PACKAGE_ddnsto=y" .config && echo "[OK] DDNSTO: enabled" || echo "[MISSING] DDNSTO: disabled"
        grep -q "CONFIG_PACKAGE_luci-app-openclash=y" .config && echo "[OK] OpenClash: enabled" || echo "[MISSING] OpenClash: disabled"
        grep -q "CONFIG_PACKAGE_luci-app-homeproxy=y" .config && echo "[OK] HomeProxy: enabled" || echo "[MISSING] HomeProxy: disabled"
        grep -q "CONFIG_PACKAGE_luci-app-cpu-status-mini=y" .config && echo "[OK] CPU Status Mini: enabled" || echo "[MISSING] CPU Status Mini: disabled"

    - name: Build Firmware
      run: |
        cd openwrt
        echo "=== Starting firmware build ==="
        echo "CPU: $(nproc) cores"
        if make -j$(nproc) 2>&1 | tee build.log; then
            echo "Build succeeded (parallel)"
        else
            echo "Parallel build failed, retrying with serial build..."
            make -j1 V=s 2>&1 | tee build.log
        fi
        echo "=== Build complete ==="

    - name: Post-build - Configure CPU Status Mini
      run: |
        cd openwrt
        echo "Searching for cpu-status-mini files..."
        find build_dir -path "*/luci-app-cpu-status-mini*" -type f 2>/dev/null | head -10
        echo "Post-build configuration complete"

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openwrt-x86-64
        path: |
          openwrt/bin/targets/
          openwrt/bin/packages/
        retention-days: 7

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: build-log
        path: openwrt/build.log
        retention-days: 7
