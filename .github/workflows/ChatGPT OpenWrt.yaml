name: Build OpenWrt x86_64 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v6


    - name: Install build dependencies
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'


    - name: Install packages
      run: |
        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3-distutils \
          python3-setuptools \
          rsync \
          swig \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl


    - name: Clone OpenWrt source
      run: |
        git clone https://github.com/openwrt/openwrt.git

        cd openwrt

        git checkout ${OPENWRT_VERSION}


    - name: Update feeds
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    - name: Apply SONiC Fullcone patch
      working-directory: openwrt
      run: |

        curl -sSL \
        https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
        | bash


    - name: Configure OpenWrt x86_64
      working-directory: openwrt
      run: |

        cat > .config <<'EOF'

CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y


# LuCI theme
CONFIG_PACKAGE_luci-theme-bootstrap=y


# Chinese language
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y


# ttyd
CONFIG_PACKAGE_luci-app-ttyd=y


# UPnP
CONFIG_PACKAGE_miniupnpd-nftables=y
CONFIG_PACKAGE_luci-app-upnp=y


# DDNS
CONFIG_PACKAGE_ddns-scripts=y
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_ddns-scripts-cloudflare=y
CONFIG_PACKAGE_ddns-scripts-dnspod=y


# Network tools
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_ca-certificates=y


# uHTTPd
CONFIG_PACKAGE_luci-app-uhttpd=y


# Statistics
CONFIG_PACKAGE_luci-app-statistics=y
CONFIG_PACKAGE_collectd-mod-thermal=y


# Thermal / hwmon
CONFIG_PACKAGE_kmod-thermal=y
CONFIG_PACKAGE_kmod-hwmon-core=y

EOF


        make defconfig


    - name: Download packages
      working-directory: openwrt
      run: |
        make download -j$(nproc)


    - name: Build firmware
      working-directory: openwrt
      run: |
        make -j$(nproc) V=s


    - name: Upload firmware
      uses: actions/upload-artifact@v6
      with:
        name: OpenWrt-x86_64-25.12.5-firmware
        path: |
          openwrt/bin/targets/x86/64/*
