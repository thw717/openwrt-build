name: Build OpenWrt x86_64 25.12.5

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl


      - name: Clone OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout v25.12.5


      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Apply fullcone
        working-directory: openwrt
        run: |
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash


      - name: Configure
        working-directory: openwrt
        run: |
          echo 'CONFIG_TARGET_x86=y' > .config
          echo 'CONFIG_TARGET_x86_64=y' >> .config
          echo 'CONFIG_TARGET_x86_64_DEVICE_generic=y' >> .config

          echo 'CONFIG_PACKAGE_luci-theme-bootstrap=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-upnp=y' >> .config
          echo 'CONFIG_PACKAGE_miniupnpd-nftables=y' >> .config

          make defconfig


      - name: Compile
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          make -j$(nproc) V=s


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-25.12.5
          path: openwrt/bin/targets/x86/64/*
