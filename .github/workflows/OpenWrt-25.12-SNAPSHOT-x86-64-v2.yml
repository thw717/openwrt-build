name: OpenWrt-25.12-SNAPSHOT-x86-64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools python3-dev rsync unzip zlib1g-dev file wget curl ca-certificates libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libmpc-dev libmpfr-dev libreadline-dev libsqlite3-dev libtool lz4 patch pkgconf qemu-utils subversion swig time xsltproc xz-utils zstd

      - name: Clone official OpenWrt 25.12-SNAPSHOT and install feeds
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENWRT_BRANCH" "$OPENWRT_REPO" openwrt
          cd openwrt
          echo "OpenWrt commit: $(git rev-parse HEAD)"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add latest third-party packages and sonic-fullcone
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/custom
          git clone --depth 1 https://github.com/gSpotx2f/luci-app-cpu-status-mini.git package/custom/luci-app-cpu-status-mini
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/custom/luci-app-homeproxy
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -d /tmp/OpenClash/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash package/custom/
          curl -fsSL --retry 3 https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh

      - name: Integrate official DDNSTO as native OpenWrt packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://fw.koolcenter.com/binary/ddnsto/openwrt"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          for pkg in ddnsto_x86_64.ipk luci-app-ddnsto.ipk luci-i18n-ddnsto-zh-cn.ipk; do
            curl -fLsS --retry 3 --connect-timeout 20 "$BASE/$pkg" -o "$WORK/$pkg"
            test -s "$WORK/$pkg"
          done

          unpack_payload() {
            local pkg="$1" dest="$2" tmp
            tmp="$(mktemp -d)"
            if tar -tzf "$pkg" >/dev/null 2>&1; then
              tar -xzf "$pkg" -C "$tmp"
            else
              (cd "$tmp" && ar x "$pkg")
            fi
            if [ -f "$tmp/data.tar.gz" ]; then
              tar -xzf "$tmp/data.tar.gz" -C "$dest"
            elif [ -f "$tmp/data.tar.xz" ]; then
              tar -xJf "$tmp/data.tar.xz" -C "$dest"
            elif [ -f "$tmp/data.tar.zst" ]; then
              tar --zstd -xf "$tmp/data.tar.zst" -C "$dest"
            else
              echo "No supported data archive in $pkg" >&2
              rm -rf "$tmp"
              return 1
            fi
            rm -rf "$tmp"
          }

          mkdir -p package/ddnsto/files package/luci-app-ddnsto/files package/luci-i18n-ddnsto-zh-cn/files
          unpack_payload "$WORK/ddnsto_x86_64.ipk" package/ddnsto/files
          unpack_payload "$WORK/luci-app-ddnsto.ipk" package/luci-app-ddnsto/files
          unpack_payload "$WORK/luci-i18n-ddnsto-zh-cn.ipk" package/luci-i18n-ddnsto-zh-cn/files

          # Preserve the official UCI section/fields, but force factory state OFF and token empty.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("package/ddnsto/files/etc/config/ddnsto")
          if not p.is_file():
              raise SystemExit(f"Missing official config: {p}")
          s = p.read_text()
          if re.search(r"(?m)^\s*option\s+enabled\s+", s):
              s = re.sub(r"(?m)^(\s*option\s+enabled\s+).*$", r"\1'0'", s)
          else:
              m = re.search(r"(?m)^\s*config\s+ddnsto[^\n]*$", s)
              if not m: raise SystemExit("Cannot identify DDNSTO config section")
              s = s[:m.end()] + "\n\toption enabled '0'" + s[m.end():]
          if re.search(r"(?m)^\s*option\s+token\s+", s):
              s = re.sub(r"(?m)^(\s*option\s+token\s+).*$", r"\1''", s)
          else:
              m = re.search(r"(?m)^\s*config\s+ddnsto[^\n]*$", s)
              s = s[:m.end()] + "\n\toption token ''" + s[m.end():]
          p.write_text(s)
          PY

          # If official first-boot defaults create UCI settings, enforce OFF after that setup.
          DEFAULTS="package/ddnsto/files/etc/uci-defaults/ddnsto"
          if [ -f "$DEFAULTS" ]; then
            python3 - "$DEFAULTS" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          block = "\n# Factory default: DDNSTO stays off until enabled by the user.\nuci -q set 'ddnsto.@ddnsto[0].enabled=0'\nuci -q set 'ddnsto.@ddnsto[0].token='\nuci -q commit ddnsto\n"
          if "Factory default: DDNSTO stays off" not in s:
              s = s.replace("exit 0", block + "exit 0", 1) if "exit 0" in s else s + block
          p.write_text(s)
          PY
          fi

          test -f package/ddnsto/files/usr/sbin/ddnstod
          test -f package/ddnsto/files/usr/sbin/ddwebdav
          test -f package/ddnsto/files/etc/init.d/ddnsto
          chmod 0755 package/ddnsto/files/usr/sbin/ddnstod package/ddnsto/files/usr/sbin/ddwebdav package/ddnsto/files/etc/init.d/ddnsto
          [ ! -f package/ddnsto/files/etc/uci-defaults/ddnsto ] || chmod 0755 package/ddnsto/files/etc/uci-defaults/ddnsto
          [ ! -f package/luci-app-ddnsto/files/etc/uci-defaults/50_luci-ddnsto ] || chmod 0755 package/luci-app-ddnsto/files/etc/uci-defaults/50_luci-ddnsto
          [ ! -f package/luci-i18n-ddnsto-zh-cn/files/etc/uci-defaults/luci-i18n-ddnsto-zh-cn ] || chmod 0755 package/luci-i18n-ddnsto-zh-cn/files/etc/uci-defaults/luci-i18n-ddnsto-zh-cn

          cat > package/ddnsto/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=ddnsto
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1
          include $(INCLUDE_DIR)/package.mk
          define Package/ddnsto
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Official DDNSTO client
            URL:=https://www.ddnsto.com/
            DEPENDS:=+libc
          endef
          define Build/Prepare
          endef
          define Build/Configure
          endef
          define Build/Compile
          endef
          define Package/ddnsto/install
            $(INSTALL_DIR) $(1)/
            $(CP) ./files/. $(1)/
          endef
          $(eval $(call BuildPackage,ddnsto))
          EOF

          cat > package/luci-app-ddnsto/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=luci-app-ddnsto
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1
          include $(INCLUDE_DIR)/package.mk
          define Package/luci-app-ddnsto
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=3. Applications
            TITLE:=LuCI support for DDNSTO
            DEPENDS:=+ddnsto +block-mount +luci-lua-runtime
            PKGARCH:=all
          endef
          define Build/Prepare
          endef
          define Build/Configure
          endef
          define Build/Compile
          endef
          define Package/luci-app-ddnsto/install
            $(INSTALL_DIR) $(1)/
            $(CP) ./files/. $(1)/
          endef
          $(eval $(call BuildPackage,luci-app-ddnsto))
          EOF

          cat > package/luci-i18n-ddnsto-zh-cn/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=luci-i18n-ddnsto-zh-cn
          PKG_VERSION:=1.0.0
          PKG_RELEASE:=1
          include $(INCLUDE_DIR)/package.mk
          define Package/luci-i18n-ddnsto-zh-cn
            SECTION:=luci
            CATEGORY:=LuCI
            TITLE:=Simplified Chinese translation for DDNSTO
            DEPENDS:=+luci-app-ddnsto
            PKGARCH:=all
          endef
          define Build/Prepare
          endef
          define Build/Configure
          endef
          define Build/Compile
          endef
          define Package/luci-i18n-ddnsto-zh-cn/install
            $(INSTALL_DIR) $(1)/
            $(CP) ./files/. $(1)/
          endef
          $(eval $(call BuildPackage,luci-i18n-ddnsto-zh-cn))
          EOF

          test -f package/luci-app-ddnsto/files/usr/lib/lua/luci/controller/ddnsto.lua
          test -f package/luci-i18n-ddnsto-zh-cn/files/usr/lib/lua/luci/i18n/ddnsto.zh-cn.lmo

      - name: Configure OpenWrt packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y
          CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-lua-runtime=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-ixgbevf=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-atlantic=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-bnx2=y
          CONFIG_PACKAGE_kmod-bnx2x=y
          CONFIG_PACKAGE_kmod-be2net=y
          CONFIG_PACKAGE_kmod-virtio=y
          CONFIG_PACKAGE_kmod-virtio-pci=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-hyperv-net=y
          CONFIG_PACKAGE_kmod-xen-netfront=y
          CONFIG_PACKAGE_kmod-9pnet=y
          CONFIG_PACKAGE_kmod-9pvirtio=y
          CONFIG_PACKAGE_kmod-vsock-virtio=y
          EOF

          sed -i 's/^[[:space:]]*//' .config
          make defconfig
          for pkg in luci luci-theme-bootstrap luci-app-openclash luci-app-homeproxy luci-app-cpu-status-mini luci-app-ddnsto luci-i18n-ddnsto-zh-cn; do
            grep -qx "CONFIG_PACKAGE_${pkg}=y" .config || {
              echo "Required package missing after make defconfig: $pkg" >&2
              exit 1
            }
          done
          # HomeProxy's Chinese source lives in po/zh_Hans; do not force a
          # separate luci-i18n-homeproxy-zh-cn package if the repo doesn't define one.
          test -f package/custom/luci-app-homeproxy/po/zh_Hans/homeproxy.po

      - name: Set LAN and LuCI defaults
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/etc/config files/etc/uci-defaults
          cat > files/etc/config/luci <<'EOF'
          config core 'main'
              option lang 'zh_cn'
              option mediaurlbase '/luci-static/bootstrap'
          EOF
          cat > files/etc/uci-defaults/10-lan-address <<'EOF'
          #!/bin/sh
          uci -q set network.lan.ipaddr='192.168.15.1'
          uci -q set network.lan.netmask='255.255.255.0'
          uci -q commit network
          exit 0
          EOF
          cat > files/etc/uci-defaults/99-luci-language <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q set luci.main.mediaurlbase='/luci-static/bootstrap'
          uci -q commit luci
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/10-lan-address files/etc/uci-defaults/99-luci-language

      - name: Download OpenWrt sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: Verify firmware and DDNSTO payload
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find staging_dir/target-* -maxdepth 1 -type d -name 'root-*' -print -quit)"
          test -n "$ROOT"
          test -x "$ROOT/usr/sbin/ddnstod"
          test -x "$ROOT/usr/sbin/ddwebdav"
          test -x "$ROOT/etc/init.d/ddnsto"
          test -f "$ROOT/etc/config/ddnsto"
          test -f "$ROOT/usr/lib/lua/luci/controller/ddnsto.lua"
          test -f "$ROOT/usr/lib/lua/luci/i18n/ddnsto.zh-cn.lmo"
          grep -Eq "option enabled ['\"]?0['\"]?" "$ROOT/etc/config/ddnsto"
          if grep -Eq "option token ['\"][^'\"]+['\"]" "$ROOT/etc/config/ddnsto"; then
            echo "Factory DDNSTO token must be empty." >&2
            exit 1
          fi
          test -d bin/targets/x86/64
          find bin/targets/x86/64 -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find bin/targets/x86/64 -maxdepth 1 -type f \( -name '*combined*.img.gz' -o -name '*combined*.efi' -o -name '*.vmdk' -o -name '*.vdi' -o -name '*.qcow2' -o -name '*rootfs.tar.gz' \) -print -quit)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt-25.12-SNAPSHOT-x86-64
          retention-days: 14
          if-no-files-found: error
          path: |
            openwrt/bin/targets/x86/64/*
