name: DeepSeek OpenWrt 25.12.5 x86-64 Fullcone NAT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev \
            libreadline-dev libssl-dev libtool libyaml-dev lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools python3-setuptools qemu-utils re2c \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev file

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 -b v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Integrate nft-fullcone
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openwrt"

          if [ -d package/network/utils/nft-fullcone ]; then
            echo "nft-fullcone already present, skip."
          else
            echo "==> 从独立仓库拉取 nft-fullcone ..."
            rm -rf /tmp/nft-fullcone-src
            git clone --depth=1 https://github.com/fullcone-nat-nftables/nft-fullcone.git \
              /tmp/nft-fullcone-src

            mkdir -p package/network/utils/nft-fullcone
            cp -a /tmp/nft-fullcone-src/. package/network/utils/nft-fullcone/
          fi

          ls -la package/network/utils/nft-fullcone/

      - name: Patch LuCI firewall
        run: |
          set -e
          cd openwrt
          TARGET=$(grep -rl "flow_offloading" \
                     feeds/luci/applications/luci-app-firewall/htdocs/ 2>/dev/null \
                   | head -n1)
          if [ -z "$TARGET" ]; then
            echo "Anchor not found, skip."
            exit 0
          fi
          if grep -q "form.Flag, 'fullcone'" "$TARGET"; then
            echo "fullcone option already exists, skip."
            exit 0
          fi

          cat > /tmp/patch_fullcone.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          with open(p, encoding='utf-8') as f:
              lines = f.readlines()
          out = []
          inserted = False
          for line in lines:
              if (not inserted) and ("form.Flag, 'flow_offloading'" in line):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + "o = s.option(form.Flag, 'fullcone', _('Fullcone NAT'));\n")
                  out.append(indent + "o.default = '0';\n")
                  out.append(indent + "o.rmempty = false;\n")
                  out.append(indent + "o.description = _('Enable Fullcone NAT (requires kmod-nft-fullcone).');\n")
                  out.append("\n")
                  inserted = True
              out.append(line)
          if not inserted:
              print("ERROR: flow_offloading anchor not found", file=sys.stderr)
              sys.exit(1)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(''.join(out))
          print("fullcone option inserted into", p)
          PYEOF

          sed -i 's/^          //' /tmp/patch_fullcone.py
          python3 /tmp/patch_fullcone.py "$TARGET"

      - name: Prepare .config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          CONFIG_PACKAGE_kmod-nft-fullcone=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          EOF

          sed -i 's/^          //' .config
          make defconfig
          grep -q "CONFIG_PACKAGE_kmod-nft-fullcone=y" .config

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-25.12.5-fullcone
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/sha256sums
          if-no-files-found: error
          retention-days: 30
