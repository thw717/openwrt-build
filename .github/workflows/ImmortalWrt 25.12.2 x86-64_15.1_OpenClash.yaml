name: ImmortalWrt 25.12.2 x86-64_15.1_OpenClash

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget libelf-dev qemu-utils ccache

      - name: Clone ImmortalWrt source
        run: git clone --depth 1 -b v25.12.2 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add third-party packages
        run: |
          cd openwrt
          # 克隆 kenzok8 包（ddnsto）
          git clone --depth 1 https://github.com/kenzok8/openwrt-packages.git /tmp/kenzok
          cp -r /tmp/kenzok/luci-app-ddnsto package/ 2>/dev/null || true
          cp -r /tmp/kenzok/ddnsto package/ 2>/dev/null || true
          find package/ddnsto -type f -name '*.init' -exec chmod +x {} \; 2>/dev/null || true

          # 克隆 OpenClash 源码（包含插件与 Mihomo 内核编译脚本）
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash

      - name: Inject uci-defaults
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-defaults << 'EOF'
          #!/bin/sh
          sleep 5

          # 设置 LAN 地址
          uci set network.lan.ipaddr='192.168.15.1'
          uci set network.lan.netmask='255.255.255.0'
          uci set dhcp.lan.ignore='0'
          uci commit network
          uci commit dhcp

          # ddnsto 安全禁用
          if uci show ddnsto >/dev/null 2>&1; then
              uci set ddnsto.@ddnsto[0].enabled='0' 2>/dev/null || true
              uci commit ddnsto 2>/dev/null || true
          fi
          chmod +x /etc/init.d/ddnsto 2>/dev/null || true
          /etc/init.d/ddnsto disable 2>/dev/null || true
          /etc/init.d/ddnsto enable 2>/dev/null || true

          # OpenClash 默认不启动，由用户手动开启
          if uci show openclash >/dev/null 2>&1; then
              uci set openclash.config.enable='0' 2>/dev/null || true
              uci commit openclash 2>/dev/null || true
          fi
          chmod +x /etc/init.d/openclash 2>/dev/null || true

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-defaults

      - name: Configure .config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_TARGET_KERNEL_PARTSIZE=32

          # ========== LuCI 基础 ==========
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-compat=y

          # ========== 基础工具 ==========
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_jsonfilter=y

          # ========== UPnP ==========
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y

          # ========== DDNS ==========
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y

          # ========== uHTTPd ==========
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          # ========== ddnsto ==========
          CONFIG_PACKAGE_ddnsto=y
          CONFIG_PACKAGE_luci-app-ddnsto=y

          # ========== 网卡驱动 ==========
          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-igc=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-virtio-net=y

          # ========== OpenClash 插件与核心 ==========
          CONFIG_PACKAGE_luci-app-openclash=y

          # OpenClash 核心系统依赖
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_libcap=y
          CONFIG_PACKAGE_libcap-bin=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_unzip=y

          # Firewall4 (nftables) 环境下的透明代理支持
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y

          # OpenClash 内置的 Mihomo/Meta 核心
          CONFIG_PACKAGE_luci-app-openclash_META=y
          CONFIG_PACKAGE_luci-app-openclash_CORE_META=y
          EOF
          make defconfig

      - name: Verify OpenClash package
        run: |
          cd openwrt
          # 确认 OpenClash 包已被选中
          grep -E "CONFIG_PACKAGE_luci-app-openclash" .config
          # 确认核心依赖已选中
          for pkg in dnsmasq-full bash coreutils coreutils-nohup ipset ip-full libcap libcap-bin ruby ruby-yaml kmod-tun kmod-inet-diag unzip kmod-nft-tproxy; do
            grep -q "CONFIG_PACKAGE_${pkg}=y" .config || echo "WARNING: ${pkg} not selected"
          done

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt 25.12.2 x86-64_15.1_OpenClash
          path: openwrt/bin/targets/x86/64/
          retention-days: 30