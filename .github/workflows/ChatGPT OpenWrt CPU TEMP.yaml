name: Build OpenWrt 25.12.5 x86_64 SonicFullcone


on:
  workflow_dispatch:


permissions:
  contents: read


env:

  OPENWRT_VERSION: v25.12.5



jobs:

  build:

    runs-on: ubuntu-24.04



    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install build dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          curl \
          wget



    - name: Cache OpenWrt
      uses: actions/cache@v4

      with:

        path: |

          openwrt/dl

          openwrt/staging_dir

          openwrt/build_dir


        key: openwrt-${{ env.OPENWRT_VERSION }}-${{ runner.arch }}

        restore-keys: |

          openwrt-${{ env.OPENWRT_VERSION }}-



    - name: Clone OpenWrt source
      run: |

        git clone \
          https://github.com/openwrt/openwrt.git


        cd openwrt


        git checkout ${{ env.OPENWRT_VERSION }}




    - name: Update feeds
      working-directory: openwrt

      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a





    - name: Apply SONiC Fullcone
      working-directory: openwrt

      run: |


        curl -sSL \
        https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
        | bash



        echo "SONiC Fullcone applied"


    - name: Create LuCI CPU widget package
      working-directory: openwrt
      run: |


        mkdir -p package/custom/luci-app-cpu-widget/root/usr/share/luci/menu.d

        mkdir -p package/custom/luci-app-cpu-widget/htdocs/luci-static/resources/view/status/include



        cat > package/custom/luci-app-cpu-widget/Makefile <<'EOF'

include $(TOPDIR)/rules.mk


PKG_NAME:=luci-app-cpu-widget
PKG_VERSION:=1.0


include $(INCLUDE_DIR)/package.mk


define Package/luci-app-cpu-widget
SECTION:=luci
CATEGORY:=LuCI
TITLE:=CPU temperature and usage widget
DEPENDS:=+luci-base
PKGARCH:=all
endef



define Package/luci-app-cpu-widget/install

	$(INSTALL_DIR) $(1)/www/luci-static/resources/view/status/include

	$(INSTALL_DATA) \
	./htdocs/luci-static/resources/view/status/include/20_cpu.js \
	$(1)/www/luci-static/resources/view/status/include/


endef


$(eval $(call BuildPackage,luci-app-cpu-widget))

EOF




        cat > package/custom/luci-app-cpu-widget/htdocs/luci-static/resources/view/status/include/20_cpu.js <<'EOF'


'use strict';


'require baseclass';
'require fs';



function getCpuTemp()
{

	var zones=[];


	for(var i=0;i<10;i++)
	{

		zones.push(
			'/sys/class/thermal/thermal_zone'+i
		);

	}



	return Promise.all(

		zones.map(function(zone){

			return fs.read(zone+'/type')

			.then(function(type){

				if(type.trim() === 'x86_pkg_temp')
				{

					return fs.read(zone+'/temp')

					.then(function(value){

						return parseInt(value)/1000;

					});

				}


				return null;


			})

			.catch(function(){

				return null;

			});


		})

	)


	.then(function(result){


		for(var i=0;i<result.length;i++)
		{

			if(result[i] !== null)
				return result[i];

		}


		return null;


	});


}




var lastTotal=0;

var lastIdle=0;



function getCpuUsage()
{


	return fs.read('/proc/stat')

	.then(function(data){


		var cpu=data.split('\n')[0]
		.trim()
		.split(/\s+/);



		var user=parseInt(cpu[1]);

		var nice=parseInt(cpu[2]);

		var system=parseInt(cpu[3]);

		var idle=parseInt(cpu[4]);



		var total=user+nice+system+idle;



		var usage=null;



		if(lastTotal)
		{

			usage =
			100 -
			((idle-lastIdle) /
			(total-lastTotal) *
			100);

		}



		lastTotal=total;

		lastIdle=idle;



		return usage;


	});


}




return baseclass.extend({

	render: function(){


		var box=E('div',
		{
			'class':'cbi-section'
		},
		[

			E('h3',
			{},
			'CPU状态'
			),


			E('div',
			{
				'id':'cpu-temp-widget'
			},
			'CPU温度读取中...'
			),


			E('div',
			{
				'id':'cpu-load-widget'
			},
			'CPU占用读取中...'
			)

		]);




		function update()
		{


			getCpuTemp()

			.then(function(t){

				if(t !== null)

				document
				.getElementById('cpu-temp-widget')
				.innerHTML =
				'CPU温度: '+
				t.toFixed(1)+
				' ℃';


			});




			getCpuUsage()

			.then(function(u){

				if(u !== null)

				document
				.getElementById('cpu-load-widget')
				.innerHTML =
				'CPU占用: '+
				u.toFixed(1)+
				'%';


			});


		}



		update();


		window.setInterval(update,5000);



		return box;


	}


});


EOF





    - name: Enable custom package feed
      working-directory: openwrt
      run: |

        echo "src-link custom ./package/custom" >> feeds.conf.default

        ./scripts/feeds update custom

        ./scripts/feeds install -a -p custom




    - name: Configure OpenWrt
      working-directory: openwrt
      run: |


        cat > .config <<'EOF'


CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y



CONFIG_PACKAGE_luci-theme-bootstrap=y



CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y



CONFIG_PACKAGE_luci-app-ttyd=y



CONFIG_PACKAGE_miniupnpd-nftables=y

CONFIG_PACKAGE_luci-app-upnp=y



CONFIG_PACKAGE_ddns-scripts=y

CONFIG_PACKAGE_luci-app-ddns=y

CONFIG_PACKAGE_ddns-scripts-cloudflare=y

CONFIG_PACKAGE_ddns-scripts-dnspod=y



CONFIG_PACKAGE_curl=y

CONFIG_PACKAGE_ca-certificates=y



CONFIG_PACKAGE_luci-app-uhttpd=y



CONFIG_PACKAGE_luci-app-statistics=y

CONFIG_PACKAGE_collectd-mod-thermal=y



CONFIG_PACKAGE_kmod-thermal=y

CONFIG_PACKAGE_kmod-hwmon-core=y



CONFIG_PACKAGE_luci-app-cpu-widget=y


EOF



        make defconfig





    - name: Download packages
      working-directory: openwrt
      run: |

        make download -j$(nproc)





    - name: Build firmware
      working-directory: openwrt
      run: |

        make -j$(nproc) V=s





    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: OpenWrt-25.12.5-x86_64-SonicFullcone-CPUWidget

        path: |

          openwrt/bin/targets/x86/64/*
