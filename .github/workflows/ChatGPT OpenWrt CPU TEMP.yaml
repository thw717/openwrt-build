name: Build OpenWrt 25.12.5 x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file curl wget ca-certificates

      - name: Restore OpenWrt cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: openwrt-${{ env.OPENWRT_VERSION }}-x86_64-${{ runner.os }}
          restore-keys: |
            openwrt-${{ env.OPENWRT_VERSION }}-x86_64-
            openwrt-${{ env.OPENWRT_VERSION }}-

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch "${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply SONiC Fullcone
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          curl -fsSL \
            https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh \
            -o /tmp/add_sonic_fullcone.sh
          bash /tmp/add_sonic_fullcone.sh
          rm -f /tmp/add_sonic_fullcone.sh

      - name: Create LuCI CPU widget package
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          mkdir -p \
            package/custom/luci-app-cpu-widget/htdocs/luci-static/resources/view/status/include \
            package/custom/luci-app-cpu-widget/root/usr/share/rpcd/acl.d

          cat > package/custom/luci-app-cpu-widget/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=luci-app-cpu-widget
          PKG_VERSION:=1.0
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/luci-app-cpu-widget
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=Applications
            TITLE:=LuCI CPU temperature and usage widget
            DEPENDS:=+luci-base
            PKGARCH:=all
          endef

          define Package/luci-app-cpu-widget/install
            $(INSTALL_DIR) $(1)/www/luci-static/resources/view/status/include
            $(INSTALL_DATA) ./htdocs/luci-static/resources/view/status/include/20_cpu.js \
              $(1)/www/luci-static/resources/view/status/include/20_cpu.js
            $(INSTALL_DIR) $(1)/usr/share/rpcd/acl.d
            $(INSTALL_DATA) ./root/usr/share/rpcd/acl.d/luci-app-cpu-widget.json \
              $(1)/usr/share/rpcd/acl.d/luci-app-cpu-widget.json
          endef

          $(eval $(call BuildPackage,luci-app-cpu-widget))
          EOF

          cat > package/custom/luci-app-cpu-widget/root/usr/share/rpcd/acl.d/luci-app-cpu-widget.json <<'EOF'
          {
            "luci-app-cpu-widget": {
              "description": "Read CPU temperature and CPU statistics",
              "read": {
                "file": {
                  "/proc/stat": [ "read" ],
                  "/sys/class/thermal/thermal_zone*/type": [ "read" ],
                  "/sys/class/thermal/thermal_zone*/temp": [ "read" ]
                },
                "ubus": {
                  "file": [ "read" ]
                }
              }
            }
          }
          EOF

          cat > package/custom/luci-app-cpu-widget/htdocs/luci-static/resources/view/status/include/20_cpu.js <<'EOF'
          'use strict';
          'require baseclass';
          'require fs';
          'require poll';

          var tempZones = [];

          function readTempZones() {
            if (tempZones.length)
              return Promise.resolve(tempZones);

            var zones = [];
            for (var i = 0; i < 16; i++)
              zones.push('/sys/class/thermal/thermal_zone' + i);

            return Promise.all(zones.map(function(zone) {
              return fs.read(zone + '/type').then(function(type) {
                if (type && type.trim() === 'x86_pkg_temp')
                  return zone;
                return null;
              }).catch(function() {
                return null;
              });
            })).then(function(result) {
              tempZones = result.filter(function(zone) {
                return zone !== null;
              });
              return tempZones;
            });
          }

          function readTemperature() {
            return readTempZones().then(function(zones) {
              if (!zones.length)
                return null;
              return fs.read(zones[0] + '/temp').then(function(value) {
                var temp = parseInt(value, 10);
                return Number.isFinite(temp) ? temp / 1000 : null;
              }).catch(function() {
                return null;
              });
            });
          }

          var lastTotal = null;
          var lastIdle = null;

          function readCpuUsage() {
            return fs.read('/proc/stat').then(function(data) {
              var line = data.split('\n')[0].trim();
              var fields = line.split(/\s+/);
              if (fields[0] !== 'cpu' || fields.length < 5)
                return null;

              var user = parseInt(fields[1], 10) || 0;
              var nice = parseInt(fields[2], 10) || 0;
              var system = parseInt(fields[3], 10) || 0;
              var idle = parseInt(fields[4], 10) || 0;
              var total = user + nice + system + idle;
              var usage = null;

              if (lastTotal !== null && total > lastTotal) {
                usage = 100 * (1 - ((idle - lastIdle) / (total - lastTotal)));
                usage = Math.max(0, Math.min(100, usage));
              }

              lastTotal = total;
              lastIdle = idle;
              return usage;
            }).catch(function() {
              return null;
            });
          }

          return baseclass.extend({
            title: _('CPU'),

            load: function() {
              return Promise.all([readTemperature(), readCpuUsage()]);
            },

            render: function(data) {
              var temp = data[0];
              var usage = data[1];

              var table = E('table', { 'class': 'table' });

              table.appendChild(E('tr', { 'class': 'tr' }, [
                E('td', { 'class': 'td left', 'width': '33%' }, [_('CPU Temperature')]),
                E('td', { 'class': 'td left', 'id': 'cpu-widget-temp' }, [
                  temp !== null ? '%.1f °C'.format(temp) : _('x86_pkg_temp not found')
                ])
              ]));

              table.appendChild(E('tr', { 'class': 'tr' }, [
                E('td', { 'class': 'td left', 'width': '33%' }, [_('CPU Usage')]),
                E('td', { 'class': 'td left', 'id': 'cpu-widget-usage' }, [
                  usage !== null ? '%.1f %%'.format(usage) : _('Collecting...')
                ])
              ]));

              poll.add(function() {
                return Promise.all([readTemperature(), readCpuUsage()]).then(function(values) {
                  var t = document.getElementById('cpu-widget-temp');
                  var u = document.getElementById('cpu-widget-usage');

                  if (t)
                    t.textContent = values[0] !== null
                      ? '%.1f °C'.format(values[0])
                      : _('x86_pkg_temp not found');

                  if (u && values[1] !== null)
                    u.textContent = '%.1f %%'.format(values[1]);
                });
              }, 5);

              return table;
            }
          });
          EOF

      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          CONFIG_PACKAGE_luci-app-ttyd=y

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y

          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y

          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y

          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y

          CONFIG_PACKAGE_luci-app-cpu-widget=y
          EOF

          make defconfig

      - name: Verify custom CPU widget
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          test -f package/custom/luci-app-cpu-widget/Makefile
          test -f package/custom/luci-app-cpu-widget/htdocs/luci-static/resources/view/status/include/20_cpu.js
          test -f package/custom/luci-app-cpu-widget/root/usr/share/rpcd/acl.d/luci-app-cpu-widget.json
          grep -q '^CONFIG_PACKAGE_luci-app-cpu-widget=y$' .config

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          make -j"$(nproc)" V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.5-x86_64-SonicFullcone-CPUWidget
          path: openwrt/bin/targets/x86/64/*
          if-no-files-found: error
