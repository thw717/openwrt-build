name: Build OpenWrt 25.12.6 x86_64 (DDNSTO + Sonic + OpenClash + HomeProxy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenWrt Source
        uses: actions/checkout@v5
        with:
          repository: openwrt/openwrt
          ref: v25.12.6
          path: openwrt

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Update and Install Official Feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ========== 新增：拉取 OpenClash / HomeProxy / sing-box ==========
      - name: Fetch Third-Party Packages (OpenClash + HomeProxy + sing-box)
        working-directory: ./openwrt
        run: |
          # 1. OpenClash：仓库根目录即 luci-app-openclash 包源码
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/luci-app-openclash

          # 2. HomeProxy：仓库根目录即 luci-app-homeproxy 包源码
          git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/luci-app-homeproxy

          # 3. sing-box：HomeProxy 的硬依赖，从 immortalwrt/packages 中提取
          git clone --depth 1 https://github.com/immortalwrt/packages.git /tmp/imm-packages
          cp -r /tmp/imm-packages/net/sing-box package/sing-box
          rm -rf /tmp/imm-packages
      # ================================================================

      - name: Apply SONiC FullCone Patch
        working-directory: ./openwrt
        run: |
          curl -sSL https://raw.githubusercontent.com/mufeng05/openwrt-sonic-fullcone/master/add_sonic_fullcone.sh | bash

      - name: Fix DDNSTO Default Disabled & Inject UCI Defaults
        working-directory: ./openwrt
        run: |
          DDNSTO_CONFIG=$(find package -type f -name "ddnsto.config" | head -n 1)
          if [ -n "$DDNSTO_CONFIG" ]; then
            sed -i "s/option enabled '1'/option enabled '0'/g" "$DDNSTO_CONFIG"
            sed -i 's/option enabled "1"/option enabled "0"/g' "$DDNSTO_CONFIG"
          fi

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-settings <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.15.1'
          uci commit network

          uci set luci.main.lang='zh_cn'
          uci commit luci

          if uci get cpu-status.@cpu-status[0] >/dev/null 2>&1; then
            uci set cpu-status.@cpu-status[0].interval='1'
            uci commit cpu-status
          fi

          if uci get ddnsto.@ddnsto[0] >/dev/null 2>&1; then
            uci set ddnsto.@ddnsto[0].enabled='0'
            uci commit ddnsto
          fi
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-settings

      - name: Configure Build (.config)
        working-directory: ./openwrt
        run: |
          make defconfig

          cat >> .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y

          # 基础中文与主题
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # 用户指定工具
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_ddns-scripts-dnspod=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-zh-cn=y

          # 统计与温度
          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd-mod-thermal=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_luci-i18n-statistics-zh-cn=y

          # DDNSTO
          CONFIG_PACKAGE_luci-app-ddnsto=y

          # CPU Status Mini
          CONFIG_PACKAGE_luci-app-cpu-status-mini=y

          # ===== 新增：OpenClash + HomeProxy =====
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_luci-compat=y
          # =======================================

          # 主流网卡驱动
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-ixgbe=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          EOF

          make defconfig

      - name: Compile Firmware
        working-directory: ./openwrt
        run: |
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-25.12.6-x86_64-custom
          path: openwrt/bin/targets/x86/64/
          retention-days: 7