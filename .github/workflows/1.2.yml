name: Build ImmortalWrt 25.12 x86_64 OpenClash SSRPlus

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk gettext gcc-multilib git libncurses-dev libssl-dev python3 rsync unzip wget curl zstd ccache

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 -b ${OPENWRT_BRANCH} https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Add OpenClash
        run: |
          cd openwrt/package
          for i in 1 2 3; do
            git clone --depth=1 https://github.com/vernesong/OpenClash.git OpenClash && break || rm -rf OpenClash
            sleep 10
          done
          mv OpenClash/luci-app-openclash luci-app-openclash
          rm -rf OpenClash

      - name: Add SSR Plus
        run: |
          cd openwrt/package
          for i in 1 2 3; do
            git clone --depth=1 https://github.com/fw876/helloworld.git helloworld && break || rm -rf helloworld
            sleep 10
          done

      - name: Embed Mihomo Core
        run: |
          cd openwrt
          mkdir -p package/luci-app-openclash/root/etc/openclash/core

          for i in 1 2 3; do
            CORE_URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep browser_download_url | grep linux-amd64-compatible | grep '.gz' | cut -d '"' -f4 | head -n1)
            if [ -n "${CORE_URL}" ]; then
              wget "${CORE_URL}" -O /tmp/clash_meta.gz && break
            fi
            sleep 10
          done

          gzip -d /tmp/clash_meta.gz
          mv /tmp/clash_meta package/luci-app-openclash/root/etc/openclash/core/clash_meta
          chmod 755 package/luci-app-openclash/root/etc/openclash/core/clash_meta

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_v2ray-core=y
          CONFIG_PACKAGE_trojan=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_PACKAGE_kmod-e1000=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-igb=y
          CONFIG_PACKAGE_kmod-r8169=y
          CONFIG_PACKAGE_kmod-tg3=y
          CONFIG_PACKAGE_kmod-virtio-net=y
          CONFIG_PACKAGE_kmod-vmxnet3=y

          CONFIG_PACKAGE_kmod-crypto-aesni=y
          CONFIG_PACKAGE_libopenssl=y
          EOF

          make defconfig

      - name: Set default LAN IP
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-default-lan-ip <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.1.2'
          uci set network.lan.netmask='255.255.255.0'
          uci set dhcp.lan.start='100'
          uci set dhcp.lan.limit='151'
          uci commit network
          uci commit dhcp
          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-default-lan-ip

      - name: Compile firmware
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12-x86_64-E3-1265L-v2-OpenClash-SSRPlus
          compression-level: 9
          path: openwrt/bin/targets/x86/64/*
